}
function endBattle(result){ if (!battle || battle.over) return; battle.over = true; battle.result = result; battle.endT = result === 'flee' ? 0.3 : 1.8; }
function levelUp(m, log){
  const st0 = stageOf(m);
  while (m.xp >= xpNext(m)){
    m.xp -= xpNext(m);
    const a = stats(m); m.level++; const b = stats(m);
    m.maxHp = b.maxHp; m.hp += b.maxHp - a.maxHp;
    log.push(`${m.nick} subiu pro nível ${m.level}! FOR +${(b.str - a.str).toFixed(1)} · AGI +${(b.agi - a.agi).toFixed(1)} · INT +${(b.int - a.int).toFixed(1)}`);
  }
  if (stageOf(m) > st0) evoQueue.push({m, st0});
}

/* Evolução: o animal que está com você sobe num casulo de luz e sai na forma nova; quem está na reserva só avisa */
let evoQueue = [], evo = null;
const EVO_SWAP = 2.0, EVO_END = 3.6;
function runEvolutions(){
  while (evoQueue.length){
    const e = evoQueue.shift(), old = formName(e.m.species, e.st0), nu = formName(e.m.species, stageOf(e.m));
    const before = e.m.nick;
    if (e.m.nick === old) e.m.nick = nu;
    if (!evo && mode === 'world' && follower && follower.member === e.m && !follower.removed){ startEvo(follower, before, nu); continue; }
    setTimeout(() => toast(`${before} evoluiu para ${nu}!`), 1500);
  }
}
function startEvo(c, before, nu){
  mode = 'evo'; setPrompt('');
  const p = c.torso.position, col = ATTR[c.sp.attr].color;
  const fx = new T.Group(); fx.position.set(p.x, 0, p.z); scene.add(fx);
  const glow = (color, o) => new T.MeshBasicMaterial({color, transparent:true, opacity:o, depthWrite:false, blending:T.AdditiveBlending});
  const pillar = new T.Mesh(new T.CylinderGeometry(1, 1, 14, 24, 1, true), glow(col, 0)); pillar.position.y = 7; fx.add(pillar);
  const cocoon = new T.Mesh(GS, new T.MeshBasicMaterial({color:'#ffffff', transparent:true, opacity:0, depthWrite:false})); fx.add(cocoon);
  const halo = new T.Mesh(GS, glow(col, 0)); fx.add(halo);
  const loops = [0, 1, 2].map(i => { const m = new T.Mesh(new T.TorusGeometry(1, 0.05, 6, 32), glow(i === 1 ? '#ffffff' : col, 0.9)); m.rotation.x = Math.PI/2; fx.add(m); return m; });
  evo = {c, before, nu, t:0, fx, pillar, cocoon, halo, loops, size:c.H + c.d.hr*2, swapped:false};
  c.input = {}; trainer.yaw = Math.atan2(p.x - trainer.pos.x, p.z - trainer.pos.z);
  showEvoText(`${before} está evoluindo...`, '');
}
function showEvoText(a, b){
  const el = $('evo'); el.querySelector('b').textContent = a; el.querySelector('span').textContent = b;
  el.classList.toggle('show', !!(a || b));
}
function stepEvo(dt){
  const e = evo; e.t += dt; trainer.moving = false;
  const t = e.t, c = e.c, up = Math.min(1, t/1.4)*1.4;
  // segura o animal flutuando no meio da luz
  if (!c.removed){
    const tp = c.torso.position;
    for (const p of c.parts){ p.velocity.x *= 0.85; p.velocity.z *= 0.85; }
    c.torso.velocity.y = (c.H + up - tp.y)*6; c.torso.angularVelocity.y = t < EVO_SWAP ? 3 + t*4 : 2;
    e.fx.position.x += (tp.x - e.fx.position.x)*0.2; e.fx.position.z += (tp.z - e.fx.position.z)*0.2;
  }
  const y = c.H*0.6 + up, k = t < EVO_SWAP ? Math.min(1, t/EVO_SWAP) : Math.max(0, 1 - (t - EVO_SWAP)/0.9);
  const R = Math.max(e.size, 1.2)*0.75;
  e.pillar.scale.set(R*(0.6 + k*0.6), 1, R*(0.6 + k*0.6)); e.pillar.material.opacity = (t < EVO_SWAP ? k : Math.max(0, 1 - (t - EVO_SWAP)/1.4))*0.45;
  e.cocoon.position.y = e.halo.position.y = y;
  e.cocoon.scale.setScalar(R*(0.3 + k*0.85)); e.cocoon.material.opacity = Math.pow(k, 1.5)*0.95;
  e.halo.scale.setScalar(R*(0.5 + k*1.1) + Math.sin(t*20)*0.05); e.halo.material.opacity = k*0.5;
  e.loops.forEach((m, i) => {
    const a = t*(3 + i) + i*2.1;
    m.position.y = y + Math.sin(a)*R*0.9; m.scale.setScalar(R*(1.1 + 0.25*i)*(0.4 + k*0.8));
    m.rotation.set(Math.PI/2 + Math.sin(a*0.7)*0.4, 0, a*0.5); m.material.opacity = k*0.9;
  });
  if (t < EVO_SWAP && Math.random() < 0.5) burst({x:e.fx.position.x + rand(-R, R), y:rand(0.1, 0.5), z:e.fx.position.z + rand(-R, R)}, 1, ['#ffffff', ATTR[c.sp.attr].color, '#f2c230'], 4);
  shake(t < EVO_SWAP ? 0.04 + k*0.08 : 0);
  if (!e.swapped && t >= EVO_SWAP){
    // flash: o corpo velho some dentro da luz e nasce o novo, no mesmo lugar
    e.swapped = true;
    const x = c.torso.position.x, z = c.torso.position.z, yaw = c.yaw;
    destroyCreature(c);
    const n = makeCreature(c.member, x, z, 'follower');
    n.yaw = yaw; for (const p of n.parts) p.position.y += up;
    follower = n; e.c = n;
    const fl = $('flash'); fl.style.transition = 'none'; fl.style.opacity = 1;
    requestAnimationFrame(() => { fl.style.transition = ''; fl.style.opacity = 0; });
    burst({x, y:y, z}, 60, ['#ffffff', ATTR[n.sp.attr].color, '#f2c230'], 7);
    shockwave(x, z, '#ffffff', 5); shockwave(x, z, ATTR[n.sp.attr].color, 3.5); shake(0.5);
    showEvoText(`${e.before} evoluiu para`, `${e.nu}!`);
    trainer.cheerT = 2.5; teamKey = ''; renderTeam();
  }
  if (t >= EVO_END){
    scene.remove(e.fx); e.fx.traverse(o => { if (o.material) o.material.dispose(); if (o.geometry && o.geometry !== GS) o.geometry.dispose(); });
    evo = null; mode = 'world';
    setTimeout(() => { if (!evo) showEvoText('', ''); }, 1000);
    toast(`${e.before} virou ${tierName(e.c.member)}: ${e.nu}! FOR, AGI e INT subiram.`);
    save(); setHud(); runEvolutions();
  }
}
function finishBattle(){
  const r = battle.result, W = battle.wild, lead = battle.member, log = [], B = W.boss, bk = B ? 2 : 1;
  let bossMsg = null;
  if (r === 'win' || r === 'capture'){
    if (B) bossMsg = bossReward(B, r);
    if (r === 'capture'){
      // chefe capturado perde os PV extras de covil, mas continua com coroa e 10% a mais nos atributos
      if (W.member.wildBoss){ const old = W.member.maxHp; delete W.member.wildBoss; W.member.maxHp = stats(W.member).maxHp; W.member.hp = Math.round(W.member.hp*W.member.maxHp/old); }
      W.member.hp = Math.max(1, W.member.hp);
      if (game.team.length < TEAM_MAX){ game.team.push(W.member); log.push(`${W.member.nick} (Nv. ${W.member.level}) entrou pro seu time!`); }
      else { game.box.push(W.member); log.push(`Time cheio: ${W.member.nick} foi pra Caixa de Animais, ao lado do Centro de Cura.`); }
    }
    const xp = Math.round(((r === 'capture' ? 10 : 15) + 10*W.member.level)*bk);
    trainer.cheerT = Math.max(trainer.cheerT, 1.8);
    // todos os animais vivos do time ganham XP: quem lutou ganha cheio, quem ficou na reserva ganha metade
    const alive = game.team.filter(m => m.hp > 0 && m !== W.member);
    const fought = battle.fought || new Set([lead]);
    const half = Math.round(xp*0.5);
    const fighters = alive.filter(m => fought.has(m)), bench = alive.filter(m => !fought.has(m));
    for (const m of fighters) m.xp += xp;
    for (const m of bench) m.xp += half;
    if (fighters.length) log.push(`${fighters.map(m => m.nick).join(' e ')} ${fighters.length > 1 ? 'lutaram e ganharam' : 'lutou e ganhou'} ${xp} XP.`);
    if (bench.length) log.push(`Na reserva: ${bench.map(m => m.nick).join(', ')} ${bench.length > 1 ? 'ganharam' : 'ganhou'} ${half} XP.`);
    for (const m of alive) levelUp(m, log);
    const coins = Math.round(((r === 'capture' ? 10 : 25) + (r === 'capture' ? 5 : 10)*W.member.level)*(B ? 3 : 1));
    game.money += coins; log.push(`Você ganhou ${coins} moedas.`);
  }
  if (r === 'flee'){ log.push('Você fugiu!'); W.role = 'wild'; W.cool = 6; W.ai = {t:0, target:null}; W.input = {}; W.confused = 0; if (B) W.member.hp = W.member.maxHp; }
  else if (!W.dead) destroyCreature(W);
  const mon = battle.mon;
  battle = null; mode = 'world';
  ringMesh.visible = false; reticle.visible = false;
  for (const rk of rocks.slice()) removeRock(rk);
  if (r === 'lose'){
    if (!mon.dead) destroyCreature(mon);
    blackout(); save(); return;
  }
  if (mon.dead || mon.fainted){ if (!mon.dead) destroyCreature(mon); spawnFollower(); }
  else { mon.role = 'follower'; follower = mon; mon.input = {}; mon.confused = 0; }
  if (bossMsg) log.unshift(bossMsg);
  log.forEach((l, i) => setTimeout(() => toast(l), i*400));
  save(); setHud();
  // a faixa da chave aparece primeiro; a evolução (se tiver) vem depois
  if (bossMsg) setTimeout(runEvolutions, 2800); else runEvolutions();
}
function blackout(){
  $('fade').style.opacity = 1;
  setTimeout(() => {
    // corre pro Centro de Cura mais perto, na frente do tapete
    const h = nearestSpot('heal', trainer.pos.x, trainer.pos.z), p = rotPt(h.b, 0, h.lz + 1.5);
    healAll(); trainer.pos.set(p.x, 0, p.z); trainer.yaw = h.b.ry || 0;
    spawnFollower(); setHud();
    $('fade').style.opacity = 0;
    toast('Todos desmaiaram... Você correu pro Centro de Cura.');
    toast('Seu time foi curado.');
  }, 700);
}
function healAll(){ for (const m of game.team){ m.maxHp = stats(m).maxHp; m.hp = m.maxHp; } save(); renderTeam(); }

const SHELL = {bolota:['#d39a5c','#6b4426'], pinha:['#8f5a2f','#5e3a1c'], coco:['#5b3a1f','#7a5230'], semente:['#f2c230','#fff1a8']};
function cycleCapture(dir=1){
  const owned = CAPTURE_KEYS.filter(k => count(k) > 0);
  if (!owned.length){ toast('Você não tem itens de captura. Compre na loja.'); return; }
  const i = owned.indexOf(game.sel);
  game.sel = owned[(i + dir + owned.length) % owned.length];
  toast(`Arremesso: ${ITEMS[game.sel].name} (${count(game.sel)})`); setHud();
}
const balls = [];
function throwBall(target){
  if (!battle || battle.over || battle.capture || trainer.throwT > 0) return;
  if (count(game.sel) <= 0){
    const other = CAPTURE_KEYS.find(k => count(k) > 0);
    if (!other){ toast('Acabaram os itens de captura! Compre mais na loja.'); return; }
    game.sel = other;
  }
  const itemKey = game.sel;
  const f = trainerFwd();
  const sx = trainer.pos.x + f.x*0.4, sy = 1.7, sz = trainer.pos.z + f.z*0.4;
  const tx = target.x, ty = (target.y || 0) + 0.7, tz = target.z;
  const d = Math.hypot(tx - sx, tz - sz), tf = clamp(d/10, 0.4, 1.1);
  const mask = ALL & ~G_TRAINER & ~G_BALL;
  const ball = new C.Body({mass:0.3, shape:new C.Sphere(0.17), material:bodyMat, position:new C.Vec3(sx, sy, sz), collisionFilterGroup:G_BALL, collisionFilterMask:mask, linearDamping:0.1});
  ball.velocity.set((tx - sx)/tf, (ty - sy + 0.5*GRAV*tf*tf)/tf, (tz - sz)/tf);
  ball.angularVelocity.set(rand(-8,8), 0, rand(-8,8));
  ball.isBall = true; ball.used = false; ball.born = clock; ball.item = itemKey; ball.ignore = battle.mon;
  ball.addEventListener('collide', e => onCollide(ball, e.body));
  world.addBody(ball);
  const m = makeItemMesh(itemKey); m.scale.setScalar(1.15); scene.add(m);
  balls.push({body:ball, mesh:m, item:itemKey});
  trainer.yaw = Math.atan2(tx - trainer.pos.x, tz - trainer.pos.z);
  trainer.throwT = 0.6; addItem(itemKey, -1);
  if (count(itemKey) <= 0){ const o = CAPTURE_KEYS.find(k => count(k) > 0); if (o) game.sel = o; }
  save(); setHud();
}
function removeBall(b){ world.removeBody(b.body); scene.remove(b.mesh); balls.splice(balls.indexOf(b), 1); }
function removeRock(r){ world.removeBody(r.body); scene.remove(r.mesh); rocks.splice(rocks.indexOf(r), 1); }
function startCapture(ballBody){
  const W = battle && battle.wild;
  if (!W || battle.capture || battle.over || W.removed || W.fainted) return;
  ballBody.used = true;
  const hpR = W.member.hp/W.member.maxHp;
  const it = ITEMS[ballBody.item];
  const base = 0.12 + 0.72*(1 - hpR) + (W.ko > 0 ? 0.2 : 0) + (W.confused > 0 ? 0.08 : 0);
  // chefe resiste: só 40% da chance normal (a Semente Dourada continua garantida)
  const chance = it.mult >= 99 ? 1 : clamp(base*it.mult*(W.member.wildBoss ? 0.4 : 1), 0.05, 0.97);
  const success = Math.random() < chance;
  const breakAt = success ? 99 : (Math.random() < chance ? 3 : Math.random() < 0.5 ? 2 : 1);
  // cipós e folhas puxam o animal pra dentro da casca
  const wp = W.torso.position;
  for (let i = 0; i < 22; i++){
    const a = i/22*TAU*2, r = 0.9 - i*0.03;
    burst({x:wp.x + Math.cos(a)*r, y:0.2 + i*0.05, z:wp.z + Math.sin(a)*r}, 1, ['#4aaa4f','#8fd27a','#3f8a3a'], 1);
  }
  shockwave(wp.x, wp.z, '#8fd27a', 1.5);
  hideCreature(W);
  ballBody.velocity.set(0, 5, 0); ballBody.angularVelocity.set(0, 0, 0);
  ballBody.linearDamping = 0.5; ballBody.angularDamping = 0.99;
  battle.capture = {ball:balls.find(b => b.body === ballBody), t:0, shakes:0, success, breakAt};
  toast(`${it.name} fechou ${W.member.nick} lá dentro! (${Math.round(chance*100)}% de chance)`);
}
function sprout(ballObj){
  const g = new T.Group();
  add(g, GY, toon('#3f8a3a'), [0, 0.1, 0], [0.02, 0.2, 0.02]);
  add(g, GS, toon('#4aaa4f'), [0.08, 0.2, 0], [0.1, 0.02, 0.05], [0, 0, 0.5]);
  add(g, GS, toon('#5fc25a'), [-0.07, 0.17, 0], [0.08, 0.018, 0.04], [0, 0, -0.5]);
  g.position.y = 0.15; g.scale.setScalar(0.01);
  ballObj.mesh.add(g); ballObj.sprout = g;
}
function updateCapture(dt){
  const cap = battle.capture; if (!cap) return;
  cap.t += dt;
  const n = Math.floor((cap.t - 0.4)/0.85);
  const ph = ((cap.t - 0.4) % 0.85)/0.85;
  cap.wob = cap.t > 0.4 && ph < 0.4 ? Math.sin(ph/0.4*TAU)*0.5 : 0;
  if (n > cap.shakes && n >= 1){
    cap.shakes = n;
    const W = battle.wild, bp = cap.ball.body.position;
    if (cap.shakes >= cap.breakAt){
      burst(bp, 22, SHELL[cap.ball.item] || ['#ffffff'], 5);
      showCreature(W, bp.x, W.H + 0.4, bp.z);
      removeBall(cap.ball); battle.capture = null;
      toast(pick(['Ah não! Quebrou a casca e escapou!', 'Quase! Saiu lá de dentro!', 'Argh! Parecia que ia dar!']));
    } else if (cap.shakes >= 3 && cap.success){
      cap.done = true; cap.wob = 0;
      sprout(cap.ball);
      burst(bp, 30, ['#ffe066','#ffffff','#8fd27a'], 5);
      trainer.cheerT = 2.2;
      toast(`Peguei! ${W.member.nick} foi capturado! A ${ITEMS[cap.ball.item].name.toLowerCase()} brotou.`);
      setTimeout(() => { if (cap.ball && balls.includes(cap.ball)) removeBall(cap.ball); }, 1500);
      endBattle('capture');
    } else floatText({x:bp.x, y:bp.y + 0.3, z:bp.z}, '...', '#ffffff', 22);
  }
}
function switchTo(i){
  if (mode === 'world'){
    const m = game.team[i]; if (!m || m.hp <= 0 || i === 0) return;
    game.team.splice(i, 1); game.team.unshift(m); spawnFollower(); toast(`${m.nick} agora te acompanha.`); save(); return;
  }
  if (!battle || battle.over || battle.capture || battle.switchCd > 0) return;
  const m = game.team[i]; if (!m || m.hp <= 0 || m === battle.member) return;
  const old = battle.mon;
  burst(old.torso.position, 12, ['#ffffff','#ff5a36'], 3);
  destroyCreature(old);
  game.team.splice(i, 1); game.team.unshift(m);
  const f = trainerFwd();
  battle.mon = makeCreature(m, trainer.pos.x + f.x*1.2, trainer.pos.z + f.z*1.2, 'fighter');
  battle.member = m; battle.switchCd = 1.5; battle.faintT = 0;
  if (battle.fought) battle.fought.add(m);
  toast(`Volta! Vai, ${m.nick}!`); setHud();
}
function battleUpdate(dt){
  const b = battle, P = b.mon, W = b.wild;
  b.switchCd -= dt;
  if (b.pvp){
    for (const c of creatures){
      if (c.removed) continue;
      const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz) || 0.01;
      if (c === P || c === W){ if (d > b.R){ const k = (d - b.R)*c.totalMass*40; c.torso.force.x -= dx/d*k; c.torso.force.z -= dz/d*k; } }
      else if (d < b.R + 1){ c.torso.force.x += dx/d*c.totalMass*30; c.torso.force.z += dz/d*c.totalMass*30; }
    }
    return;
  }
  if (b.over){ b.endT -= dt; if (W.fainted && !W.removed) W.fade = Math.max(0, W.fade - dt*0.8); if (b.endT <= 0) finishBattle(); return; }
  updateCapture(dt);
  if (!battle) return;
  for (const c of [P, W]){
    if (c.removed) continue;
    const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz);
    if (d > b.R){ const k = (d - b.R)*c.totalMass*40; c.torso.force.x -= dx/d*k; c.torso.force.z -= dz/d*k; }
  }
  for (const c of creatures){
    if (c === P || c === W || c.removed) continue;
    const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz);
    if (d < b.R + 1 && d > 0.01){ c.torso.force.x += dx/d*c.totalMass*30; c.torso.force.z += dz/d*c.totalMass*30; }
  }
  if (W.fainted && !W.removed) endBattle('win');
  if (P.fainted){
    b.faintT += dt;
    if (b.faintT > 1.6){
      const idx = game.team.findIndex(m => m.hp > 0);
      if (idx >= 0) switchTo(idx);
      else endBattle('lose');
    }
  }
}

/* ================= Multiplayer =================
   Lobby (sala principal): cada jogador publica na presença onde está, quem está levando e se está desafiando alguém.
   Duelo: quem desafiou é o "host" e roda a física da luta; o convidado manda os comandos e recebe o estado ~30x/s. */
const r2 = v => Math.round(v*100)/100, r3 = v => Math.round(v*1000)/1000;

const net = {room:null, user:null, remotes:new Map(), names:{}, challenge:null, accept:null, decline:null, pubT:0, duel:null, nameT:-9, solo:false, soloTold:false};
function goSolo(){

  if (mode !== 'title'){ setHud(); soloNote(); }
}
// avisa uma vez por que os amigos não aparecem
function soloNote(){

(async function initNet(){
  try{
    if (!window.claude || !window.claude.use) return;
    const room = await window.claude.use('room');
    if (!room){ goSolo(); return; }
    net.user = await window.claude.use('user');

    if (mode !== 'title') setHud();
  }catch(e){ goSolo(); }
})();
const lobbyPeers = () => { try { return net.room ? net.room.peers() : []; } catch(e){ return []; } };
const myPeerId = () => { const me = lobbyPeers().find(p => p.sameTab); return me ? me.peer : null; };
const REMOTE_COLORS = ['#3b64d6','#2b9a4a','#8e44ad','#f28c28','#16a3a3','#d63b8f'];
function peerColor(peer){ let h = 0; for (const ch of String(peer)) h = (h*31 + ch.charCodeAt(0))|0; return REMOTE_COLORS[Math.abs(h) % REMOTE_COLORS.length]; }
const nameOf = p => (p && p.by && net.names[p.by]) || 'Treinador';
function cloneMember(m){ const c = {species:m.species, level:m.level, xp:0, nick:m.nick}; c.maxHp = stats(c).maxHp; c.hp = c.maxHp; return c; }

function publishLobby(dt){
  net.pubT -= dt; if (net.pubT > 0) return; net.pubT = 0.1;
  const lead = game.team.find(m => m.hp > 0) || game.team[0];
  const st = mode === 'battle' ? (net.duel ? 'd' : 'b') : 'w';
  net.room.presence({x:r2(trainer.pos.x), z:r2(trainer.pos.z), y:r2(trainer.yaw), mv:trainer.moving ? 1 : 0, sp:lead ? lead.species : null, lv:lead ? lead.level : 1, st,
    ch:net.challenge, ac:net.accept, dc:net.decline}).catch(() => {});
}
function updateRemotes(){
  const seen = new Set(), ids = [];
  for (const p of lobbyPeers()){
    if (p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (typeof pr.x !== 'number' || typeof pr.z !== 'number') continue;
    seen.add(p.peer); if (p.by) ids.push(p.by);
    let r = net.remotes.get(p.peer);
    if (!r){
      const tag = document.createElement('div'); tag.className = 'tag'; document.body.appendChild(tag);
      r = {peer:p.peer, model:makeTrainerModel(peerColor(p.peer)), tag, x:pr.x, z:pr.z, yaw:+pr.y || 0, walk:0, pet:null, petKey:''};
      net.remotes.set(p.peer, r);
    }
    r.p = p; r.tx = clamp(pr.x, -MAP, REGIONS.at(-1).cx + MAP); r.tz = clamp(pr.z, -MAP, MAP); r.tyaw = +pr.y || 0; r.mv = !!pr.mv; r.st = pr.st;
    const sp = SPECIES[pr.sp] ? pr.sp : null, lv = clamp(pr.lv|0, 1, 100);
    const key = r.st === 'w' && sp ? sp + ':' + lv : '';
    if (key !== r.petKey){
      if (r.pet){ destroyCreature(r.pet); r.pet = null; }
      if (key && creatures.length < MAX_CREATURES - 4) r.pet = makeCreature(newMember(sp, lv), r.x - 1, r.z - 1, 'remote');
      r.petKey = r.pet ? key : '';
    }
  }
  for (const [peer, r] of net.remotes) if (!seen.has(peer)) removeRemote(r);
  if (net.user && ids.length && clock - net.nameT > 3){
    net.nameT = clock;
    net.user.profiles(ids).then(ps => { for (const id of ids) if (ps[id] && ps[id].name) net.names[id] = ps[id].name; }).catch(() => {});
  }
}
function removeRemote(r){ scene.remove(r.model.g); r.tag.remove(); if (r.pet) destroyCreature(r.pet); net.remotes.delete(r.peer); }
function renderRemotes(){
  for (const r of net.remotes.values()){
    // amigo que trocou de mapa: pula direto em vez de deslizar pelo vazio
    if (Math.hypot(r.tx - r.x, r.tz - r.z) > 20){ r.x = r.tx; r.z = r.tz; if (r.pet && !r.pet.removed) showTeleport(r.pet, r.x - 1, r.z - 1); }
    r.x += (r.tx - r.x)*0.2; r.z += (r.tz - r.z)*0.2; r.yaw = lerpAngle(r.yaw, r.tyaw, 0.2);
    r.model.g.position.set(r.x, 0, r.z); r.model.g.rotation.y = r.yaw;
    r.moving = r.mv;
    animateTrainer(r.model, r, 1/60);
    const v = new T.Vector3(r.x, 2.15, r.z).project(camera);
    const label = nameOf(r.p) + (r.st === 'b' ? ' · em batalha' : r.st === 'd' ? ' · em duelo' : '');
    if (r.tag.textContent !== label) r.tag.textContent = label;

    r.tag.style.transform = `translate(${(v.x + 1)/2*innerWidth}px, ${(1 - v.y)/2*innerHeight}px) translate(-50%, -100%)`;
    r.tag.hidden = mode === 'title' || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1;
  }
  const n = net.remotes.size + 1;
  const txt = `${n} ${n === 1 ? 'jogador' : 'jogadores'} online`;
  if ($('online').textContent !== txt) $('online').textContent = txt;
}

// desafios: devolve {text, key} para o aviso na tela
function netWorldStep(){
  const me = myPeerId(); if (!me) return null;
  if (net.challenge && clock - net.challengeAt > 20){ net.challenge = null; toast('Ninguém respondeu ao desafio.'); }
  if (net.decline && clock - net.declineAt > 6) net.decline = null;
  if (net.accept && clock - net.acceptAt > 12) net.accept = null;
  if (net.challenge){
    const tgt = net.remotes.get(net.challenge.to);
    if (!tgt){ net.challenge = null; return null; }
    const pr = tgt.p.presence;
    if (pr.ac && pr.ac.from === me && pr.ac.code === net.challenge.code){ const c = net.challenge; net.challenge = null; startDuel(true, c.code, c.to); return null; }
    if (pr.dc === net.challenge.code){ toast(`${nameOf(tgt.p)} recusou o desafio.`); net.challenge = null; return null; }
    return {text:`Esperando ${nameOf(tgt.p)} aceitar o desafio...`};
  }
  for (const r of net.remotes.values()){
    const ch = r.p.presence.ch;
    if (!ch || ch.to !== me || r.st !== 'w' || ch.code === net.decline) continue;
    if (pressed.KeyE){
      if (!game.team.some(m => m.hp > 0)){ toast('Seu time está desmaiado. Cure no Centro antes.'); return null; }
      net.accept = {from:r.peer, code:String(ch.code).slice(0, 12)}; net.acceptAt = clock; net.pubT = 0;
      startDuel(false, net.accept.code, r.peer); return null;
    }
    if (pressed.KeyX){ net.decline = ch.code; net.declineAt = clock; net.pubT = 0; return null; }
    return {text:`${nameOf(r.p)} te desafiou pra um duelo! E aceitar · X recusar`, key:'KeyE'};
  }
  let best = null, bd = 3.5;
  for (const r of net.remotes.values()){ if (r.st !== 'w') continue; const d = Math.hypot(r.x - trainer.pos.x, r.z - trainer.pos.z); if (d < bd){ bd = d; best = r; } }
  if (!best) return null;
  if (pressed.KeyF){
    if (!game.team.some(m => m.hp > 0)) toast('Seu time está desmaiado. Cure no Centro antes.');
    else { net.challenge = {to:best.peer, code:Math.random().toString(36).slice(2, 8)}; net.challengeAt = clock; net.pubT = 0; toast(`Desafio enviado pra ${nameOf(best.p)}.`); }
  }
  return {text:`F: desafiar ${nameOf(best.p)} pra um duelo`, key:'KeyF'};
}

function makePuppet(member){
  const c = makeCreature(member, ARENA.x, ARENA.z + 40, 'puppet');

}
async function startDuel(isHost, code, oppPeer){

const packC = c => { const a = []; for (const p of c.parts) a.push(r2(p.position.x), r2(p.position.y), r2(p.position.z), r3(p.quaternion.x), r3(p.quaternion.y), r3(p.quaternion.z), r3(p.quaternion.w)); return a; };

    else if (gp && gp.presence.ff){ res = 'A'; toast(`${d.oppName} desistiu.`); }

const mouse = {x:0, y:0, has:false, world:new T.Vector3()};

function mouseGround(){
  raycaster.setFromCamera(new T.Vector2(mouse.x/innerWidth*2 - 1, -(mouse.y/innerHeight)*2 + 1), camera);

function moveInput(){
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  const v = new T.Vector3().addScaledVector(FWD, iz).addScaledVector(RIGHT, ix);

let clock = 0;
function step(dt){
  clock += dt;
  trainer.throwT -= dt;
  // qualquer teleporte (portal, desmaio, duelo) cai aqui e troca o mapa ativo
  const rg = regionAt(trainer.pos.x); if (rg !== curRegion) applyRegion(rg);
  if (mode === 'world'){
    const v = moveInput();
    trainer.moving = v.lengthSq() > 0.01;
    if (trainer.moving){ moveTrainer(v.x*5.5*dt, v.z*5.5*dt); trainer.yaw = lerpAngle(trainer.yaw, Math.atan2(v.x, v.z), 0.25); }
    if (follower && !follower.removed) aiFollow(follower);
    for (const w of wilds()) if (!w.removed) aiWander(w, dt);
    const spot = SPOTS.find(s => Math.hypot(trainer.pos.x - s.x, trainer.pos.z - s.z) < s.r);
    const np = net.room ? netWorldStep() : null;
    if (np) setPrompt(np.text, np.key); else setPrompt(spot ? (spot.kind === 'portal' ? (unlocked(spot.to) ? `E: viajar para ${REGIONS[spot.to].name}` : `Trancado: precisa da ${KEY_NAMES[spot.to]}`) : SPOT_TEXT[spot.kind]) : '', 'KeyE');
    if (spot && pressed.KeyE){
      if (spot.kind === 'portal'){
        if (!unlocked(spot.to)) toast(lockMsg(spot.to));
        else { travel(spot); for (const k in pressed) delete pressed[k]; return; }
      }
      if (spot.kind === 'heal'){ healAll(); toast('Seu time foi curado!'); }
      else if (spot.kind === 'shop') showShop();
      else if (spot.kind === 'box') showBox();
    }
    if (pressed.KeyZ) showBag();
    if (pressed.KeyC) cycleCapture();
    for (let i = 1; i <= TEAM_MAX; i++) if (pressed['Digit' + i]) switchTo(i - 1);
    if (pressed.Tab) showTeam();
    if (mode === 'world' && follower && !follower.fainted){
      for (const w of wilds()){
        if (w.removed || w.cool > 0) continue;
        if (Math.hypot(w.torso.position.x - trainer.pos.x, w.torso.position.z - trainer.pos.z) < 3.4){ startBattle(w); break; }
      }
    }
  } else if (mode === 'evo' && evo){
    stepEvo(dt);
  } else if (mode === 'battle' && battle && battle.pvp){
    trainer.moving = false; setPrompt('');
    if (battle.host) pvpHostStep(dt); else pvpGuestStep(dt);
  } else if (mode === 'battle' && battle){
    trainer.moving = false;
    const P = battle.mon, v = moveInput();
    if (!P.removed){
      const o = opponentOf(P);
      const near = o && Math.hypot(o.torso.position.x - P.torso.position.x, o.torso.position.z - P.torso.position.z) < 2.6;
      P.input = {
        mx:v.x, mz:v.z, jump:!!pressed.Space && !P.grabs.length, lift:!!keys.Space,
        punch:!!(pressed.KeyQ || pressed.Mouse0), grab:!!keys.KeyE, special:!!pressed.KeyF,
        face: o && (v.lengthSq() < 0.01 || near) ? o.torso.position : null
      };
    }
    if (!battle.wild.removed) aiFight(battle.wild, dt);
    for (const w of wilds()) if (!w.removed) aiWander(w, dt);
    const aim = mouse.has ? mouseGround() : null;
    reticle.visible = !!aim && !battle.capture && !battle.over;
    if (aim) reticle.position.set(aim.x, 0.06, aim.z);
    if (pressed.Mouse2 || pressed.KeyR){ if (aim) throwBall(aim); else if (!battle.wild.removed) throwBall(battle.wild.torso.position); }
    if (pressed.KeyX && !battle.capture) endBattle('flee');
    if (pressed.KeyC) cycleCapture();
    if (pressed.KeyZ) showBag();
    for (let i = 1; i <= TEAM_MAX; i++) if (pressed['Digit' + i]) switchTo(i - 1);
    setPrompt('');
  }
  for (const k in pressed) delete pressed[k];
  if (mode === 'world' || mode === 'battle') updateSpawns(dt);
  if (mode === 'world' || mode === 'battle'){ updateNpcs(dt); if (mode === 'world') updateArea(); }
  if (net.room && mode !== 'title'){
    updateRemotes(); publishLobby(dt);
    for (const r of net.remotes.values()) if (r.pet && !r.pet.removed) aiFollowTo(r.pet, r.x, r.z, r.yaw);
  }

  for (const c of creatures) updateCreature(c, dt);
  const tb = trainer.body;
  const tvx = (trainer.pos.x - tb.position.x)/dt, tvz = (trainer.pos.z - tb.position.z)/dt;
  if (Math.hypot(tvx, tvz) > 10) tb.velocity.set(0, 0, 0); else tb.velocity.set(tvx, 0, tvz);
  tb.position.set(trainer.pos.x, 0.8, trainer.pos.z);
  world.step(dt);
  fixJoints();
  processContacts();
  processHits();
  if (battle && !(battle.pvp && !battle.host)) battleUpdate(dt);

  for (const b of balls.slice()){
    if (battle && battle.capture && battle.capture.ball === b) continue;
    if ((!b.body.used && clock - b.body.born > 4) || b.body.position.y < -5) removeBall(b);
  }
  for (const r of rocks.slice()) if (clock - r.body.born > (r.body.spent ? 1.2 : 3)) removeRock(r);
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i]; p.life -= dt; p.vy -= 18*dt;
    p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt;
    if (p.m.position.y < 0.05){ p.m.position.y = 0.05; p.vy *= -0.3; p.vx *= 0.7; p.vz *= 0.7; }
    if (p.life <= 0){ scene.remove(p.m); particles.splice(i, 1); }
  }
  updatePuffs(dt); updateKeyFx(dt);
  for (let i = rings.length - 1; i >= 0; i--){
    const r = rings[i]; r.t += dt; const k = r.t/0.5;
    r.m.scale.setScalar(1 + k*r.max); r.m.material.opacity = 1 - k;
    if (k >= 1){ scene.remove(r.m); rings.splice(i, 1); }
  }
}

/* ================= Estilos visuais (pós-processamento) ================= */
// a cena é desenhada numa textura (cor + profundidade) e um shader de tela cheia aplica o estilo
const POST_FS = `
uniform sampler2D tCol, tDep; uniform vec2 res; uniform float mode, seed, pr; uniform vec3 shT, hiT, fogC;
varying vec2 vUv;
float h(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }
float n(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3. - 2.*f);
  return mix(mix(h(i), h(i + vec2(1., 0.)), f.x), mix(h(i + vec2(0., 1.)), h(i + 1.), f.x), f.y); }
float fbm(vec2 p){ float s = 0., a = .5; for (int i = 0; i < 4; i++){ s += a*n(p); p *= 2.03; a *= .5; } return s; }
float dep(vec2 uv){ return texture2D(tDep, uv).x*300.; }
vec3 col(vec2 uv){ return texture2D(tCol, uv).rgb; }
float lum(vec3 c){ return dot(c, vec3(.299, .587, .114)); }
vec3 sat(vec3 c, float k){ return mix(vec3(lum(c)), c, k); }
// borda: salto de profundidade (silhuetas) + salto de cor (detalhes)
float edge(vec2 uv, float w, float kc){
  vec2 o = w/res; float d = dep(uv); vec3 c = col(uv);
  float e = 0.;
  e = max(e, abs(dep(uv + vec2(o.x, 0.)) - d)); e = max(e, abs(dep(uv - vec2(o.x, 0.)) - d));
  e = max(e, abs(dep(uv + vec2(0., o.y)) - d)); e = max(e, abs(dep(uv - vec2(0., o.y)) - d));
  float ec = length(col(uv + vec2(o.x, 0.)) - c) + length(col(uv + vec2(0., o.y)) - c);
  return max(smoothstep(.25, .6, e), smoothstep(.35, .7, ec*kc));
}
float bayer2(vec2 a){ a = floor(a); return fract(dot(a, vec2(.5, a.y*.75))); }
float bayer4(vec2 a){ return bayer2(.5*a)*.25 + bayer2(a); }
void main(){
  vec2 uv = vUv, p = gl_FragCoord.xy/pr;
  vec3 c = col(uv);
  // texto de placa (alfa 0): sem filtro, senão as letras viram borrão
  if (texture2D(tCol, uv).a < .5){ gl_FragColor = vec4(c, 1.); return; }
  if (mode < 1.5){           // GIBI: retícula de pontos nas sombras, tinta grossa, papel de revista
    c = sat(c, 1.3);
    float l = lum(c);
    // bolinhas pequenas e suaves, só nas sombras de verdade
    vec2 q = mat2(.707, -.707, .707, .707)*p/4.;
    float d = length(fract(q) - .5);
    float r = clamp((.62 - l)*.8, 0., .32);
    c = mix(c, c*.66, 1. - smoothstep(r - .05, r + .05, d));
    float e = edge(uv, 1.*pr, .7);
    c = mix(c, vec3(.1, .08, .12), e*.85);
    c *= vec3(1.03, 1., .92)*(.95 + .05*fbm(p*.4));
  } else if (mode < 2.5){     // AQUARELA: tinta que escorre, bordas escurecidas, papel granulado
    vec2 w = (vec2(fbm(p*.02), fbm(p*.02 + 7.)) - .5)*14./res*pr;
    vec2 u2 = uv + w;
    vec3 b = (col(u2) + col(u2 + vec2(3., 0.)/res*pr) + col(u2 - vec2(0., 3.)/res*pr) + col(u2 + vec2(-3., 3.)/res*pr))*.25;
    vec3 bb = (col(u2 + vec2(9., 0.)/res*pr) + col(u2 - vec2(9., 0.)/res*pr) + col(u2 + vec2(0., 9.)/res*pr) + col(u2 - vec2(0., 9.)/res*pr))*.25;
    c = sat(b, .85);
    c = mix(c, vec3(1.), .12);
    float wet = clamp(length(b - bb)*2.2, 0., 1.);
    c *= 1. - wet*.35;
    c *= .86 + .2*fbm(p*.35 + fbm(p*.05)*4.);
    float e = edge(u2, 1.2*pr, .6);
    c = mix(c, c*vec3(.45, .38, .42), e*.55);
    float paper = fbm(p*.9);
    c *= vec3(1.02, 1., .95)*(.93 + .08*paper);
    vec2 v = vUv - .5; c = mix(c, vec3(.98, .96, .9), smoothstep(.45, .75, length(v*vec2(1., 1.2))));
  } else if (mode < 3.5){     // PIXEL 16-BIT: resolução baixa, paleta curta com pontilhado e contorno colorido
    vec2 cell = floor(uv*res);
    c = sat(c, 1.2);
    float e = edge(uv, 1., 1.3);
    c = mix(c, c*.3 + vec3(.04, .02, .08), e);
    float t = bayer4(cell) - .5;
    c = floor(c*6. + t*.45 + .5)/6.;
  } else if (mode < 4.5){     // MASSINHA: stop-motion com sombra de contato, digitais e miniatura (tilt-shift)
    vec2 j = (vec2(n(uv*7. + seed), n(uv*7. - seed)) - .5)*2.2/res*pr;
    vec2 u2 = uv + j;
    float tilt = smoothstep(.22, .48, abs(vUv.y - .45));
    vec3 s = vec3(0.); float tw = 0.;
    for (int i = 0; i < 8; i++){ float a = float(i)*.785; vec2 o = vec2(cos(a), sin(a))*tilt*5.*pr/res; s += col(u2 + o); tw += 1.; }
    c = mix(col(u2), s/tw, tilt);
    float d = dep(u2), ao = 0.;
    for (int i = 0; i < 8; i++){ float a = float(i)*.785 + .3; vec2 o = vec2(cos(a), sin(a))*7.*pr/res; float dd = d - dep(u2 + o); ao += smoothstep(.05, .5, dd)*(1. - smoothstep(1.5, 3., dd)); }
    c *= 1. - ao/8.*.45;
    c = sat(c, 1.18)*vec3(1.05, 1., .93);
    float fp = sin(length(p - vec2(400., 300.))*.9 + fbm(p*.05 + seed)*9.);
    c *= 1. + .03*fp*(1. - tilt);

    vec3 paper = vec3(.95, .89, .76)*(.93 + .07*fbm(p*.5));
    vec3 ink = vec3(.12, .08, .07);
    float l = lum(c);
    // cores chapadas de tinta de gráfica, poucas por canal
    vec3 chap = floor(sat(c, 1.5)*3. + .35)/3.;
    vec3 o = mix(paper, paper*chap*1.25, .85);
    // marcas da goiva: veios claros no meio da cor
    float wob = fbm(p*.04)*6.;
    o *= .9 + .1*step(.45, n(vec2(p.x*.025, p.y*.45) + wob));
    float hatch = sin((p.x + p.y)*.6 + wob);
    if (l < .36) o = mix(o, ink, step(.2, hatch));
    if (l < .17) o = ink;
    float e = edge(uv, 2.*pr, 1.6);
    e *= .4 + .6*step(.2, n(p*.2));
    o = mix(o, ink, step(.3, e));
    c = o;
  } else {
    // DIORAMA (6) e ANIME (7): acabamento de estúdio, com cor por mapa (shT sombras, hiT luzes, fogC névoa)
    float d = dep(uv), anime = step(6.5, mode);
    if (anime < .5){             // maquete: desfoque leve em cima e embaixo
      float tilt = smoothstep(.3, .5, abs(vUv.y - .48))*.8;
      vec3 s = vec3(0.);
      for (int i = 0; i < 8; i++){ float a = float(i)*.785; s += col(uv + vec2(cos(a), sin(a))*tilt*4.*pr/res); }
      c = mix(c, s/8., tilt);
    } else {                     // brilho: as partes claras vazam luz
      vec3 bl = vec3(0.);
      for (int i = 0; i < 12; i++){ float a = float(i)*.524; float rr = mod(float(i), 2.) < .5 ? 6. : 13.; bl += max(col(uv + vec2(cos(a), sin(a))*rr*pr/res) - .9, 0.); }

    c = pow(c, vec3(mix(.95, 1.04, anime)))*mix(1., .95, anime);

    float e = edge(uv, mix(1., 1.3, anime)*pr, mix(.45, .3, anime));
    c = mix(c, c*mix(.45, .3, anime) + vec3(.01, 0., .04)*anime, e*mix(.75, .9, anime));
    // névoa ao fundo e céu em degradê
    float hz = smoothstep(62., 78., d);

}`;

// gradiente de luz dos materiais toon: degraus duros, poucos tons ou liso (massinha)

const STYLES = {

// cor de cada mapa nos estilos de estúdio: sh multiplica as sombras, hi as luzes, fog é a névoa do fundo
const GRADES = [
  {sh:[0.84, 0.88, 1.08], hi:[1.07, 1.02, 0.9], fog:'#cfe3e8'},    // Campos: tarde dourada
  {sh:[0.9, 0.82, 0.95], hi:[1.1, 1.0, 0.84], fog:'#f0d9b0'},      // Sertão: sol forte
  {sh:[0.8, 0.9, 1.12], hi:[1.0, 1.02, 1.06], fog:'#e2eef6'},      // Pico: frio

let style = STYLES.atual;
function setStyle(name){
  style = STYLES[name] || STYLES.anime;

  toonGrad.minFilter = toonGrad.magFilter = style.soft ? T.LinearFilter : T.NearestFilter;
  toonGrad.needsUpdate = true;

function drawFrame(){
  if (!style.mode){ renderer.render(scene, camera); return; }
  const pr = renderer.getPixelRatio(), k = style.scale ? style.scale/pr : 1;
  const w = Math.max(1, Math.round(innerWidth*pr*k)), h = Math.max(1, Math.round(innerHeight*pr*k));
  if (post.w !== w || post.h !== h){
    if (post.rt) post.rt.dispose();
    post.rt = new T.WebGLRenderTarget(w, h, {minFilter:T.NearestFilter, magFilter:T.NearestFilter, depthTexture:new T.DepthTexture(w, h)});

}

function render(){
  for (const c of creatures) syncCreature(c);
  if (battle && battle.pvp && !battle.host) renderPuppets();
  renderNpcs(); renderAmbient();
  for (const b of balls){
    b.mesh.position.copy(b.body.position); b.mesh.quaternion.copy(b.body.quaternion);
    if (battle && battle.capture && battle.capture.ball === b){ b.mesh.rotation.set(0, 0, battle.capture.wob || 0); b.mesh.position.y = Math.max(0.6, b.body.position.y) + Math.sin(clock*3)*0.04; b.mesh.scale.setScalar(1.6); }
    if (b.sprout) b.sprout.scale.setScalar(Math.min(1, b.sprout.scale.x + 0.04));
  }
  for (const r of rocks){ r.mesh.position.copy(r.body.position); r.mesh.quaternion.copy(r.body.quaternion); }
  const tm = trainer.mesh;
  tm.position.set(trainer.pos.x, 0, trainer.pos.z); tm.rotation.y = trainer.yaw;
  animateTrainer(trainer.model, trainer, 1/60);
  let tgt, size;
  if (battle){
    const pts = battle.pvp && !battle.host
      ? [battle.pA, battle.pB].map(c => c.meshes[c.parts.indexOf(c.torso)].position)
      : [battle.mon, battle.wild].filter(c => !c.removed).map(c => c.torso.position);
    if (battle.capture) pts.push(battle.capture.ball.body.position);
    pts.push({x:trainer.pos.x, z:trainer.pos.z});
    let minx = Infinity, maxx = -Infinity, minz = Infinity, maxz = -Infinity;
    for (const p of pts){ minx = Math.min(minx, p.x); maxx = Math.max(maxx, p.x); minz = Math.min(minz, p.z); maxz = Math.max(maxz, p.z); }
    tgt = new T.Vector3((minx + maxx)/2, 0.5, (minz + maxz)/2);
    size = clamp(Math.hypot(maxx - minx, maxz - minz)*0.4 + 3, 4.2, 8);
  } else { tgt = new T.Vector3(trainer.pos.x, 0.5, trainer.pos.z); size = 7.5; }
  if (innerWidth < innerHeight) size *= 1.25;
  cam.target.lerp(tgt, 0.08);
  cam.cur += (size - cam.cur)*0.05;
  const a = innerWidth/innerHeight;
  camera.left = -cam.cur*a; camera.right = cam.cur*a; camera.top = cam.cur; camera.bottom = -cam.cur; camera.updateProjectionMatrix();
  cam.shake *= 0.88;
  const sh = new T.Vector3(rand(-1,1), rand(-1,1), rand(-1,1)).multiplyScalar(cam.shake);
  camera.position.copy(cam.target).add(ISO).add(sh);
  camera.lookAt(cam.target.clone().add(sh));
  sun.position.set(cam.target.x + 10, 22, cam.target.z + 6); sun.target.position.copy(cam.target);
  drawFrame();
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.life -= 1/60; f.p.y += 0.02;
    const v = f.p.clone().project(camera);
    f.el.style.transform = `translate(${(v.x + 1)/2*innerWidth}px, ${(1 - v.y)/2*innerHeight}px) translate(-50%, -50%)`;
    f.el.style.opacity = clamp(f.life*1.6, 0, 1);
    if (f.life <= 0){ f.el.remove(); floats.splice(i, 1); }
  }
  if (net.room) renderRemotes();
  if (battle) battle.pvp ? updatePvpHud() : updateBattleHud();
}

function itemCard(k, inner, sel){
  const it = ITEMS[k];
  return `<div class="item ${sel ? 'sel' : ''}"><img src="${itemIcon(k)}" alt=""><div class="nm">${it.name}</div><div class="ds">${it.desc}</div><div class="ds">Na mochila: ${count(k)}</div><div class="row">${inner}</div></div>`;
}
function showShop(){
  const sections = [['cura', 'Cura'], ['captura', 'Captura']];
  const html = `<div class="shophead"><h2 style="margin:0">Loja do Mato</h2><span class="coins">${game.money} moedas</span></div>
    <p class="hint">Você ganha moedas vencendo e capturando animais.</p>
    ${sections.map(([cat, title]) => `<div class="sect">${title}</div><div class="items">${Object.keys(ITEMS).filter(k => ITEMS[k].cat === cat).map(k => {
      const p = ITEMS[k].price;
      return itemCard(k, `<span class="qty">${p} moedas</span><span><button data-buy="${k}" data-n="1" ${game.money < p ? 'disabled' : ''}>Comprar</button> <button data-buy="${k}" data-n="5" ${game.money < p*5 ? 'disabled' : ''}>×5</button></span>`);
    }).join('')}</div>`).join('')}
    <div class="actions"><button class="primary" id="closeMenu">Sair da loja (E)</button></div>`;
  openMenu('shop', html);
  $('closeMenu').onclick = closeMenu;
  $('card').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const k = b.dataset.buy, n = +b.dataset.n, cost = ITEMS[k].price*n;
    if (game.money < cost) return;
    game.money -= cost; addItem(k, n); save();
    const top = $('card').scrollTop; showShop(); $('card').scrollTop = top;
    toast(`Comprou ${n}× ${ITEMS[k].name}.`);
  });
}
let bagPick = null;
function showBag(){
  if (battle && battle.pvp) return;
  const inBattle = menuReturn === 'battle' || mode === 'battle';
  const owned = Object.keys(ITEMS).filter(k => count(k) > 0);
  const cure = owned.filter(k => ITEMS[k].cat === 'cura'), cap = owned.filter(k => ITEMS[k].cat === 'captura');
  if (bagPick && !cure.includes(bagPick)) bagPick = null;
  let targets = '';
  if (bagPick){
    const it = ITEMS[bagPick];
    targets = `<div class="sect">Usar ${it.name} em quem?</div><div class="targets">${game.team.map((m, i) => {
      const ok = it.revive ? m.hp <= 0 : m.hp > 0 && m.hp < m.maxHp;
      return `<button data-use="${i}" ${ok ? '' : 'disabled'}><img src="${portrait(m)}" alt="">${m.nick} ${Math.ceil(m.hp)}/${m.maxHp}</button>`;
    }).join('')}</div>`;
  }
  const html = `<div class="shophead"><h2 style="margin:0">Mochila</h2><span class="coins">${game.money} moedas</span></div>
    ${inBattle ? '<p class="hint">Batalha pausada enquanto a mochila está aberta.</p>' : ''}
    <div class="sect">Cura</div>
    ${cure.length ? `<div class="items">${cure.map(k => itemCard(k, `<span class="qty">×${count(k)}</span><button data-pick="${k}">${bagPick === k ? 'Escolhido' : 'Usar'}</button>`, bagPick === k)).join('')}</div>` : '<p class="hint">Nenhum item de cura. Compre na loja.</p>'}
    ${targets}
    <div class="sect">Captura</div>
    ${cap.length ? `<div class="items">${cap.map(k => itemCard(k, `<span class="qty">×${count(k)}</span><button data-sel="${k}" ${game.sel === k ? 'disabled' : ''}>${game.sel === k ? 'Equipado' : 'Equipar'}</button>`, game.sel === k)).join('')}</div>` : '<p class="hint">Nenhum item de captura. Compre na loja.</p>'}
    <p class="hint">O item equipado é o que você arremessa com R ou botão direito.</p>
    <div class="sect">Chefes e chaves</div>
    <div class="bosses">${BOSSES.map(b => {
      const done = game.bosses[b.region], prize = KEY_NAMES[b.region + 1] || 'Coroa da Cratera';
      return `<div class="boss ${done ? 'done' : ''}"><b>${b.name}</b><span class="small">${REGIONS[b.region].name} · Nv. ${b.level}</span><span class="small">${done ? (done === 'capture' ? 'Capturado' : 'Vencido') + ` · ganhou ${prize}` : unlocked(b.region) ? `No covil · deixa a ${prize}` : 'Mapa ainda trancado'}</span></div>`;
    }).join('')}</div>
    <div class="actions"><button class="primary" id="closeMenu">Fechar (Z)</button></div>`;
  openMenu('bag', html);
  $('closeMenu').onclick = () => { bagPick = null; closeMenu(); };
  $('card').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { bagPick = b.dataset.pick; showBag(); });
  $('card').querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { game.sel = b.dataset.sel; save(); showBag(); });
  $('card').querySelectorAll('[data-use]').forEach(b => b.onclick = () => { useItem(bagPick, game.team[+b.dataset.use]); showBag(); });
}
function useItem(k, m){
  const it = ITEMS[k];
  if (!it || count(k) <= 0 || !m) return;
  if (it.revive){
    if (m.hp > 0) return;
    m.hp = Math.ceil(m.maxHp*it.revive);
    if (battle && battle.member === m && battle.mon.fainted){ battle.mon.fainted = false; battle.mon.ko = 1; battle.faintT = 0; }
    toast(`${m.nick} acordou!`);
  } else {
    if (m.hp <= 0 || m.hp >= m.maxHp) return;
    const before = m.hp; m.hp = Math.min(m.maxHp, m.hp + it.heal);
    toast(`${m.nick} recuperou ${Math.round(m.hp - before)} PV.`);
  }
  addItem(k, -1); save(); teamKey = ''; renderTeam();
  if (mode === 'menu' && menuReturn === 'world' && !follower) spawnFollower();
}
$('bagBtn').onclick = () => { if (mode === 'world' || mode === 'battle') showBag(); };
function enterWorld(){
  $('overlay').hidden = true; mode = 'world';
  if (!game.team.some(m => m.hp > 0)) healAll();
  // volta pro mapa salvo (na frente do portal de chegada); os Campos começam perto do Centro
  const want = REGIONS[game.map | 0] || REGIONS[0];
  if (regionAt(trainer.pos.x) !== want){
    if (want.id){ const a = portalArrival(0, want.id); trainer.pos.set(a.x, 0, a.z); trainer.yaw = a.ry; }
    else { trainer.pos.set(0, 0, -11); trainer.yaw = Math.PI; }
  }
  applyRegion(want);
  spawnFollower(); setHud(); soloNote();
  for (const p of PATCHES){ if (p.region !== want.id) continue; let n = creatures.filter(c => c.patch === p).length; for (let i = 0; i < 6 && n < PER_PATCH; i++) if (spawnWild(p, false)) n++; }
}

/* ================= Início ================= */
resize();
applyRegion(REGIONS[0]);
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000/60 && n < 4){ if (mode !== 'menu') step(1/60); acc -= 1000/60; n++; }
  if (n === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}
if (load()){ enterWorld(); toast('Bem-vindo de volta!'); } else showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
