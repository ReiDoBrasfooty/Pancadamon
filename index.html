<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Pancadamon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
<style>
/* Layout: cena 3D isométrica em tela cheia; HUD em cartões flutuantes nos cantos; menus como cartão central */
:root{
  --bg:#9fd4f2; --panel:#fffaf0; --ink:#2a2140; --muted:#6b6283; --line:#2a2140; --soft:#f1e9d8;
  --accent:#ff5a36; --accent-ink:#fff; --hp:#38c96a; --hpmid:#f2b632; --hplow:#ec4545;
  --str:#d9472b; --agi:#2b9a4a; --int:#3b64d6;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#262a44; --ink:#f4efff; --muted:#aaa3c8; --line:#0c0d1c; --soft:#323756; color-scheme:dark } }
:root[data-theme="dark"]{ --panel:#262a44; --ink:#f4efff; --muted:#aaa3c8; --line:#0c0d1c; --soft:#323756; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.card-ui{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line)}
#team{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;width:min(240px,44vw)}
.tm{padding:5px 8px;display:grid;grid-template-columns:34px 1fr auto;gap:0 8px;align-items:center}
.tm img{width:34px;height:34px;grid-row:1/3;border-radius:8px;background:var(--soft)}
.tm.lead{outline:3px solid var(--accent);outline-offset:-1px}
.tm.out{opacity:.5}
.tm .n{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tm .l{font-weight:800;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.tm .bar{grid-column:2/4}
.bar{height:10px;border:2px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .15s}
.chip{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:0 6px;border:2px solid var(--line);text-transform:uppercase;letter-spacing:.05em;line-height:16px}
.chip.forca{background:var(--str)} .chip.agilidade{background:var(--agi)} .chip.inteligencia{background:var(--int)}
#wild{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(270px,44vw);padding:8px 12px}
#wild .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#wild .n{font-family:var(--display);font-size:22px;display:flex;gap:8px;align-items:center;min-width:0}
#wild .n img{width:36px;height:36px;border-radius:8px;background:var(--soft)}
#wild .l{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
#wild .bar{height:13px;margin-top:6px}
#wild .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;font-weight:800;color:var(--muted);gap:6px}
#matchup{margin-top:4px;font-size:12px;font-weight:800}
#pills{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pill{padding:4px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
button.pill{padding:4px 12px;font-size:14px;box-shadow:0 4px 0 var(--line)}
#prompt{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;font-weight:800}
#toasts{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{padding:7px 14px;font-weight:800;text-align:center;transition:opacity .4s,transform .4s}
#help{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;font-weight:800;color:#1d2a3a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#help kbd{font-family:var(--body);background:#fffaf0;color:#2a2140;border:2px solid #2a2140;border-radius:6px;padding:0 5px}
.dmg{position:fixed;left:0;top:0;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px #2a2140;paint-order:stroke fill;pointer-events:none;white-space:nowrap}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,#9fd4f2 45%,transparent);backdrop-filter:blur(4px);overflow-y:auto}
.card{background:var(--panel);border:4px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);padding:22px;width:min(860px,100%);max-height:calc(100% - 20px);overflow-y:auto}
.logo{font-family:var(--display);font-size:clamp(40px,9vw,72px);line-height:1;margin:0;color:var(--accent);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:0 5px 0 var(--line)}
.sub{color:var(--muted);font-weight:800;margin:8px 0 14px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px}
.tri{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:800;font-size:14px;margin-bottom:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mon{border:3px solid var(--line);border-radius:16px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:8px;min-width:0}
.mon.lead{outline:4px solid var(--accent);outline-offset:-1px}
.mon img{width:100%;max-width:170px;aspect-ratio:1;margin:0 auto;display:block}
.mon .t{font-family:var(--display);font-size:24px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mon p{margin:0;font-size:14px;color:var(--muted);font-weight:800}
.attrs{display:grid;grid-template-columns:auto 1fr 30px;gap:3px 8px;align-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.attrs .b{height:8px;border-radius:6px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.attrs .b i{display:block;height:100%}
.small{font-size:13px;color:var(--muted);font-weight:800}
.controls{margin-top:16px;font-size:14px;font-weight:800;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.controls kbd{font-family:var(--body);background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:0 5px}
button{font-family:var(--body);font-weight:800;font-size:15px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
#capSel{display:flex;align-items:center;gap:6px}
#me{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(270px,44vw);padding:8px 12px}
.fcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .n{font-family:var(--display);font-size:22px;display:flex;gap:8px;align-items:center;min-width:0}
.fcard .n img{width:36px;height:36px;border-radius:8px;background:var(--soft)}
.fcard .l{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.fcard .bar{height:13px;margin-top:6px}
.fcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;font-weight:800;color:var(--muted);gap:6px}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(56px,14vw,120px);color:#fff;-webkit-text-stroke:4px #2a2140;paint-order:stroke fill;pointer-events:none;text-shadow:0 6px 0 #2a2140}
.tag{position:fixed;left:0;top:0;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink);border:3px solid var(--line);font-weight:800;font-size:12px;white-space:nowrap;pointer-events:none}
#prompt{cursor:pointer}
#capSel img{width:22px;height:22px;margin:-4px 0}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.coins{font-family:var(--display);font-size:22px;color:#b8860b;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:20px;margin:14px 0 8px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{border:3px solid var(--line);border-radius:14px;background:var(--soft);padding:10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:start;min-width:0}
.item.sel{outline:4px solid var(--accent);outline-offset:-1px}
.item img{width:64px;height:64px;grid-row:1/4}
.item .nm{font-family:var(--display);font-size:18px;line-height:1.1}
.item .ds{font-size:13px;font-weight:800;color:var(--muted)}
.item .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-top:6px}
.item .qty{font-weight:800;font-variant-numeric:tabular-nums}
.item button{padding:4px 10px;font-size:13px}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.targets button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;font-size:13px}
.targets img{width:30px;height:30px}
.hint{font-size:13px;font-weight:800;color:var(--muted);margin:6px 0 0}
#touch{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:auto}
#touch .acts{display:grid;grid-template-columns:repeat(3,58px);gap:6px;pointer-events:auto}
#touch button{padding:0;width:100%;height:52px;font-size:12px}
@media (pointer:coarse){ #touch{display:flex} #help{display:none} #prompt{bottom:calc(200px + env(safe-area-inset-bottom,0px))} #toasts{bottom:calc(250px + env(safe-area-inset-bottom,0px))} }
@media (max-width:600px){ #pills{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px))} .tm .n{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .bar>i,.toast{transition:none} }
</style>

<div id="stage"></div>
<div id="team" hidden></div>
<div id="wild" class="card-ui fcard" hidden></div>
<div id="me" class="card-ui fcard" hidden></div>
<div id="big" hidden></div>
<div id="pills" hidden><span class="pill card-ui" id="online" hidden>1 jogador online</span><span class="pill card-ui" id="money">0 moedas</span><span class="pill card-ui" id="capSel">Bolota ×0</span><span class="pill card-ui" id="spec" hidden>Especial pronto</span><button class="pill" id="bagBtn">Mochila (I)</button><button class="pill" id="teamBtn">Time (Tab)</button></div>
<div id="prompt" class="card-ui" hidden></div>
<div id="toasts"></div>
<div id="help" hidden></div>
<div id="fade"></div>
<div id="touch">
  <div class="pad"><span></span><button data-k="KeyW">▲</button><span></span><button data-k="KeyA">◀</button><button data-k="KeyE">E</button><button data-k="KeyD">▶</button><span></span><button data-k="KeyS">▼</button><span></span></div>
  <div class="acts"><button data-k="KeyJ">Ataque</button><button data-k="KeyK">Agarra</button><button data-k="KeyL">Esp.</button><button data-k="Space">Pulo</button><button data-k="KeyT">Captura</button><button data-k="KeyR">Fugir</button><button data-k="KeyC">Troca</button><button data-k="KeyI">Mochila</button></div>
</div>
<div id="overlay" class="overlay" hidden><div class="card" id="card"></div></div>

<script>
const T = THREE, C = CANNON;
const $ = id => document.getElementById(id);
const TAU = Math.PI*2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const lerpAngle = (a,b,t) => a + wrapA(b - a)*t;

/* ================= Dados ================= */
const ATTR = {
  forca:{name:'Força', short:'FOR', color:'#d9472b'},
  agilidade:{name:'Agilidade', short:'AGI', color:'#2b9a4a'},
  inteligencia:{name:'Inteligência', short:'INT', color:'#3b64d6'}
};
// Força vence Agilidade, Agilidade vence Inteligência, Inteligência vence Força
const BEATS = {forca:'agilidade', agilidade:'inteligencia', inteligencia:'forca'};
const adv = (a, d) => BEATS[a.sp.attr] === d.sp.attr ? 1.3 : BEATS[d.sp.attr] === a.sp.attr ? 0.8 : 1;

// base = [FOR, AGI, INT] no nível 1; grow = ganho por nível
const SPECIES = {
  urso:{name:'Urso', attr:'forca', plan:'biped', feat:'bear', color:'#8a5a3b', dark:'#4e301d', belly:'#c99b72', size:1.22, arm:1.05, leg:1.0, head:1.05,
    base:[14,6,5], grow:[2.6,1.0,0.9], special:'slam', specialName:'Esmagada', desc:'Fica em pé, pula alto e cai por cima do inimigo.'},
  gorila:{name:'Gorila', attr:'forca', plan:'biped', feat:'gorilla', color:'#3d3a3f', dark:'#1f1d22', belly:'#8f8a92', size:1.28, arm:1.45, leg:0.8, head:0.95,
    base:[16,5,7], grow:[2.8,0.8,1.1], special:'quake', specialName:'Murro no Chão', desc:'Braços enormes. Soca o chão e joga todo mundo pro alto.'},
  rinoceronte:{name:'Rinoceronte', attr:'forca', plan:'quad', feat:'rhino', color:'#9b958c', dark:'#5d5850', belly:'#bdb7ad', size:1.35, leg:0.9, head:1.05,
    base:[17,4,3], grow:[3.0,0.7,0.6], special:'dash', specialName:'Investida de Chifre', desc:'Um tanque de quatro patas. Atropela o que estiver na frente.'},
  javali:{name:'Javali', attr:'forca', plan:'quad', feat:'boar', color:'#6b4a35', dark:'#3b271b', belly:'#9a735a', size:0.95, leg:0.8, head:1.0,
    base:[12,7,3], grow:[2.3,1.2,0.6], special:'dash', specialName:'Carga Selvagem', desc:'Baixinho e teimoso. Sai correndo de cabeça.'},
  lobo:{name:'Lobo', attr:'agilidade', plan:'quad', feat:'wolf', color:'#8d939c', dark:'#4b5059', belly:'#e3e6ea', size:1.0, leg:1.1, head:0.95,
    base:[8,14,6], grow:[1.4,2.6,1.0], special:'pounce', specialName:'Bote', desc:'Rápido e faminto. Salta em cima da presa.'},
  guepardo:{name:'Guepardo', attr:'agilidade', plan:'quad', feat:'cheetah', color:'#e3b04b', dark:'#3a2a10', belly:'#f6e7c4', size:0.95, leg:1.2, head:0.85,
    base:[6,17,5], grow:[1.0,3.0,0.9], special:'blitz', specialName:'Disparada', desc:'O mais rápido de todos. Ataca três vezes seguidas.'},
  canguru:{name:'Canguru', attr:'agilidade', plan:'biped', feat:'kangaroo', color:'#c08a5a', dark:'#6e4a2b', belly:'#ecd2b4', size:1.1, arm:0.75, leg:1.25, head:0.9,
    base:[9,13,5], grow:[1.6,2.4,0.8], special:'kick', specialName:'Coice Duplo', desc:'Pernas de mola. Pula e chuta com as duas patas.'},
  macaco:{name:'Macaco', attr:'inteligencia', plan:'biped', feat:'monkey', color:'#7a5236', dark:'#432a19', belly:'#e7c7a3', size:0.9, arm:1.3, leg:0.85, head:1.0,
    base:[7,9,14], grow:[1.1,1.5,2.6], special:'throw', specialName:'Pedrada', desc:'Esperto. Ataca de longe jogando pedras.'},
  coruja:{name:'Coruja', attr:'inteligencia', plan:'biped', feat:'owl', color:'#9a7350', dark:'#5a3f28', belly:'#eadcc4', size:0.9, arm:1.0, leg:0.6, head:1.3,
    base:[6,8,16], grow:[1.0,1.3,3.0], special:'hypno', specialName:'Pio Hipnótico', desc:'Olhar hipnótico. Deixa o inimigo tonto e confuso.'},
  raposa:{name:'Raposa', attr:'inteligencia', plan:'quad', feat:'fox', color:'#e0742c', dark:'#3a1d0b', belly:'#fff3e6', size:0.85, leg:0.95, head:0.95,
    base:[6,12,13], grow:[1.0,2.0,2.3], special:'blink', specialName:'Truque da Raposa', desc:'Some e aparece atrás do inimigo pra morder.'}
};
const STARTERS = ['urso','lobo','macaco'];
function stats(m){
  const sp = SPECIES[m.species], L = m.level - 1;
  const [s, a, i] = sp.base.map((b, k) => b + sp.grow[k]*L);
  return {
    str:s, agi:a, int:i,
    maxHp: Math.round(40 + s*7), power: 0.55 + s*0.035, defense: 0.75 + s*0.02,
    speed: Math.min(1.55, 0.7 + a*0.03), atkCd: Math.max(0.18, 0.42 - a*0.008), dodge: Math.min(0.3, a*0.009), jump: Math.min(10.5, 7.5 + a*0.08),
    specCd: Math.max(1.8, 5.5 - i*0.13), specPow: 0.6 + i*0.045
  };
}
const xpNext = m => 30 + m.level*20;
function newMember(species, level){ const m = {species, level, xp:0, nick:SPECIES[species].name}; m.maxHp = stats(m).maxHp; m.hp = m.maxHp; return m; }

// Itens: cura (usados na mochila) e captura (frutos e sementes que prendem o animal dentro da casca)
const ITEMS = {
  fruta:{name:'Fruta Silvestre', cat:'cura', price:30, heal:30, desc:'Recupera 30 PV.'},
  mel:{name:'Pote de Mel', cat:'cura', price:90, heal:80, desc:'Recupera 80 PV.'},
  cesta:{name:'Cesta de Frutas', cat:'cura', price:250, heal:9999, desc:'Recupera todos os PV.'},
  erva:{name:'Erva Reanimadora', cat:'cura', price:200, revive:0.5, desc:'Acorda um animal desmaiado com metade dos PV.'},
  bolota:{name:'Bolota', cat:'captura', price:50, mult:1, desc:'Captura básica. A casca puxa o animal pra dentro.'},
  pinha:{name:'Pinha', cat:'captura', price:120, mult:1.5, desc:'Escamas que fecham firme. Chance 1,5x maior.'},
  coco:{name:'Coco', cat:'captura', price:300, mult:2.2, desc:'Casca duríssima. Chance 2,2x maior.'},
  semente:{name:'Semente Dourada', cat:'captura', price:1500, mult:99, desc:'Rara. Captura garantida.'}
};
const CAPTURE_KEYS = Object.keys(ITEMS).filter(k => ITEMS[k].cat === 'captura');

let game = {team:[], box:[], money:300, inv:{bolota:5, fruta:3}, sel:'bolota'};
const SAVE_KEY = 'pancadamon3d_v2';
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }catch(e){} }
function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.team && s.team.length && s.team.every(m => SPECIES[m.species])){
      if (!s.inv){ s.inv = {bolota:s.balls || 5, fruta:3}; delete s.balls; }
      if (typeof s.money !== 'number') s.money = 300;
      if (!ITEMS[s.sel]) s.sel = 'bolota';
      game = s; return true;
    }
  }catch(e){}
  return false;
}
const count = k => game.inv[k] || 0;
function addItem(k, n){ game.inv[k] = count(k) + n; if (game.inv[k] <= 0) delete game.inv[k]; }

/* ================= Render ================= */
const renderer = new T.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2, devicePixelRatio || 1));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
$('stage').appendChild(renderer.domElement);
const scene = new T.Scene();
const SKY = new T.Color('#9fd4f2');
scene.background = SKY;
const camera = new T.OrthographicCamera(-1, 1, 1, -1, 0.1, 300);
const ISO = new T.Vector3(1, 1.2, 1).normalize().multiplyScalar(60);
const cam = {target:new T.Vector3(0,0,-8), cur:8, shake:0};
const FWD = new T.Vector3(-1,0,-1).normalize(), RIGHT = new T.Vector3(1,0,-1).normalize();
function resize(){ renderer.setSize(innerWidth, innerHeight); }
addEventListener('resize', resize);

scene.add(new T.HemisphereLight('#ffffff', '#5d8a4e', 0.5));

const _qc = new C.Quaternion(), _qe = new C.Quaternion(), _qa = new C.Quaternion(), _qb = new C.Quaternion(), _qt = new C.Quaternion();
function drive(body, qT, strength, blend){
  body.quaternion.conjugate(_qc);
  qT.mult(_qc, _qe);
  let x = _qe.x, y = _qe.y, z = _qe.z, w = _qe.w;
  if (w < 0){ x = -x; y = -y; z = -z; w = -w; }
  w = Math.min(1, w);
  const s = Math.sqrt(1 - w*w);
  let tx = 0, ty = 0, tz = 0;
  if (s > 1e-4){ const k = 2*Math.acos(w)/s*strength; tx = x*k; ty = y*k; tz = z*k; }
  const av = body.angularVelocity;
  av.x += (tx - av.x)*blend; av.y += (ty - av.y)*blend; av.z += (tz - av.z)*blend;
}
function yawLocal(yaw, axis, ang, out){ _qa.setFromAxisAngle(UP, yaw); _qb.setFromAxisAngle(axis, ang); return _qa.mult(_qb, out); }
function yawLocal2(yaw, ax1, a1, ax2, a2, out){
  _qa.setFromAxisAngle(UP, yaw); _qb.setFromAxisAngle(ax1, a1); _qa.mult(_qb, _qt);
  _qb.setFromAxisAngle(ax2, a2); return _qt.mult(_qb, out);
}

}

      dummy.rotation.set(rand(-0.25,0.25), rand(0,TAU), rand(-0.25,0.25));

    patchFloor.rotation.x = -Math.PI/2; patchFloor.position.set(p.x, 0.015, p.z); scene.add(patchFloor);
  }
  const blocked = (x, z, pad) => {
    if (Math.abs(x) < 3 + pad || Math.abs(z) < 3 + pad) return true;
    if (rects.some(r => Math.abs(x - r.x) < r.hw + 3 + pad && Math.abs(z - r.z) < r.hd + 5 + pad)) return true;
    if (Math.hypot(x - ARENA.x, z - ARENA.z) < ARENA.r + 2.5 + pad) return true;
    if (Math.hypot(x - POND.x, z - POND.z) < POND.r + 1.5 + pad) return true;
    if (PATCHES.some(p => Math.hypot(x - p.x, z - p.z) < p.r + 1.5 + pad)) return true;
    return colliders.some(c => Math.hypot(x - c.x, z - c.z) < c.r + 1.2 + pad);
  };
  const trunkG = new T.CylinderGeometry(0.22, 0.3, 1.4, 6), leafG = new T.IcosahedronGeometry(1, 0), rockG = new T.DodecahedronGeometry(1, 0);
  function tree(x, z, s){

    const l1 = mesh(leafG, toon(pick(['#3f9d48','#4aaa4f','#378c3f']))); l1.position.y = 2; l1.scale.setScalar(1.25); g.add(l1);
    const l2 = mesh(leafG, l1.material); l2.position.set(0.2, 2.9, 0.1); l2.scale.setScalar(0.85); g.add(l2);
    g.position.set(x, 0, z); g.scale.setScalar(s); g.rotation.y = rand(0, TAU); scene.add(g);
    colliders.push({x, z, r:0.55*s});
    const b = new C.Body({mass:0, shape:new C.Box(new C.Vec3(0.3*s, 1.5*s, 0.3*s)), collisionFilterGroup:G_STATIC, collisionFilterMask:ALL});
    b.position.set(x, 1.5*s, z); b.isStatic = true; world.addBody(b);
  }
  function rock(x, z, s){
    const r = mesh(rockG, toon('#a7a091')); r.position.set(x, s*0.4, z); r.scale.set(s, s*0.75, s); r.rotation.set(rand(0,1), rand(0,TAU), 0); scene.add(r);
    colliders.push({x, z, r:s*0.9});
    const b = new C.Body({mass:0, shape:new C.Sphere(s*0.8), collisionFilterGroup:G_STATIC, collisionFilterMask:ALL});
    b.position.set(x, s*0.2, z); b.isStatic = true; world.addBody(b);

  let placed = 0, tries = 0;

  placed = 0; tries = 0;

// Treinador "bonequinho": cabeção, olhões soltos, boné torto, braços de macarrão
function makeTrainerModel(jacket){
  const g = new T.Group(), body = new T.Group(); g.add(body);
  const skin = toon('#f7c9a3'), cloth = toon(jacket), pants = toon('#3a5bb8'), ink = toon('#16131c'), white = toon('#ffffff');
  const sph = (parent, mat, p, s, out) => { const m = mesh(GS, mat, !!out); m.position.set(p[0], p[1], p[2]); m.scale.set(s[0], s[1], s[2]); if (out) outline(m, out); parent.add(m); return m; };
  const legs = [-1, 1].map(s => {
    const l = mesh(trLegG, pants); l.position.set(s*0.12, 0.5, 0); g.add(l);
    sph(l, toon('#f4f4f4'), [0, -0.5, 0.06], [0.11, 0.07, 0.17], 1.12);
    return l;
  });
  sph(body, cloth, [0, 0.78, 0], [0.29, 0.33, 0.25], 1.08);
  sph(body, white, [0, 0.74, 0.2], [0.13, 0.17, 0.07]);
  const pack = sph(body, toon('#f2b632'), [0, 0.84, -0.26], [0.21, 0.25, 0.13], 1.1);
  const arms = [-1, 1].map(s => {
    const a = mesh(trArmG, cloth); a.position.set(s*0.3, 0.98, 0); body.add(a);
    sph(a, skin, [0, -0.52, 0], [0.085, 0.085, 0.085], 1.15);
    return a;
  });
  const neck = new T.Group(); neck.position.set(0, 1.06, 0); body.add(neck);
  const head = sph(neck, skin, [0, 0.36, 0], [0.42, 0.4, 0.4], 1.06);
  // rosto (coordenadas da esfera unitária da cabeça)
  for (const sx of [-1, 1]) sph(head, skin, [sx*0.98, 0.0, -0.05], [0.18, 0.26, 0.12]);
  sph(head, toon('#f29a7a'), [0.04, -0.24, 0.96], [0.2, 0.17, 0.17], 1.12);
  for (const [x, y] of [[-0.46, -0.38], [-0.36, -0.44], [0.42, -0.4], [0.52, -0.34]]) sph(head, toon('#c8805a'), [x, y, 0.86], [0.035, 0.035, 0.02]);
  const mouth = sph(head, toon('#5a1a24'), [0.08, -0.55, 0.8], [0.3, 0.13, 0.12]); mouth.rotation.z = 0.18;
  const tongue = sph(head, toon('#ff7b93'), [0.14, -0.67, 0.8], [0.13, 0.17, 0.07]); tongue.visible = false;
  const pupils = [];
  for (const sx of [-1, 1]){
    const R = sx < 0 ? 0.31 : 0.26, cx = sx*0.36, cy = 0.04, cz = 0.8;
    sph(head, white, [cx, cy, cz], [R, R, R*0.8], 1.12);
    const pr = R*(sx < 0 ? 0.5 : 0.42);
    const pm = sph(head, ink, [cx, cy, cz + R*0.8], [pr, pr, pr*0.45]);
    sph(pm, white, [0.35, 0.35, 0.8], [0.28, 0.28, 0.3]);
    pupils.push({m:pm, cx, cy, cz, Rx:R, Rz:R*0.8, lim:R - pr*0.85, ux:0, uy:0, vx:0, vy:0, k:rand(24, 50), dmp:rand(2.5, 5), gk:rand(10, 16)});
  }
  for (const [x, z, rz] of [[-0.75, -0.3, 0.9], [0.75, -0.35, -0.9], [-0.3, -0.85, 0.3]]){ const h = mesh(GC, toon('#7a4a26'), false); h.position.set(x, 0.35, z); h.scale.set(0.12, 0.35, 0.12); h.rotation.set(-0.6, 0, rz); head.add(h); }

    if (c.specialPhase === 0 && c.specialClock > 0.42){
      c.specialPhase = 1;
      const f = fwdOf(c);
      const dx = o ? o.torso.position.x - t.position.x : f.x*2, dz = o ? o.torso.position.z - t.position.z : f.z*2;
      c.parts.forEach(p => p.velocity.set(clamp(dx*2.2, -9, 9), -22, clamp(dz*2.2, -9, 9)));
    }
    if (c.specialPhase === 1 && c.grounded && t.velocity.y > -2){
      c.specialPhase = 2; shockwave(t.position.x, t.position.z, '#c9a67d'); shake(0.25);
      if (o && dist2(o, c) < 2.8){ damage(o, 10*c.power*adv(c, o)/o.defense, o.torso.position, c, true); launch(o, t.position, 6, 7); }
    }
  }
  if (c.special === 'blitz'){
    const n = Math.floor(c.specialClock/0.35);
    if (n >= c.specialPhase && c.specialPhase < 3){
      c.specialPhase++;
      let vx = Math.sin(c.yaw), vz = Math.cos(c.yaw);
      if (o){ const dx = o.torso.position.x - t.position.x, dz = o.torso.position.z - t.position.z, l = Math.hypot(dx, dz) || 1; vx = dx/l; vz = dz/l; c.yaw = Math.atan2(vx, vz); }
      c.parts.forEach(p => p.velocity.set(vx*14, 1.5, vz*14));
      c.hitCd = 0;
    }
    burst(t.position, 1, ['#f6e7c4','#e3b04b'], 1.5);
  }

const rocks = [];
const rockGeo = new T.DodecahedronGeometry(0.16, 0);
function throwRock(c, target){
  const f = fwdOf(c);
  const sx = c.head.position.x + f.x*0.4, sy = c.head.position.y + 0.2, sz = c.head.position.z + f.z*0.4;
  const tx = target.x, ty = (target.y || 0.5) + 0.2, tz = target.z;
  const tf = clamp(Math.hypot(tx - sx, tz - sz)/12, 0.3, 0.9);
  const b = new C.Body({mass:0.4, shape:new C.Sphere(0.15), material:bodyMat, position:new C.Vec3(sx, sy, sz), collisionFilterGroup:G_BALL, collisionFilterMask:ALL & ~c.bit & ~G_TRAINER & ~G_BALL});
  b.velocity.set((tx - sx)/tf, (ty - sy + 0.5*GRAV*tf*tf)/tf, (tz - sz)/tf);
  b.isRock = true; b.thrower = c; b.spent = false; b.born = clock;
  b.addEventListener('collide', e => onCollide(b, e.body));
  world.addBody(b);
  const m = mesh(rockGeo, toon('#8f887b')); scene.add(m);
  rocks.push({body:b, mesh:m});
}

/* ================= Dano ================= */
const hitQueue = [];
function onCollide(part, other){
  const rel = Math.min(40, part.velocity.vsub(other.velocity).norm());
  hitQueue.push([part, other, rel]);
}
function processContacts(){
  for (const eq of world.contacts){
    for (const [x, y, r] of [[eq.bi, eq.bj, eq.ri], [eq.bj, eq.bi, eq.rj]]){
      if (x.tip && x.owner && x.owner.grabHeld && !x.owner.removed && x.owner.grabbers.includes(x) && y.owner && y.owner !== x.owner){
        tryGrab(x.owner, x, y, new C.Vec3(x.position.x + r.x, x.position.y + r.y, x.position.z + r.z));
      }
    }
  }
}
function processHits(){
  for (const [a, b, rel] of hitQueue){
    if (a.isBall){ if (!a.used && b.owner && battle && b.owner === battle.wild) startCapture(a); continue; }
    if (a.isRock){
      if (a.spent) continue;
      a.spent = true;
      const o = b.owner, th = a.thrower;
      if (o && o !== th && battle && !battle.over && ((th === battle.mon && o === battle.wild) || (th === battle.wild && o === battle.mon))){
        if (Math.random() < o.st.dodge) floatText(o.head.position, 'esquivou!', '#b9f5c8', 20);
        else { damage(o, 8*th.st.specPow*adv(th, o)/o.defense, a.position, th, true, b.kind === 'head'); o.stun += 14; launch(o, a.position, 3, 2); }
      }
      burst(a.position, 6, ['#8f887b','#c9c2b4'], 2);
      continue;
    }
    const oa = a.owner; if (!oa || oa.removed) continue;
    if (b.owner && b.owner !== oa) tryHit(oa, a, b.owner, b, rel);
    else if (b.isGround || b.isStatic) envHit(oa, a, rel);
  }
  hitQueue.length = 0;
}
const BODY_SPECIALS = ['dash','slam','pounce','blitz'];
function dangerous(c, part){
  if (c.ko > 0 || c.fainted) return false;
  if (BODY_SPECIALS.includes(c.special) && c.specialT > 0) return true;
  if (c.special === 'kick' && c.specialT > 0 && part.kind === 'leg') return true;
  return c.strikers.includes(part) && c.attackT > 0;
}
let lastAdvMsg = 0;
function tryHit(att, ap, def, dp, rel){
  if (!battle || battle.over || !dangerous(att, ap) || att.hitCd > 0) return;
  if (!((att === battle.mon && def === battle.wild) || (att === battle.wild && def === battle.mon))) return;
  const base = rel - 3.5; if (base <= 0) return;
  att.hitCd = 0.2;
  if (Math.random() < def.st.dodge){ floatText(dp.position, 'esquivou!', '#b9f5c8', 20); return; }
  const special = att.specialT > 0 && (BODY_SPECIALS.includes(att.special) || att.special === 'kick');
  let dmg = clamp(base*1.3, 2, 11)*att.power*adv(att, def)*(dp.kind === 'head' ? 1.4 : 1)/def.defense;
  if (special) dmg *= 0.8 + 0.25*att.st.specPow;
  launch(def, att.torso.position, (special ? 4 : 2.5)*Math.min(1.4, att.power), special ? 3 : 1.5);
  damage(def, dmg, dp.position, att, special, dp.kind === 'head');
}
function envHit(c, part, rel){
  if (!battle || battle.over || c.envCd > 0 || rel < 9) return;
  if (c !== battle.mon && c !== battle.wild) return;
  if ((BODY_SPECIALS.includes(c.special) || c.special === 'kick') && c.specialT > 0) return;
  if (part.kind !== 'head' && part.kind !== 'torso') return;
  c.envCd = 0.35;
  damage(c, Math.min(30, rel - 9)*2.2*(part.kind === 'head' ? 1.4 : 1)*(c.thrownT > 0 ? 1.3 : 1), part.position, c.thrownT > 0 ? c.thrownBy : null, false);
}
function damage(def, dmg, pos, att, special, head){
  if (def.fainted || !battle || battle.over) return;
  dmg = Math.max(1, Math.round(dmg));
  def.member.hp = Math.max(0, def.member.hp - dmg);
  def.stun += dmg*1.3; def.wobble = 0.45;
  floatText(pos, '-' + dmg, head ? '#ff4b4b' : '#ffffff', dmg >= 15 ? 34 : 26);
  if (head) floatText({x:pos.x, y:pos.y + 0.5, z:pos.z}, 'na cabeça!', '#ffe066', 17);
  burst(pos, 6 + Math.min(14, dmg), ['#ffffff', '#ffe066', def.sp.color], 4);
  shake(Math.min(0.35, 0.06 + dmg*0.012));
  if (att && clock - lastAdvMsg > 2.5){
    const e = adv(att, def);
    if (e > 1){ toast(`${ATTR[att.sp.attr].name} vence ${ATTR[def.sp.attr].name}! Dano extra.`); lastAdvMsg = clock; }
    else if (e < 1 && special){ toast(`${ATTR[def.sp.attr].name} resiste a ${ATTR[att.sp.attr].name}...`); lastAdvMsg = clock; }
  }
  if (def.member.hp <= 0){ def.fainted = true; releaseGrabs(def, false); toast(`${def.member.nick} desmaiou!`); }
  else if (def.stun > 45 && def.ko <= 0){ def.ko = 2; def.stun = 0; toast(`${def.member.nick} ficou nocauteado!`); }
}

const puffs = [];
const puffMat = new T.MeshLambertMaterial({color:'#fffaf0', transparent:true, opacity:0.85});
function puff(x, z, size, n){
  for (let i = 0; i < n && puffs.length < 70; i++){
    const m = new T.Mesh(GS, puffMat.clone());
    const a = rand(0, TAU), d = rand(0, size*0.6);
    m.position.set(x + Math.cos(a)*d, size*0.3, z + Math.sin(a)*d);
    m.scale.setScalar(size*rand(0.25, 0.45));

  }
}
function updatePuffs(dt){
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt;
    const k = p.life/p.max;
    p.m.position.x += p.vx*dt; p.m.position.z += p.vz*dt; p.m.position.y += dt*0.4;
    p.m.scale.setScalar(p.s0*(1 + k*1.2)); p.m.material.opacity = 0.85*(1 - k);
    if (k >= 1){ scene.remove(p.m); p.m.material.dispose(); puffs.splice(i, 1); }

}

    const a = rand(0, TAU), d = Math.sqrt(Math.random())*(p.r - 1);
    const x = p.x + Math.cos(a)*d, z = p.z + Math.sin(a)*d;
    if (Math.hypot(x - trainer.pos.x, z - trainer.pos.z) < 3.5) continue;

    const m = newMember(pick(p.pool), Math.round(rand(p.lv[0], p.lv[1])));

function aiFollowTo(c, px, pz, yaw){
  const inp = c.input = {};
  const tx = px - Math.sin(yaw)*1.6, tz = pz - Math.cos(yaw)*1.6;
  const t = c.torso.position, dx = tx - t.x, dz = tz - t.z, l = Math.hypot(dx, dz);
  if (l > 14 || t.y < -3){ showTeleport(c, tx, tz); return; }
  if (l > 0.8){ const k = clamp(l/2.5, 0, 1); inp.mx = dx/l*k; inp.mz = dz/l*k; }
  if (l > 3 && Math.random() < 0.01) inp.jump = true;
}
function showTeleport(c, x, z){ hideCreature(c); showCreature(c, x, c.H + 0.3, z); }
function aiFight(c, dt){
  const inp = c.input = {};
  const o = opponentOf(c);
  if (!o || o.fainted || c.ko > 0) return;
  const ai = c.ai; ai.t -= dt;
  const agg = 0.55 + 0.05*c.member.level;
  const t = c.torso.position, dx = o.torso.position.x - t.x, dz = o.torso.position.z - t.z, dist = Math.hypot(dx, dz) || 0.01;
  const ranged = c.sp.special === 'throw' || c.sp.special === 'hypno';
  const want = ranged && c.specialCd > 0.2 ? c.reach : ranged ? 3.5 : c.reach;
  if (ai.t <= 0){
    ai.t = rand(0.2, 0.5)/agg;
    ai.mode = dist > want*1.1 ? 'approach' : pick(['fight','fight','circle','retreat']);
    ai.side = Math.random() < 0.5 ? 1 : -1;
    if (Math.random() < 0.07*agg && dist < c.reach + 0.5 && !ai.grabFor) ai.grabFor = rand(1.2, 2.2);
  }
  let mx = 0, mz = 0;
  const ux = dx/dist, uz = dz/dist;
  if (ai.mode === 'approach'){ mx = ux; mz = uz; }
  else if (ai.mode === 'retreat'){ mx = -ux*0.7; mz = -uz*0.7; }
  else if (ai.mode === 'circle'){ mx = -uz*ai.side*0.7 + ux*0.2; mz = ux*ai.side*0.7 + uz*0.2; }
  if (ai.grabFor > 0){
    ai.grabFor -= dt; inp.grab = true;
    if (c.grabs.some(g => g.owner)){ inp.lift = true; mx = -ux*0.3; mz = -uz*0.3; if (ai.grabFor < 0.2) ai.grabFor = 0; }
    else { mx = ux; mz = uz; }
    if (ai.grabFor <= 0){ ai.grabFor = 0; inp.grab = false; }
  }
  inp.mx = mx; inp.mz = mz; inp.face = o.torso.position;
  if (!inp.grab && dist < c.reach && Math.random() < 0.09*agg) inp.punch = true;
  const specRange = {throw:7, hypno:4.5, blink:8, pounce:6, blitz:7, dash:5, kick:2.5, slam:4, quake:4.5}[c.sp.special] || 3;
  if (c.specialCd <= 0 && dist < specRange && Math.random() < 0.02*agg) inp.special = true;
  if (Math.random() < 0.004) inp.jump = true;
}

let battle = null;
let mode = 'title';
const ringMesh = new T.Mesh(new T.RingGeometry(6.4, 6.7, 64), new T.MeshBasicMaterial({color:'#ffffff', transparent:true, opacity:0.75, side:T.DoubleSide}));
ringMesh.rotation.x = -Math.PI/2; ringMesh.visible = false; scene.add(ringMesh);
const reticle = new T.Mesh(new T.RingGeometry(0.35, 0.48, 28), new T.MeshBasicMaterial({color:'#ff5a36', transparent:true, opacity:0.9, side:T.DoubleSide}));
reticle.rotation.x = -Math.PI/2; reticle.visible = false; scene.add(reticle);

function opponentOf(c){
  if (!battle) return null;
  const o = c === battle.mon ? battle.wild : c === battle.wild ? battle.mon : null;
  return o && !o.removed ? o : null;
}
function startBattle(w){
  if (!follower || follower.fainted) return;
  mode = 'battle';
  const tx = trainer.pos.x, tz = trainer.pos.z, wp = w.torso.position;
  const dx = wp.x - tx, dz = wp.z - tz, l = Math.hypot(dx, dz) || 1;
  const center = {x:wp.x - dx/l*1.6, z:wp.z - dz/l*1.6};
  battle = {wild:w, mon:follower, member:follower.member, center, R:6.5, over:false, capture:null, endT:0, result:null, faintT:0, switchCd:0};
  follower.role = 'fighter'; w.role = 'enemy'; follower = null;
  trainer.yaw = Math.atan2(dx, dz);
  ringMesh.position.set(center.x, 0.04, center.z); ringMesh.visible = true;
  w.parts.forEach(p => p.velocity.y += 4);
  floatText({x:wp.x, y:wp.y + 1.2, z:wp.z}, '!', '#ff5a36', 44);
  toast(`Um ${w.member.nick} selvagem (Nv. ${w.member.level}, ${ATTR[w.sp.attr].name}) apareceu! Vai, ${battle.mon.member.nick}!`);
  setHud();
}
function endBattle(result){ if (!battle || battle.over) return; battle.over = true; battle.result = result; battle.endT = result === 'flee' ? 0.3 : 1.8; }
function levelUp(m, log){
  while (m.xp >= xpNext(m)){
    m.xp -= xpNext(m);
    const a = stats(m); m.level++; const b = stats(m);
    m.maxHp = b.maxHp; m.hp += b.maxHp - a.maxHp;
    log.push(`${m.nick} subiu pro nível ${m.level}! FOR +${(b.str - a.str).toFixed(1)} · AGI +${(b.agi - a.agi).toFixed(1)} · INT +${(b.int - a.int).toFixed(1)}`);
  }
}
function finishBattle(){
  const r = battle.result, W = battle.wild, lead = battle.member, log = [];
  if (r === 'win' || r === 'capture'){
    if (r === 'capture'){
      W.member.hp = Math.max(1, W.member.hp);
      if (game.team.length < 6){ game.team.push(W.member); log.push(`${W.member.nick} (Nv. ${W.member.level}) entrou pro seu time!`); }
      else { game.box.push(W.member); log.push(`Time cheio: ${W.member.nick} foi pra caixa.`); }
    }
    const xp = Math.round((r === 'capture' ? 10 : 15) + 10*W.member.level);
    trainer.cheerT = Math.max(trainer.cheerT, 1.8);
    lead.xp += xp; log.push(`${lead.nick} ganhou ${xp} XP.`);
    levelUp(lead, log);
    const coins = Math.round((r === 'capture' ? 10 : 25) + (r === 'capture' ? 5 : 10)*W.member.level);
    game.money += coins; log.push(`Você ganhou ${coins} moedas.`);
  }
  if (r === 'flee'){ log.push('Você fugiu!'); W.role = 'wild'; W.cool = 6; W.ai = {t:0, target:null}; W.input = {}; W.confused = 0; }
  else if (!W.dead) destroyCreature(W);
  const mon = battle.mon;
  battle = null; mode = 'world';
  ringMesh.visible = false; reticle.visible = false;
  for (const rk of rocks.slice()) removeRock(rk);
  if (r === 'lose'){
    if (!mon.dead) destroyCreature(mon);
    blackout(); save(); return;
  }
  if (mon.dead || mon.fainted){ if (!mon.dead) destroyCreature(mon); spawnFollower(); }
  else { mon.role = 'follower'; follower = mon; mon.input = {}; mon.confused = 0; }
  log.forEach((l, i) => setTimeout(() => toast(l), i*400));
  save(); setHud();
}
function blackout(){
  $('fade').style.opacity = 1;
  setTimeout(() => {
    healAll(); trainer.pos.set(HEAL_SPOT.x, 0, HEAL_SPOT.z + 1.5); trainer.yaw = 0;
    spawnFollower(); setHud();
    $('fade').style.opacity = 0;
    toast('Todos desmaiaram... Você correu pro Centro de Cura.');
    toast('Seu time foi curado.');
  }, 700);
}
function healAll(){ for (const m of game.team){ m.maxHp = stats(m).maxHp; m.hp = m.maxHp; } save(); renderTeam(); }

const SHELL = {bolota:['#d39a5c','#6b4426'], pinha:['#8f5a2f','#5e3a1c'], coco:['#5b3a1f','#7a5230'], semente:['#f2c230','#fff1a8']};
function cycleCapture(dir=1){
  const owned = CAPTURE_KEYS.filter(k => count(k) > 0);
  if (!owned.length){ toast('Você não tem itens de captura. Compre na loja.'); return; }
  const i = owned.indexOf(game.sel);
  game.sel = owned[(i + dir + owned.length) % owned.length];
  toast(`Arremesso: ${ITEMS[game.sel].name} (${count(game.sel)})`); setHud();
}
const balls = [];
function throwBall(target){
  if (!battle || battle.over || battle.capture || trainer.throwT > 0) return;
  if (count(game.sel) <= 0){
    const other = CAPTURE_KEYS.find(k => count(k) > 0);
    if (!other){ toast('Acabaram os itens de captura! Compre mais na loja.'); return; }
    game.sel = other;
  }
  const itemKey = game.sel;
  const f = trainerFwd();
  const sx = trainer.pos.x + f.x*0.4, sy = 1.7, sz = trainer.pos.z + f.z*0.4;
  const tx = target.x, ty = (target.y || 0) + 0.7, tz = target.z;
  const d = Math.hypot(tx - sx, tz - sz), tf = clamp(d/10, 0.4, 1.1);
  const mask = ALL & ~G_TRAINER & ~G_BALL & ~battle.mon.bit;
  const ball = new C.Body({mass:0.3, shape:new C.Sphere(0.17), material:bodyMat, position:new C.Vec3(sx, sy, sz), collisionFilterGroup:G_BALL, collisionFilterMask:mask, linearDamping:0.1});
  ball.velocity.set((tx - sx)/tf, (ty - sy + 0.5*GRAV*tf*tf)/tf, (tz - sz)/tf);
  ball.angularVelocity.set(rand(-8,8), 0, rand(-8,8));
  ball.isBall = true; ball.used = false; ball.born = clock; ball.item = itemKey;
  ball.addEventListener('collide', e => onCollide(ball, e.body));
  world.addBody(ball);
  const m = makeItemMesh(itemKey); m.scale.setScalar(1.15); scene.add(m);
  balls.push({body:ball, mesh:m, item:itemKey});
  trainer.yaw = Math.atan2(tx - trainer.pos.x, tz - trainer.pos.z);
  trainer.throwT = 0.6; addItem(itemKey, -1);
  if (count(itemKey) <= 0){ const o = CAPTURE_KEYS.find(k => count(k) > 0); if (o) game.sel = o; }
  save(); setHud();
}
function removeBall(b){ world.removeBody(b.body); scene.remove(b.mesh); balls.splice(balls.indexOf(b), 1); }
function removeRock(r){ world.removeBody(r.body); scene.remove(r.mesh); rocks.splice(rocks.indexOf(r), 1); }
function startCapture(ballBody){
  const W = battle && battle.wild;
  if (!W || battle.capture || battle.over || W.removed || W.fainted) return;
  ballBody.used = true;
  const hpR = W.member.hp/W.member.maxHp;
  const it = ITEMS[ballBody.item];
  const base = 0.12 + 0.72*(1 - hpR) + (W.ko > 0 ? 0.2 : 0) + (W.confused > 0 ? 0.08 : 0);
  const chance = it.mult >= 99 ? 1 : clamp(base*it.mult, 0.05, 0.97);
  const success = Math.random() < chance;
  const breakAt = success ? 99 : (Math.random() < chance ? 3 : Math.random() < 0.5 ? 2 : 1);
  // cipós e folhas puxam o animal pra dentro da casca
  const wp = W.torso.position;
  for (let i = 0; i < 22; i++){
    const a = i/22*TAU*2, r = 0.9 - i*0.03;
    burst({x:wp.x + Math.cos(a)*r, y:0.2 + i*0.05, z:wp.z + Math.sin(a)*r}, 1, ['#4aaa4f','#8fd27a','#3f8a3a'], 1);
  }
  shockwave(wp.x, wp.z, '#8fd27a', 1.5);
  hideCreature(W);
  ballBody.velocity.set(0, 5, 0); ballBody.angularVelocity.set(0, 0, 0);
  ballBody.linearDamping = 0.5; ballBody.angularDamping = 0.99;
  battle.capture = {ball:balls.find(b => b.body === ballBody), t:0, shakes:0, success, breakAt};
  toast(`${it.name} fechou ${W.member.nick} lá dentro! (${Math.round(chance*100)}% de chance)`);
}
function sprout(ballObj){
  const g = new T.Group();
  add(g, GY, toon('#3f8a3a'), [0, 0.1, 0], [0.02, 0.2, 0.02]);
  add(g, GS, toon('#4aaa4f'), [0.08, 0.2, 0], [0.1, 0.02, 0.05], [0, 0, 0.5]);
  add(g, GS, toon('#5fc25a'), [-0.07, 0.17, 0], [0.08, 0.018, 0.04], [0, 0, -0.5]);
  g.position.y = 0.15; g.scale.setScalar(0.01);
  ballObj.mesh.add(g); ballObj.sprout = g;
}
function updateCapture(dt){
  const cap = battle.capture; if (!cap) return;
  cap.t += dt;
  const n = Math.floor((cap.t - 0.4)/0.85);
  const ph = ((cap.t - 0.4) % 0.85)/0.85;
  cap.wob = cap.t > 0.4 && ph < 0.4 ? Math.sin(ph/0.4*TAU)*0.5 : 0;
  if (n > cap.shakes && n >= 1){
    cap.shakes = n;
    const W = battle.wild, bp = cap.ball.body.position;
    if (cap.shakes >= cap.breakAt){
      burst(bp, 22, SHELL[cap.ball.item] || ['#ffffff'], 5);
      showCreature(W, bp.x, W.H + 0.4, bp.z);
      removeBall(cap.ball); battle.capture = null;
      toast(pick(['Ah não! Quebrou a casca e escapou!', 'Quase! Saiu lá de dentro!', 'Argh! Parecia que ia dar!']));
    } else if (cap.shakes >= 3 && cap.success){
      cap.done = true; cap.wob = 0;
      sprout(cap.ball);
      burst(bp, 30, ['#ffe066','#ffffff','#8fd27a'], 5);
      trainer.cheerT = 2.2;
      toast(`Peguei! ${W.member.nick} foi capturado! A ${ITEMS[cap.ball.item].name.toLowerCase()} brotou.`);
      setTimeout(() => { if (cap.ball && balls.includes(cap.ball)) removeBall(cap.ball); }, 1500);
      endBattle('capture');
    } else floatText({x:bp.x, y:bp.y + 0.3, z:bp.z}, '...', '#ffffff', 22);
  }
}
function switchTo(i){
  if (mode === 'world'){
    const m = game.team[i]; if (!m || m.hp <= 0 || i === 0) return;
    game.team.splice(i, 1); game.team.unshift(m); spawnFollower(); toast(`${m.nick} agora te acompanha.`); save(); return;
  }
  if (!battle || battle.over || battle.capture || battle.switchCd > 0) return;
  const m = game.team[i]; if (!m || m.hp <= 0 || m === battle.member) return;
  const old = battle.mon;
  burst(old.torso.position, 12, ['#ffffff','#ff5a36'], 3);
  destroyCreature(old);
  game.team.splice(i, 1); game.team.unshift(m);
  const f = trainerFwd();
  battle.mon = makeCreature(m, trainer.pos.x + f.x*1.2, trainer.pos.z + f.z*1.2, 'fighter');
  battle.member = m; battle.switchCd = 1.5; battle.faintT = 0;
  toast(`Volta! Vai, ${m.nick}!`); setHud();
}
function battleUpdate(dt){
  const b = battle, P = b.mon, W = b.wild;
  b.switchCd -= dt;
  if (b.pvp){
    for (const c of creatures){
      if (c.removed) continue;
      const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz) || 0.01;
      if (c === P || c === W){ if (d > b.R){ const k = (d - b.R)*c.totalMass*40; c.torso.force.x -= dx/d*k; c.torso.force.z -= dz/d*k; } }
      else if (d < b.R + 1){ c.torso.force.x += dx/d*c.totalMass*30; c.torso.force.z += dz/d*c.totalMass*30; }
    }
    return;
  }
  if (b.over){ b.endT -= dt; if (W.fainted && !W.removed) W.fade = Math.max(0, W.fade - dt*0.8); if (b.endT <= 0) finishBattle(); return; }
  updateCapture(dt);
  if (!battle) return;
  for (const c of [P, W]){
    if (c.removed) continue;
    const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz);
    if (d > b.R){ const k = (d - b.R)*c.totalMass*40; c.torso.force.x -= dx/d*k; c.torso.force.z -= dz/d*k; }
  }
  for (const c of creatures){
    if (c === P || c === W || c.removed) continue;
    const t = c.torso.position, dx = t.x - b.center.x, dz = t.z - b.center.z, d = Math.hypot(dx, dz);
    if (d < b.R + 1 && d > 0.01){ c.torso.force.x += dx/d*c.totalMass*30; c.torso.force.z += dz/d*c.totalMass*30; }
  }
  if (W.fainted && !W.removed) endBattle('win');
  if (P.fainted){
    b.faintT += dt;
    if (b.faintT > 1.6){
      const idx = game.team.findIndex(m => m.hp > 0);
      if (idx >= 0) switchTo(idx);
      else endBattle('lose');
    }
  }
}

/* ================= Multiplayer =================
   Lobby (sala principal): cada jogador publica na presença onde está, quem está levando e se está desafiando alguém.
   Duelo: quem desafiou é o "host" e roda a física da luta; o convidado manda os comandos e recebe o estado ~30x/s. */
const r2 = v => Math.round(v*100)/100, r3 = v => Math.round(v*1000)/1000;
const net = {room:null, user:null, remotes:new Map(), names:{}, challenge:null, accept:null, decline:null, pubT:0, duel:null, nameT:-9};
(async function initNet(){
  try{
    if (!window.claude || !window.claude.use) return;
    const room = await window.claude.use('room');
    if (!room) return;
    net.user = await window.claude.use('user');
    net.room = room;
    room.onPeers(() => {}, () => { net.room = null; });
    if (mode !== 'title') setHud();
  }catch(e){ net.room = null; }
})();
const lobbyPeers = () => { try { return net.room ? net.room.peers() : []; } catch(e){ return []; } };
const myPeerId = () => { const me = lobbyPeers().find(p => p.sameTab); return me ? me.peer : null; };
const REMOTE_COLORS = ['#3b64d6','#2b9a4a','#8e44ad','#f28c28','#16a3a3','#d63b8f'];
function peerColor(peer){ let h = 0; for (const ch of String(peer)) h = (h*31 + ch.charCodeAt(0))|0; return REMOTE_COLORS[Math.abs(h) % REMOTE_COLORS.length]; }
const nameOf = p => (p && p.by && net.names[p.by]) || 'Treinador';
function cloneMember(m){ const c = {species:m.species, level:m.level, xp:0, nick:m.nick}; c.maxHp = stats(c).maxHp; c.hp = c.maxHp; return c; }

function publishLobby(dt){
  net.pubT -= dt; if (net.pubT > 0) return; net.pubT = 0.1;
  const lead = game.team.find(m => m.hp > 0) || game.team[0];
  const st = mode === 'battle' ? (net.duel ? 'd' : 'b') : 'w';
  net.room.presence({x:r2(trainer.pos.x), z:r2(trainer.pos.z), y:r2(trainer.yaw), mv:trainer.moving ? 1 : 0, sp:lead ? lead.species : null, lv:lead ? lead.level : 1, st,
    ch:net.challenge, ac:net.accept, dc:net.decline}).catch(() => {});
}
function updateRemotes(){
  const seen = new Set(), ids = [];
  for (const p of lobbyPeers()){
    if (p.sameTab || p.kind !== 'viewer') continue;
    const pr = p.presence || {};
    if (typeof pr.x !== 'number' || typeof pr.z !== 'number') continue;
    seen.add(p.peer); if (p.by) ids.push(p.by);
    let r = net.remotes.get(p.peer);
    if (!r){
      const tag = document.createElement('div'); tag.className = 'tag'; document.body.appendChild(tag);
      r = {peer:p.peer, model:makeTrainerModel(peerColor(p.peer)), tag, x:pr.x, z:pr.z, yaw:+pr.y || 0, walk:0, pet:null, petKey:''};
      net.remotes.set(p.peer, r);
    }
    r.p = p; r.tx = clamp(pr.x, -MAP, MAP); r.tz = clamp(pr.z, -MAP, MAP); r.tyaw = +pr.y || 0; r.mv = !!pr.mv; r.st = pr.st;
    const sp = SPECIES[pr.sp] ? pr.sp : null, lv = clamp(pr.lv|0, 1, 100);
    const key = r.st === 'w' && sp ? sp + ':' + lv : '';
    if (key !== r.petKey){
      if (r.pet){ destroyCreature(r.pet); r.pet = null; }
      if (key && slotFree.length > 4) r.pet = makeCreature(newMember(sp, lv), r.x - 1, r.z - 1, 'remote');
      r.petKey = r.pet ? key : '';
    }
  }
  for (const [peer, r] of net.remotes) if (!seen.has(peer)) removeRemote(r);
  if (net.user && ids.length && clock - net.nameT > 3){
    net.nameT = clock;
    net.user.profiles(ids).then(ps => { for (const id of ids) if (ps[id] && ps[id].name) net.names[id] = ps[id].name; }).catch(() => {});
  }
}
function removeRemote(r){ scene.remove(r.model.g); r.tag.remove(); if (r.pet) destroyCreature(r.pet); net.remotes.delete(r.peer); }
function renderRemotes(){
  for (const r of net.remotes.values()){
    r.x += (r.tx - r.x)*0.2; r.z += (r.tz - r.z)*0.2; r.yaw = lerpAngle(r.yaw, r.tyaw, 0.2);
    r.model.g.position.set(r.x, 0, r.z); r.model.g.rotation.y = r.yaw;
    r.moving = r.mv;
    animateTrainer(r.model, r, 1/60);
    const v = new T.Vector3(r.x, 2.15, r.z).project(camera);
    const label = nameOf(r.p) + (r.st === 'b' ? ' · em batalha' : r.st === 'd' ? ' · em duelo' : '');
    if (r.tag.textContent !== label) r.tag.textContent = label;
    r.tag.style.borderColor = peerColor(r.peer);
    r.tag.style.transform = `translate(${(v.x + 1)/2*innerWidth}px, ${(1 - v.y)/2*innerHeight}px) translate(-50%, -100%)`;
    r.tag.hidden = mode === 'title' || Math.abs(v.x) > 1.1 || Math.abs(v.y) > 1.1;
  }
  const n = net.remotes.size + 1;
  const txt = `${n} ${n === 1 ? 'jogador' : 'jogadores'} online`;
  if ($('online').textContent !== txt) $('online').textContent = txt;
}

// desafios: devolve {text, key} para o aviso na tela
function netWorldStep(){
  const me = myPeerId(); if (!me) return null;
  if (net.challenge && clock - net.challengeAt > 20){ net.challenge = null; toast('Ninguém respondeu ao desafio.'); }
  if (net.decline && clock - net.declineAt > 6) net.decline = null;
  if (net.accept && clock - net.acceptAt > 12) net.accept = null;
  if (net.challenge){
    const tgt = net.remotes.get(net.challenge.to);
    if (!tgt){ net.challenge = null; return null; }
    const pr = tgt.p.presence;
    if (pr.ac && pr.ac.from === me && pr.ac.code === net.challenge.code){ const c = net.challenge; net.challenge = null; startDuel(true, c.code, c.to); return null; }

const mouse = {x:0, y:0, has:false, world:new T.Vector3()};

function moveInput(){
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz += 1;
  if (keys.KeyS || keys.ArrowDown) iz -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  const v = new T.Vector3().addScaledVector(FWD, iz).addScaledVector(RIGHT, ix);

/* ================= Loop ================= */
let clock = 0;
function step(dt){
  clock += dt;
  trainer.throwT -= dt;
  if (mode === 'world'){
    const v = moveInput();
    trainer.moving = v.lengthSq() > 0.01;
    if (trainer.moving){ moveTrainer(v.x*5.5*dt, v.z*5.5*dt); trainer.yaw = lerpAngle(trainer.yaw, Math.atan2(v.x, v.z), 0.25); }
    if (follower && !follower.removed) aiFollow(follower);
    for (const w of wilds()) if (!w.removed) aiWander(w, dt);
    const nearHeal = Math.hypot(trainer.pos.x - HEAL_SPOT.x, trainer.pos.z - HEAL_SPOT.z) < 1.6;
    const nearShop = Math.hypot(trainer.pos.x - SHOP_SPOT.x, trainer.pos.z - SHOP_SPOT.z) < 1.5;
    const np = net.room ? netWorldStep() : null;
    if (np) setPrompt(np.text, np.key); else setPrompt(nearHeal ? 'E: curar seu time' : nearShop ? 'E: entrar na loja' : '', 'KeyE');
    if (nearHeal && pressed.KeyE){ healAll(); toast('Seu time foi curado!'); }
    if (nearShop && pressed.KeyE) showShop();
    if (pressed.KeyI) showBag();
    if (pressed.KeyC) cycleCapture();
    for (let i = 1; i <= 6; i++) if (pressed['Digit' + i]) switchTo(i - 1);
    if (pressed.Tab) showTeam();
    if (mode === 'world' && follower && !follower.fainted){
      for (const w of wilds()){
        if (w.removed || w.cool > 0) continue;
        if (Math.hypot(w.torso.position.x - trainer.pos.x, w.torso.position.z - trainer.pos.z) < 3.4){ startBattle(w); break; }
      }
    }
  } else if (mode === 'battle' && battle && battle.pvp){
    trainer.moving = false; setPrompt('');
    if (battle.host) pvpHostStep(dt); else pvpGuestStep(dt);
  } else if (mode === 'battle' && battle){
    trainer.moving = false;
    const P = battle.mon, v = moveInput();
    if (!P.removed){
      const o = opponentOf(P);
      const near = o && Math.hypot(o.torso.position.x - P.torso.position.x, o.torso.position.z - P.torso.position.z) < 2.6;
      P.input = {
        mx:v.x, mz:v.z, jump:!!pressed.Space && !P.grabs.length, lift:!!keys.Space,
        punch:!!(pressed.KeyJ || pressed.Mouse0), grab:!!keys.KeyK, special:!!(pressed.KeyL || pressed.KeyE),
        face: o && (v.lengthSq() < 0.01 || near) ? o.torso.position : null
      };
    }
    if (!battle.wild.removed) aiFight(battle.wild, dt);
    for (const w of wilds()) if (!w.removed) aiWander(w, dt);
    const aim = mouse.has ? mouseGround() : null;
    reticle.visible = !!aim && !battle.capture && !battle.over;
    if (aim) reticle.position.set(aim.x, 0.06, aim.z);
    if (pressed.Mouse2 || pressed.KeyQ){ if (aim) throwBall(aim); else if (!battle.wild.removed) throwBall(battle.wild.torso.position); }
    if (pressed.KeyT && !battle.wild.removed) throwBall(battle.wild.torso.position);
    if (pressed.KeyR && !battle.capture) endBattle('flee');
    if (pressed.KeyC) cycleCapture();
    if (pressed.KeyI) showBag();
    for (let i = 1; i <= 6; i++) if (pressed['Digit' + i]) switchTo(i - 1);
    setPrompt('');
  }
  for (const k in pressed) delete pressed[k];
  if (mode === 'world' || mode === 'battle') updateSpawns(dt);
  if (net.room && mode !== 'title'){
    updateRemotes(); publishLobby(dt);
    for (const r of net.remotes.values()) if (r.pet && !r.pet.removed) aiFollowTo(r.pet, r.x, r.z, r.yaw);
  }

  for (const c of creatures) updateCreature(c, dt);
  const tb = trainer.body;
  const tvx = (trainer.pos.x - tb.position.x)/dt, tvz = (trainer.pos.z - tb.position.z)/dt;
  if (Math.hypot(tvx, tvz) > 10) tb.velocity.set(0, 0, 0); else tb.velocity.set(tvx, 0, tvz);
  tb.position.set(trainer.pos.x, 0.8, trainer.pos.z);
  world.step(dt);
  processContacts();
  processHits();
  if (battle && !(battle.pvp && !battle.host)) battleUpdate(dt);

  for (const b of balls.slice()){
    if (battle && battle.capture && battle.capture.ball === b) continue;
    if ((!b.body.used && clock - b.body.born > 4) || b.body.position.y < -5) removeBall(b);
  }
  for (const r of rocks.slice()) if (clock - r.body.born > (r.body.spent ? 1.2 : 3)) removeRock(r);
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i]; p.life -= dt; p.vy -= 18*dt;
    p.m.position.x += p.vx*dt; p.m.position.y += p.vy*dt; p.m.position.z += p.vz*dt;
    if (p.m.position.y < 0.05){ p.m.position.y = 0.05; p.vy *= -0.3; p.vx *= 0.7; p.vz *= 0.7; }

    const r = rings[i]; r.t += dt; const k = r.t/0.5;

    if (k >= 1){ scene.remove(r.m); rings.splice(i, 1); }
  }
}

    size = clamp(Math.hypot(maxx - minx, maxz - minz)*0.4 + 3, 4.2, 8);
  } else { tgt = new T.Vector3(trainer.pos.x, 0.5, trainer.pos.z); size = 7.5; }
  if (innerWidth < innerHeight) size *= 1.25;
  cam.target.lerp(tgt, 0.08);
  cam.cur += (size - cam.cur)*0.05;
  const a = innerWidth/innerHeight;
  camera.left = -cam.cur*a; camera.right = cam.cur*a; camera.top = cam.cur; camera.bottom = -cam.cur; camera.updateProjectionMatrix();
  cam.shake *= 0.88;
  const sh = new T.Vector3(rand(-1,1), rand(-1,1), rand(-1,1)).multiplyScalar(cam.shake);
  camera.position.copy(cam.target).add(ISO).add(sh);
  camera.lookAt(cam.target.clone().add(sh));
  sun.position.set(cam.target.x + 10, 22, cam.target.z + 6); sun.target.position.copy(cam.target);
  renderer.render(scene, camera);
  for (let i = floats.length - 1; i >= 0; i--){
    const f = floats[i]; f.life -= 1/60; f.p.y += 0.02;
    const v = f.p.clone().project(camera);
    f.el.style.transform = `translate(${(v.x + 1)/2*innerWidth}px, ${(1 - v.y)/2*innerHeight}px) translate(-50%, -50%)`;
    f.el.style.opacity = clamp(f.life*1.6, 0, 1);
    if (f.life <= 0){ f.el.remove(); floats.splice(i, 1); }
  }
  if (net.room) renderRemotes();
  if (battle) battle.pvp ? updatePvpHud() : updateBattleHud();
}

/* ================= HUD e menus ================= */
const hpColor = r => r > 0.5 ? 'var(--hp)' : r > 0.2 ? 'var(--hpmid)' : 'var(--hplow)';
const chip = attr => `<span class="chip ${attr}">${ATTR[attr].short}</span>`;
let teamKey = '';
function renderTeam(){
  const lead = battle ? battle.member : game.team[0];
  const key = game.team.map(m => `${m.species}${m.level}${Math.ceil(m.hp)}${m.maxHp}`).join('|') + game.team.indexOf(lead);
  if (key === teamKey) return; teamKey = key;
  $('team').innerHTML = game.team.map((m, i) => {
    const r = m.hp/m.maxHp, sp = SPECIES[m.species];
    return `<div class="tm card-ui ${m === lead ? 'lead' : ''} ${m.hp <= 0 ? 'out' : ''}"><img src="${portrait(m.species)}" alt="${sp.name}"><span class="n">${i + 1}. ${m.nick}</span><span class="l">${chip(sp.attr)} Nv. ${m.level}</span><div class="bar"><i style="width:${r*100}%;background:${hpColor(r)}"></i></div></div>`;
  }).join('');
}
let wildKey = '';
function updateBattleHud(){
  renderTeam();
  const m = battle.wild.member, sp = SPECIES[m.species];
  const key = m.species + m.level + battle.member.species;
  if (key !== wildKey){
    const mine = SPECIES[battle.member.species];
    const a = BEATS[mine.attr] === sp.attr ? `<span style="color:var(--agi)">Vantagem sua: ${ATTR[mine.attr].name} vence ${ATTR[sp.attr].name}</span>`
      : BEATS[sp.attr] === mine.attr ? `<span style="color:var(--str)">Desvantagem: ${ATTR[sp.attr].name} vence ${ATTR[mine.attr].name}</span>`
      : `<span>Atributos iguais</span>`;
    $('wild').innerHTML = `<div class="row"><span class="n"><img src="${portrait(m.species)}" alt="">${m.nick}</span><span class="l">Nv. ${m.level}</span></div><div class="bar"><i></i></div><div class="meta"><span>${chip(sp.attr)} ${ATTR[sp.attr].name}</span><span id="whp"></span></div><div id="matchup">${a}</div>`;
    wildKey = key;
  }
  const r = m.hp/m.maxHp, bar = $('wild').querySelector('.bar>i');
  bar.style.width = r*100 + '%'; bar.style.background = hpColor(r);
  $('whp').textContent = `${Math.ceil(m.hp)}/${m.maxHp} PV`;
  const cd = battle.mon.specialCd;
  $('spec').textContent = cd > 0 ? `${battle.mon.sp.specialName} em ${cd.toFixed(1)}s` : `${battle.mon.sp.specialName} pronto (L)`;
  $('spec').style.opacity = cd > 0 ? 0.6 : 1;
}
function setHud(){
  const inBattle = mode === 'battle';
  const pvp = !!(battle && battle.pvp);
  $('team').hidden = mode === 'title' || pvp;
  $('wild').hidden = !inBattle || !battle;
  $('me').hidden = !pvp;
  $('big').hidden = !pvp;
  $('pills').hidden = mode === 'title';
  $('online').hidden = !net.room || mode === 'title';
  $('spec').hidden = !inBattle;
  $('teamBtn').hidden = inBattle;
  $('bagBtn').hidden = pvp;
  $('capSel').hidden = pvp;
  $('money').textContent = `${game.money} moedas`;
  $('capSel').innerHTML = `<img src="${itemIcon(game.sel)}" alt="">${ITEMS[game.sel].name} ×${count(game.sel)} <span class="small">(C)</span>`;
  $('help').hidden = mode === 'title';
  $('help').innerHTML = pvp
    ? 'DUELO · <kbd>WASD</kbd> mover · <kbd>J</kbd>/clique ataque · <kbd>K</kbd> segurar agarra/morde (+<kbd>Espaço</kbd> levanta) · <kbd>L</kbd> especial · <kbd>R</kbd> desistir'
    : inBattle
    ? '<kbd>WASD</kbd> mover · <kbd>J</kbd>/clique ataque · <kbd>K</kbd> segurar agarra/morde (+<kbd>Espaço</kbd> levanta) · <kbd>L</kbd> especial · <kbd>Q</kbd>/botão direito arremessa captura · <kbd>C</kbd> troca captura · <kbd>I</kbd> mochila · <kbd>1</kbd>-<kbd>6</kbd> trocar · <kbd>R</kbd> fugir'
    : '<kbd>WASD</kbd> andar · chegue perto de um animal no mato alto pra batalhar · <kbd>I</kbd> mochila · <kbd>Tab</kbd> time · <kbd>E</kbd> no tapete do Centro ou da Loja' + (net.room ? ' · <kbd>F</kbd> perto de um amigo: desafiar pra duelo' : '');
  teamKey = ''; wildKey = ''; $('wild').dataset.key = ''; $('me').dataset.key = ''; renderTeam();
}
let promptText = null, promptKey = null;
function setPrompt(t, key){ promptKey = t ? key || null : null; if (t === promptText) return; promptText = t; $('prompt').hidden = !t; $('prompt').textContent = t; }
$('prompt').onclick = () => { if (promptKey) pressed[promptKey] = true; };

const triHtml = `<div class="tri">${chip('forca')} vence ${chip('agilidade')} · ${chip('agilidade')} vence ${chip('inteligencia')} · ${chip('inteligencia')} vence ${chip('forca')}</div>`;
function attrBars(m){
  const s = stats(m), max = 50;
  const row = (k, v, col) => `<span>${k}</span><span class="b"><i style="width:${clamp(v/max*100, 4, 100)}%;background:${col}"></i></span><span>${v.toFixed(0)}</span>`;
  return `<div class="attrs">${row('FOR', s.str, 'var(--str)')}${row('AGI', s.agi, 'var(--agi)')}${row('INT', s.int, 'var(--int)')}</div>`;
}
function monCard(m, opts={}){
  const sp = SPECIES[m.species], s = stats(m);
  return `<div class="mon ${opts.lead ? 'lead' : ''}">
    <img src="${portrait(m.species)}" alt="${sp.name}">
    <div class="t">${m.nick}${chip(sp.attr)}</div>
    ${opts.starter ? `<p>${sp.desc}</p>` : `<div class="small">Nv. ${m.level} · XP ${m.xp}/${xpNext(m)} · PV ${Math.ceil(m.hp)}/${m.maxHp}</div>`}
    ${attrBars(m)}
    <div class="small">Especial: ${sp.specialName} · ${sp.plan === 'quad' ? 'ataca mordendo' : 'ataca socando'}</div>
    <div class="small">Velocidade ${s.speed.toFixed(2)} · Esquiva ${Math.round(s.dodge*100)}% · Recarga do especial ${s.specCd.toFixed(1)}s</div>
    ${opts.starter ? `<button class="primary" data-starter="${m.species}">Escolher ${sp.name}</button>` : opts.idx > 0 && m.hp > 0 ? `<button data-lead="${opts.idx}">Levar comigo</button>` : ''}
  </div>`;
}
function showTitle(){
  mode = 'title'; setHud();
  $('overlay').hidden = false;
  $('card').innerHTML = `<h1 class="logo">Pancadamon</h1>
    <p class="sub">Animais molengas que brigam de verdade. Enfraqueça, agarre, arremesse e capture.</p>
    <h2>Escolha seu primeiro animal</h2>
    ${triHtml}
    <div class="grid">${STARTERS.map(k => monCard(newMember(k, 5), {starter:true})).join('')}</div>
    <div class="controls">
      <div><kbd>WASD</kbd> andar / mover o animal</div><div><kbd>J</kbd> ou clique: soco ou mordida</div>
      <div><kbd>K</kbd> segurar: agarrar ou morder e segurar</div><div><kbd>Espaço</kbd> pular, ou levantar quem você pegou</div>
      <div><kbd>L</kbd> golpe especial do animal</div><div><kbd>Q</kbd> ou botão direito: arremessar bolota na mira</div>
      <div><kbd>I</kbd> mochila: usar e ver itens</div><div><kbd>E</kbd> na loja: comprar cura e captura</div>
    </div>`;
  $('card').querySelectorAll('[data-starter]').forEach(b => b.onclick = () => {
    game = {team:[newMember(b.dataset.starter, 5)], box:[], money:300, inv:{bolota:5, fruta:3}, sel:'bolota'};
    save(); enterWorld(); toast(`Você escolheu ${SPECIES[b.dataset.starter].name}! Procure animais no mato alto.`);
  });
}
/* Menus: abrir um menu pausa o jogo (inclusive no meio da batalha) */
let menuReturn = 'world', menuKind = null;
function openMenu(kind, html){
  if (mode !== 'menu') menuReturn = mode;
  mode = 'menu'; menuKind = kind;
  $('overlay').hidden = false; $('card').innerHTML = html;
  for (const k in keys) keys[k] = false;
}
function closeMenu(){
  if (mode !== 'menu') return;
  $('overlay').hidden = true; mode = menuReturn; menuKind = null; setHud();
}
addEventListener('keydown', e => {
  if (mode !== 'menu') return;
  if (e.code === 'Escape' || (e.code === 'Tab' && menuKind === 'team') || (e.code === 'KeyI' && menuKind === 'bag') || (e.code === 'KeyE' && menuKind === 'shop')){
    closeMenu(); delete pressed[e.code];
  }
});

function showTeam(){
  if (mode !== 'world' && !(mode === 'menu' && menuKind === 'team')) return;
  openMenu('team', `<h2>Seu time</h2>${triHtml}
    <div class="grid">${game.team.map((m, i) => monCard(m, {idx:i, lead:i === 0})).join('')}</div>
    ${game.box.length ? `<p class="small" style="margin-top:12px">Na caixa: ${game.box.map(m => m.nick + ' Nv. ' + m.level).join(', ')}</p>` : ''}
    <div class="actions"><button class="primary" id="closeMenu">Voltar (Tab)</button><button id="resetBtn">Novo jogo</button></div>
    <p class="small" id="resetNote" hidden>Clique em "Novo jogo" de novo para apagar o progresso.</p>`);
  $('closeMenu').onclick = closeMenu;
  $('card').querySelectorAll('[data-lead]').forEach(b => b.onclick = () => { mode = 'world'; switchTo(+b.dataset.lead); showTeam(); });
  let armed = false;
  $('resetBtn').onclick = () => { if (armed){ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} location.reload(); } else { armed = true; $('resetNote').hidden = false; } };
}
$('teamBtn').onclick = showTeam;

function itemCard(k, inner, sel){
  const it = ITEMS[k];
  return `<div class="item ${sel ? 'sel' : ''}"><img src="${itemIcon(k)}" alt=""><div class="nm">${it.name}</div><div class="ds">${it.desc}</div><div class="ds">Na mochila: ${count(k)}</div><div class="row">${inner}</div></div>`;
}
function showShop(){
  const sections = [['cura', 'Cura'], ['captura', 'Captura']];
  const html = `<div class="shophead"><h2 style="margin:0">Loja do Mato</h2><span class="coins">${game.money} moedas</span></div>
    <p class="hint">Você ganha moedas vencendo e capturando animais.</p>
    ${sections.map(([cat, title]) => `<div class="sect">${title}</div><div class="items">${Object.keys(ITEMS).filter(k => ITEMS[k].cat === cat).map(k => {
      const p = ITEMS[k].price;
      return itemCard(k, `<span class="qty">${p} moedas</span><span><button data-buy="${k}" data-n="1" ${game.money < p ? 'disabled' : ''}>Comprar</button> <button data-buy="${k}" data-n="5" ${game.money < p*5 ? 'disabled' : ''}>×5</button></span>`);
    }).join('')}</div>`).join('')}
    <div class="actions"><button class="primary" id="closeMenu">Sair da loja (E)</button></div>`;
  openMenu('shop', html);
  $('closeMenu').onclick = closeMenu;
  $('card').querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
    const k = b.dataset.buy, n = +b.dataset.n, cost = ITEMS[k].price*n;
    if (game.money < cost) return;
    game.money -= cost; addItem(k, n); save();
    const top = $('card').scrollTop; showShop(); $('card').scrollTop = top;
    toast(`Comprou ${n}× ${ITEMS[k].name}.`);
  });
}
let bagPick = null;
function showBag(){
  if (battle && battle.pvp) return;
  const inBattle = menuReturn === 'battle' || mode === 'battle';
  const owned = Object.keys(ITEMS).filter(k => count(k) > 0);
  const cure = owned.filter(k => ITEMS[k].cat === 'cura'), cap = owned.filter(k => ITEMS[k].cat === 'captura');
  if (bagPick && !cure.includes(bagPick)) bagPick = null;
  let targets = '';
  if (bagPick){
    const it = ITEMS[bagPick];
    targets = `<div class="sect">Usar ${it.name} em quem?</div><div class="targets">${game.team.map((m, i) => {
      const ok = it.revive ? m.hp <= 0 : m.hp > 0 && m.hp < m.maxHp;
      return `<button data-use="${i}" ${ok ? '' : 'disabled'}><img src="${portrait(m.species)}" alt="">${m.nick} ${Math.ceil(m.hp)}/${m.maxHp}</button>`;
    }).join('')}</div>`;
  }
  const html = `<div class="shophead"><h2 style="margin:0">Mochila</h2><span class="coins">${game.money} moedas</span></div>
    ${inBattle ? '<p class="hint">Batalha pausada enquanto a mochila está aberta.</p>' : ''}
    <div class="sect">Cura</div>
    ${cure.length ? `<div class="items">${cure.map(k => itemCard(k, `<span class="qty">×${count(k)}</span><button data-pick="${k}">${bagPick === k ? 'Escolhido' : 'Usar'}</button>`, bagPick === k)).join('')}</div>` : '<p class="hint">Nenhum item de cura. Compre na loja.</p>'}
    ${targets}
    <div class="sect">Captura</div>
    ${cap.length ? `<div class="items">${cap.map(k => itemCard(k, `<span class="qty">×${count(k)}</span><button data-sel="${k}" ${game.sel === k ? 'disabled' : ''}>${game.sel === k ? 'Equipado' : 'Equipar'}</button>`, game.sel === k)).join('')}</div>` : '<p class="hint">Nenhum item de captura. Compre na loja.</p>'}
    <p class="hint">O item equipado é o que você arremessa com Q ou botão direito.</p>
    <div class="actions"><button class="primary" id="closeMenu">Fechar (I)</button></div>`;
  openMenu('bag', html);
  $('closeMenu').onclick = () => { bagPick = null; closeMenu(); };
  $('card').querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { bagPick = b.dataset.pick; showBag(); });
  $('card').querySelectorAll('[data-sel]').forEach(b => b.onclick = () => { game.sel = b.dataset.sel; save(); showBag(); });
  $('card').querySelectorAll('[data-use]').forEach(b => b.onclick = () => { useItem(bagPick, game.team[+b.dataset.use]); showBag(); });
}
function useItem(k, m){
  const it = ITEMS[k];
  if (!it || count(k) <= 0 || !m) return;
  if (it.revive){
    if (m.hp > 0) return;
    m.hp = Math.ceil(m.maxHp*it.revive);
    if (battle && battle.member === m && battle.mon.fainted){ battle.mon.fainted = false; battle.mon.ko = 1; battle.faintT = 0; }
    toast(`${m.nick} acordou!`);
  } else {
    if (m.hp <= 0 || m.hp >= m.maxHp) return;
    const before = m.hp; m.hp = Math.min(m.maxHp, m.hp + it.heal);
    toast(`${m.nick} recuperou ${Math.round(m.hp - before)} PV.`);
  }
  addItem(k, -1); save(); teamKey = ''; renderTeam();
  if (mode === 'menu' && menuReturn === 'world' && !follower) spawnFollower();
}
$('bagBtn').onclick = () => { if (mode === 'world' || mode === 'battle') showBag(); };
function enterWorld(){
  $('overlay').hidden = true; mode = 'world';
  if (!game.team.some(m => m.hp > 0)) healAll();
  spawnFollower(); setHud();
  for (const p of PATCHES){ let n = creatures.filter(c => c.patch === p).length; for (let i = 0; i < 6 && n < PER_PATCH; i++) if (spawnWild(p, false)) n++; }
}

/* ================= Início ================= */
resize();
let last = performance.now(), acc = 0;
function frame(now){
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000/60 && n < 4){ if (mode !== 'menu') step(1/60); acc -= 1000/60; n++; }
  if (n === 4) acc = 0;
  render();
  requestAnimationFrame(frame);
}
if (load()){ enterWorld(); toast('Bem-vindo de volta!'); } else showTitle();
requestAnimationFrame(frame);
</script>
</body>
