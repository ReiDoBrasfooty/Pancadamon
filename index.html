<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap">

<style>
/* Layout: cena 3D isométrica em tela cheia; HUD em cartões flutuantes nos cantos; menus como cartão central */
:root{
  --bg:#9fd4f2; --panel:#fffaf0; --ink:#2a2140; --muted:#6b6283; --line:#2a2140; --soft:#f1e9d8;
  --accent:#ff5a36; --accent-ink:#fff; --hp:#38c96a; --hpmid:#f2b632; --hplow:#ec4545;
  --str:#d9472b; --agi:#2b9a4a; --int:#3b64d6;
  --display:'Lilita One','Arial Black',system-ui,sans-serif;
  --body:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --panel:#262a44; --ink:#f4efff; --muted:#aaa3c8; --line:#0c0d1c; --soft:#323756; color-scheme:dark } }
:root[data-theme="dark"]{ --panel:#262a44; --ink:#f4efff; --muted:#aaa3c8; --line:#0c0d1c; --soft:#323756; color-scheme:dark }
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%}
.card-ui{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:0 4px 0 var(--line)}
#team{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;width:min(240px,44vw)}
.tm{padding:5px 8px;display:grid;grid-template-columns:34px 1fr auto;gap:0 8px;align-items:center}
.tm img{width:34px;height:34px;grid-row:1/3;border-radius:8px;background:var(--soft)}
.tm.lead{outline:3px solid var(--accent);outline-offset:-1px}
.tm.out{opacity:.5}
.tm .n{font-family:var(--display);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.tm .l{font-weight:800;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:4px;align-items:center}
.tm .bar{grid-column:2/4}
.bar{height:10px;border:2px solid var(--line);border-radius:8px;background:var(--soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--hp);transition:width .15s}
.chip{display:inline-block;font-size:11px;font-weight:800;color:#fff;border-radius:6px;padding:0 6px;border:2px solid var(--line);text-transform:uppercase;letter-spacing:.05em;line-height:16px}
.chip.forca{background:var(--str)} .chip.agilidade{background:var(--agi)} .chip.inteligencia{background:var(--int)}
#wild{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(270px,44vw);padding:8px 12px}
#wild .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
#wild .n{font-family:var(--display);font-size:22px;display:flex;gap:8px;align-items:center;min-width:0}
#wild .n img{width:36px;height:36px;border-radius:8px;background:var(--soft)}
#wild .l{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
#wild .bar{height:13px;margin-top:6px}
#wild .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;font-weight:800;color:var(--muted);gap:6px}
#matchup{margin-top:4px;font-size:12px;font-weight:800}
#pills{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:flex;gap:8px}
.pill{padding:4px 12px;border-radius:999px;font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap;font-size:14px}
button.pill{padding:4px 12px;font-size:14px;box-shadow:0 4px 0 var(--line)}
#prompt{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);padding:8px 16px;font-weight:800}
#toasts{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:6px;pointer-events:none;width:min(560px,calc(100vw - 32px))}
.toast{padding:7px 14px;font-weight:800;text-align:center;transition:opacity .4s,transform .4s}
#help{position:fixed;left:16px;right:16px;bottom:calc(12px + env(safe-area-inset-bottom,0px));text-align:center;font-size:13px;font-weight:800;color:#1d2a3a;text-shadow:0 1px 0 rgba(255,255,255,.6)}
#help kbd{font-family:var(--body);background:#fffaf0;color:#2a2140;border:2px solid #2a2140;border-radius:6px;padding:0 5px}
.dmg{position:fixed;left:0;top:0;font-family:var(--display);font-size:26px;color:#fff;-webkit-text-stroke:2px #2a2140;paint-order:stroke fill;pointer-events:none;white-space:nowrap}
#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity .5s}
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:color-mix(in srgb,#9fd4f2 45%,transparent);backdrop-filter:blur(4px);overflow-y:auto}
.card{background:var(--panel);border:4px solid var(--line);border-radius:22px;box-shadow:0 8px 0 var(--line);padding:22px;width:min(860px,100%);max-height:calc(100% - 20px);overflow-y:auto}
.logo{font-family:var(--display);font-size:clamp(40px,9vw,72px);line-height:1;margin:0;color:var(--accent);-webkit-text-stroke:3px var(--line);paint-order:stroke fill;text-shadow:0 5px 0 var(--line)}
.sub{color:var(--muted);font-weight:800;margin:8px 0 14px}
h2{font-family:var(--display);font-weight:400;font-size:26px;margin:0 0 10px}
.tri{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-weight:800;font-size:14px;margin-bottom:16px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.mon{border:3px solid var(--line);border-radius:16px;padding:12px;background:var(--soft);display:flex;flex-direction:column;gap:8px;min-width:0}
.mon.lead{outline:4px solid var(--accent);outline-offset:-1px}
.mon img{width:100%;max-width:170px;aspect-ratio:1;margin:0 auto;display:block}
.mon .t{font-family:var(--display);font-size:24px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mon p{margin:0;font-size:14px;color:var(--muted);font-weight:800}
.attrs{display:grid;grid-template-columns:auto 1fr 30px;gap:3px 8px;align-items:center;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.attrs .b{height:8px;border-radius:6px;background:var(--panel);border:2px solid var(--line);overflow:hidden}
.attrs .b i{display:block;height:100%}
.small{font-size:13px;color:var(--muted);font-weight:800}
.controls{margin-top:16px;font-size:14px;font-weight:800;color:var(--muted);display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 16px}
.controls kbd{font-family:var(--body);background:var(--soft);color:var(--ink);border:2px solid var(--line);border-radius:6px;padding:0 5px}
button{font-family:var(--body);font-weight:800;font-size:15px;color:var(--ink);background:var(--panel);border:3px solid var(--line);border-radius:12px;padding:8px 14px;cursor:pointer;box-shadow:0 3px 0 var(--line)}
button.primary{background:var(--accent);color:var(--accent-ink)}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
#capSel{display:flex;align-items:center;gap:6px}
#me{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));width:min(270px,44vw);padding:8px 12px}
.fcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.fcard .n{font-family:var(--display);font-size:22px;display:flex;gap:8px;align-items:center;min-width:0}
.fcard .n img{width:36px;height:36px;border-radius:8px;background:var(--soft)}
.fcard .l{font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.fcard .bar{height:13px;margin-top:6px}
.fcard .meta{display:flex;justify-content:space-between;align-items:center;margin-top:5px;font-size:12px;font-weight:800;color:var(--muted);gap:6px}
#big{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--display);font-size:clamp(56px,14vw,120px);color:#fff;-webkit-text-stroke:4px #2a2140;paint-order:stroke fill;pointer-events:none;text-shadow:0 6px 0 #2a2140}
.tag{position:fixed;left:0;top:0;padding:2px 8px;border-radius:999px;background:var(--panel);color:var(--ink);border:3px solid var(--line);font-weight:800;font-size:12px;white-space:nowrap;pointer-events:none}
#prompt{cursor:pointer}
.bubble{position:fixed;left:0;top:0;max-width:230px;padding:6px 10px;background:var(--panel);color:var(--ink);border:3px solid var(--line);border-radius:14px;font-weight:800;font-size:13px;line-height:1.3;pointer-events:none;box-shadow:0 3px 0 var(--line);text-wrap:pretty}
#area{position:fixed;left:50%;top:calc(66px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--display);font-size:clamp(24px,4.5vw,38px);color:#fff;-webkit-text-stroke:3px #2a2140;paint-order:stroke fill;text-shadow:0 4px 0 #2a2140;pointer-events:none;opacity:0;transition:opacity .5s;white-space:nowrap}
#area.show{opacity:1}
#evo{position:fixed;left:50%;top:22%;transform:translate(-50%,-50%) scale(.9);text-align:center;font-family:var(--display);color:#fff;-webkit-text-stroke:3px #2a2140;paint-order:stroke fill;text-shadow:0 4px 0 #2a2140;pointer-events:none;opacity:0;transition:opacity .4s,transform .4s;width:min(92vw,900px)}
#evo.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
#evo b{display:block;font-weight:400;font-size:clamp(22px,4.5vw,36px)}
#evo span{display:block;font-size:clamp(40px,9vw,80px);line-height:1.05;color:#ffd84a}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .9s}
@media (prefers-reduced-motion:reduce){#evo,#flash{transition:none}}@media (prefers-reduced-motion:reduce){#area{transition:none}}
#capSel img{width:22px;height:22px;margin:-4px 0}
.shophead{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.coins{font-family:var(--display);font-size:22px;color:#b8860b;font-variant-numeric:tabular-nums}
.sect{font-family:var(--display);font-size:20px;margin:14px 0 8px}
.boxlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.boxrow{display:flex;align-items:center;gap:10px;border:3px solid var(--line);border-radius:14px;padding:6px 10px;background:var(--soft);min-width:0}
.boxrow img{width:52px;height:52px;flex:none}
.boxrow .nm{flex:1;min-width:0;font-weight:800;display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.boxrow .nm .small{flex-basis:100%}
.boxrow button{flex:none}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px}
.item{border:3px solid var(--line);border-radius:14px;background:var(--soft);padding:10px;display:grid;grid-template-columns:64px 1fr;gap:4px 10px;align-items:start;min-width:0}
.item.sel{outline:4px solid var(--accent);outline-offset:-1px}
.item img{width:64px;height:64px;grid-row:1/4}
.item .nm{font-family:var(--display);font-size:18px;line-height:1.1}
.item .ds{font-size:13px;font-weight:800;color:var(--muted)}
.item .row{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:space-between;margin-top:6px}
.item .qty{font-weight:800;font-variant-numeric:tabular-nums}
.item button{padding:4px 10px;font-size:13px}
.targets{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.targets button{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;font-size:13px}
.targets img{width:30px;height:30px}
.bosses{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.boss{border:3px solid var(--line);border-radius:14px;padding:8px 10px;background:var(--soft);display:flex;flex-direction:column;gap:2px;min-width:0}
.boss b{font-family:var(--display);font-weight:400;font-size:18px}
.boss.done{outline:3px solid #f2c230;outline-offset:-1px}
.hint{font-size:13px;font-weight:800;color:var(--muted);margin:6px 0 0}
#touch{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:none;justify-content:space-between;align-items:flex-end;padding:0 12px;pointer-events:none}
#touch .pad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;pointer-events:auto}
#touch .acts{display:grid;grid-template-columns:repeat(3,58px);gap:6px;pointer-events:auto}
#touch button{padding:0;width:100%;height:52px;font-size:12px}
@media (pointer:coarse){ #touch{display:flex} #help{display:none} #prompt{bottom:calc(200px + env(safe-area-inset-bottom,0px))} #toasts{bottom:calc(250px + env(safe-area-inset-bottom,0px))} }
@media (max-width:600px){ #pills{top:auto;bottom:calc(60px + env(safe-area-inset-bottom,0px))} .tm .n{font-size:14px} }
@media (prefers-reduced-motion:reduce){ .bar>i,.toast{transition:none} }
</style>

<div id="team" hidden></div>
<div id="wild" class="card-ui fcard" hidden></div>

<div id="big" hidden></div>
<div id="area"></div>

<script>
const T = THREE, C = CANNON;
const $ = id => document.getElementById(id);
const TAU = Math.PI*2;
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const rand = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const wrapA = a => { a = (a + Math.PI) % TAU; if (a < 0) a += TAU; return a - Math.PI; };
const lerpAngle = (a,b,t) => a + wrapA(b - a)*t;

  forca:{name:'Força', short:'FOR', color:'#d9472b'},

};

const BEATS = {forca:'agilidade', agilidade:'inteligencia', inteligencia:'forca'};
const adv = (a, d) => BEATS[a.sp.attr] === d.sp.attr ? 1.3 : BEATS[d.sp.attr] === a.sp.attr ? 0.8 : 1;

const SPECIES = {

  return FORMS[key] = {...sp, stage:st, fromQuad:quad, plan:'biped', name:formName(m.species, st),

function load(){
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (s && s.team && s.team.length && s.team.every(m => SPECIES[m.species])){
      if (!s.inv){ s.inv = {bolota:s.balls || 5, fruta:3}; delete s.balls; }
      if (typeof s.money !== 'number') s.money = 300;
      if (!ITEMS[s.sel]) s.sel = 'bolota';
      s.box = Array.isArray(s.box) ? s.box.filter(m => m && SPECIES[m.species]) : [];
      // saves antigos aceitavam 6 no time: quem sobra vai pra caixa
      if (s.team.length > TEAM_MAX) s.box.unshift(...s.team.splice(TEAM_MAX));
      // saves de antes das evoluções: quem já tem nível de evoluir ganha o nome e os PV da forma nova
      for (const m of [...s.team, ...s.box]){
        if ([0, 1, 2].some(k => m.nick === formName(m.species, k))) m.nick = formName(m.species, stageOf(m));
        const mh = stats(m).maxHp;
        if (m.maxHp !== mh){ m.hp = m.hp > 0 ? Math.max(1, Math.round(m.hp*mh/m.maxHp)) : 0; m.maxHp = mh; }
      }
      // saves de antes dos chefes: libera os mapas onde a pessoa já estava ou que o time já aguenta
      if (!s.bosses || typeof s.bosses !== 'object') s.bosses = {};
      if (!Array.isArray(s.keys)){
        const top = Math.max(...[...s.team, ...s.box].map(m => m.level | 0));
        s.keys = [1, 2, 3, 4].filter(i => i <= (s.map | 0) || top >= [0, 8, 13, 17, 22][i]);
      }
      game = s; return true;
    }
  }catch(e){}
  return false;
}

function rimify(m){
  m.onBeforeCompile = s => {
    s.uniforms.rimAmt = RIM.amt; s.uniforms.rimCol = RIM.col;
    s.fragmentShader = 'uniform float rimAmt; uniform vec3 rimCol;\n' + s.fragmentShader.replace('#include <dithering_fragment>',
      '#include <dithering_fragment>\n float rim = pow(1. - clamp(normal.z, 0., 1.), 2.5)*smoothstep(-.3, .6, normal.y);\n gl_FragColor.rgb += rimCol*rim*rimAmt;');
  };
  return m;
}

function instanced(geo, mat, items, shadow=false){
  if (!items.length) return null;
  const im = new T.InstancedMesh(geo, mat, items.length), d = new T.Object3D(), c = new T.Color();
  items.forEach((it, i) => {
    d.position.set(it.x, it.y || 0, it.z); d.rotation.set(it.rx || 0, it.ry || 0, it.rz || 0);
    const s = it.s || 1; d.scale.set(it.sx || s, it.sy || s, it.sz || s);
    d.updateMatrix(); im.setMatrixAt(i, d.matrix);
    if (it.c) im.setColorAt(i, c.set(it.c));

  im.castShadow = shadow; im.receiveShadow = true; im.frustumCulled = false; scene.add(im); return im;
}

// tudo que um construtor põe na cena e no mundo da física passa a ser daquele mapa
const regionMark = () => ({objs:new Set(scene.children), nb:world.bodies.length});
function regionClaim(r, mk){
  for (const o of scene.children.slice()) if (!mk.objs.has(o) && !REGIONS.some(g => g.root === o)) r.root.add(o);
  r.bodies.push(...world.bodies.slice(mk.nb));
}
function buildRegion(r, fn){ const mk = regionMark(); fn(r); regionClaim(r, mk); }
for (const r of REGIONS){
  // paredes invisíveis na borda do mapa
  buildRegion(r, () => {
    for (const [sx, sz] of [[1,0],[-1,0],[0,1],[0,-1]]) staticBox(r.cx + sx*(MAP + 0.5), 10, r.cz + sz*(MAP + 0.5), sx ? 0.5 : MAP + 1, 10, sz ? 0.5 : MAP + 1);
    const g = mesh(new T.PlaneGeometry(MAP*2 + 40, MAP*2 + 40), lam(r.ground), false);
    g.rotation.x = -Math.PI/2; g.position.set(r.cx, 0, r.cz); scene.add(g);
  });
}

const _qc = new C.Quaternion(), _qe = new C.Quaternion(), _qa = new C.Quaternion(), _qb = new C.Quaternion(), _qt = new C.Quaternion();
function drive(body, qT, strength, blend){
  body.quaternion.conjugate(_qc);
  qT.mult(_qc, _qe);
  let x = _qe.x, y = _qe.y, z = _qe.z, w = _qe.w;
  if (w < 0){ x = -x; y = -y; z = -z; w = -w; }
  w = Math.min(1, w);
  const s = Math.sqrt(1 - w*w);
  let tx = 0, ty = 0, tz = 0;
  if (s > 1e-4){ const k = 2*Math.acos(w)/s*strength; tx = x*k; ty = y*k; tz = z*k; }
  const av = body.angularVelocity;
  av.x += (tx - av.x)*blend; av.y += (ty - av.y)*blend; av.z += (tz - av.z)*blend;
}
function yawLocal(yaw, axis, ang, out){ _qa.setFromAxisAngle(UP, yaw); _qb.setFromAxisAngle(axis, ang); return _qa.mult(_qb, out); }
function yawLocal2(yaw, ax1, a1, ax2, a2, out){
  _qa.setFromAxisAngle(UP, yaw); _qb.setFromAxisAngle(ax1, a1); _qa.mult(_qb, _qt);
  _qb.setFromAxisAngle(ax2, a2); return _qt.mult(_qb, out);
}

function pathStrip(x1, z1, x2, z2, w, col='#e3cf98'){
  paths.push({x1, z1, x2, z2, w});

// ponto local de um prédio -> mundo (mesma convenção do rotation.y do three.js)
const rotPt = (b, lx, lz) => { const c = Math.cos(b.ry || 0), s = Math.sin(b.ry || 0); return {x:b.x + lx*c + lz*s, z:b.z - lx*s + lz*c}; };
function solidLocal(b, lx, lz, hw, hd, h){
  const p = rotPt(b, lx, lz);
  if (Math.abs(Math.sin(b.ry || 0)) > 0.5) [hw, hd] = [hd, hw];
  rects.push({x:p.x, z:p.z, hw, hd}); staticBox(p.x, h/2, p.z, hw, h/2, hd);
}
function colliderLocal(b, lx, lz, r){ const p = rotPt(b, lx, lz); colliders.push({x:p.x, z:p.z, r}); }
function spotMat(b, kind, lz, r, col, reach){
  const p = rotPt(b, 0, lz);
  const m = mesh(new T.CircleGeometry(r, 24), lam(col), false); m.rotation.x = -Math.PI/2; m.position.set(p.x, 0.02, p.z); scene.add(m);
  SPOTS.push({kind, x:p.x, z:p.z, r:reach, b, lz});
}
const nearestSpot = (kind, x, z) => SPOTS.filter(s => s.kind === kind).sort((a, b) => Math.hypot(a.x - x, a.z - z) - Math.hypot(b.x - x, b.z - z))[0];
function placeGroup(g, b){ g.position.set(b.x, 0, b.z); g.rotation.y = b.ry || 0; scene.add(g); }

function buildTown(t){
  if (t.plaza){ const m = mesh(new T.CircleGeometry(t.plaza, 32), lam('#e9d3a0'), false); m.rotation.x = -Math.PI/2; m.position.set(t.x, 0.018, t.z); scene.add(m); }
  for (const b of t.buildings || []){
    if (b.type === 'center') buildCenter(b);
    else if (b.type === 'shop') buildShop(b);
    else if (b.type === 'box') buildBox(b);
    else if (b.type === 'house') house(b.x, b.z, b.w, b.d, b.wall, b.roof, b.door);
  }
  if (t.well) buildWell(t.x, t.z);
  for (const [x, z] of t.lamps || []) buildLamp(x, z);
}

function signTexture(lines){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256;
  const g = cv.getContext('2d');
  g.fillStyle = '#f3dfb0'; g.fillRect(0, 0, 512, 256);
  g.fillStyle = '#2e1a0a'; g.textAlign = 'center'; g.textBaseline = 'middle';
  // letra grande que encolhe só o necessário pra caber na tábua
  lines.forEach((l, i) => {
    let px = i ? 62 : 84;
    do { g.font = `900 ${px}px Nunito, 'Arial Black', sans-serif`; px -= 2; } while (g.measureText(l).width > 484 && px > 20);
    g.fillText(l, 256, 256/(lines.length + 1)*(i + 1) + (i ? 6 : -4));
  });
  const t = new T.CanvasTexture(cv); t.anisotropy = 4; return t;
}

// anima um treinador (o seu ou o de um amigo); st guarda o estado da animação
const _hip = new T.Vector3();
function animateTrainer(m, st, dt){
  st.t = (st.t || 0) + dt; st.walk = (st.walk || 0) + (st.moving ? dt*15 : 0);
  st.cheerT = (st.cheerT || 0) - dt; st.hopT = (st.hopT || 0) - dt;
  st.idleT = st.moving || st.cheerT > 0 ? 0 : (st.idleT || 0) + dt;
  if (st.idleT > 7){ st.idleT = -rand(2, 6); st.hopT = 0.7; }
  const s = Math.sin(st.walk), cheer = st.cheerT > 0, hop = st.hopT > 0;
  let y = st.moving ? Math.abs(s)*0.13 : Math.sin(st.t*2.4)*0.012;
  if (cheer) y = Math.abs(Math.sin(st.t*9))*0.28;
  if (hop) y = Math.sin((0.7 - st.hopT)/0.7*Math.PI)*0.35;
  m.body.position.y = y;
  const squash = st.moving ? (0.065 - Math.abs(s)*0.13)*0.6 : 0;
  m.body.scale.set(1 + squash, 1 - squash, 1 + squash);
  m.body.rotation.z = st.moving ? s*0.13 : Math.sin(st.t*1.2)*0.03;
  m.body.rotation.x = st.moving ? 0.16 : 0;
  m.legs[0].rotation.x = st.moving ? s*1.0 : hop ? -0.6 : 0;
  m.legs[1].rotation.x = st.moving ? -s*1.0 : hop ? 0.4 : 0;
  // quadril preso no tronco: segue o balanço, a inclinação e o pulo do corpo; no chão a perna estica pro pé não sair do chão
  m.body.updateMatrix();
  m.legs.forEach((l, i) => {
    _hip.set(i ? 0.12 : -0.12, 0.52, 0).applyMatrix4(m.body.matrix);
    l.position.copy(_hip);
    l.rotation.z = m.body.rotation.z;
    const k = cheer || hop ? 1 : clamp(_hip.y/(0.5*Math.cos(l.rotation.x*0.5)), 0.9, 1.4);
    l.scale.y = k; m.shoes[i].scale.y = 0.07/k;
  });
  m.arms.forEach((a, i) => {
    const side = i ? 1 : -1;
    if (cheer || hop){ a.rotation.x = -2.7 + Math.sin(st.t*14 + i*2)*0.35; a.rotation.z = side*(0.5 + Math.sin(st.t*11 + i)*0.3); }
    else if (i === 1 && st.throwT > 0){ a.rotation.x = -3.4 + (0.6 - st.throwT)*7; a.rotation.z = 0.2; }
    else if (st.moving){ a.rotation.x = (i ? s : -s)*1.4; a.rotation.z = side*(0.35 + Math.abs(Math.cos(st.walk))*0.6); }
    else { a.rotation.x = Math.sin(st.t*1.7 + i)*0.08; a.rotation.z = side*0.15; }
  });
  m.neck.rotation.z = -m.body.rotation.z*1.6 + (st.moving ? Math.sin(st.walk*2)*0.05 : Math.sin(st.t*0.9)*0.08);
  m.neck.rotation.x = st.moving ? -0.18 + Math.sin(st.walk*2)*0.08 : 0;
  m.pack.position.y = 0.84 + (st.moving ? Math.abs(Math.cos(st.walk))*0.05 : 0);
  m.tongue.visible = st.moving || cheer;
  m.mouth.scale.y = cheer || hop ? 0.22 : 0.13;
  st.pupils = m.pupils;
  updatePupils(st, m.head);
}
(function buildTrainer(){
  const m = makeTrainerModel('#e8412b');

  trainer.body.position.set(trainer.pos.x, 0.8, trainer.pos.z); world.addBody(trainer.body);
})();
const trainerFwd = () => new T.Vector3(Math.sin(trainer.yaw), 0, Math.cos(trainer.yaw));
function resolveCollision(x, z, rad, skip=null){
  const rg = regionAt(x);
  x = clamp(x, rg.cx - MAP + 1, rg.cx + MAP - 1); z = clamp(z, rg.cz - MAP + 1, rg.cz + MAP - 1);
  for (const c of colliders){ if (c === skip) continue; const ex = x - c.x, ez = z - c.z, d = Math.hypot(ex, ez), m = c.r + rad; if (d < m && d > 1e-4){ x = c.x + ex/d*m; z = c.z + ez/d*m; } }
  for (const r of rects){
    const hw = r.hw + rad, hd = r.hd + rad;
    if (Math.abs(x - r.x) < hw && Math.abs(z - r.z) < hd){
      const px = hw - Math.abs(x - r.x), pz = hd - Math.abs(z - r.z);
      if (px < pz) x = r.x + Math.sign(x - r.x)*hw; else z = r.z + Math.sign(z - r.z)*hd;
    }
  }
  return [x, z];
}
function moveTrainer(dx, dz){
  const [x, z] = resolveCollision(trainer.pos.x + dx, trainer.pos.z + dz, 0.35);
  trainer.pos.x = x; trainer.pos.z = z;
}

function freeAt(x, z, pad=0){
  if (!inRegion(x, z, regionAt(x), 3)) return false;
  if (nearPath(x, z, 1.2 + pad)) return false;
  if (rects.some(r => Math.abs(x - r.x) < r.hw + 2 + pad && Math.abs(z - r.z) < r.hd + 3 + pad)) return false;
  if (PATCHES.some(p => Math.hypot(x - p.x, z - p.z) < p.r + 1.5 + pad)) return false;

}

function snowPine(x, z, s, solid=true){

  const green = toon(pick(['#2f6d4a', '#2b6343', '#357a52'])), snow = toon('#ffffff');

  g.position.set(x, 0, z); g.rotation.y = rand(0, TAU); scene.add(g);
  if (solid) solidCircle(x, z, 0.85*s, 2*s);
}
function obsidian(x, z, s){
  const c = mesh(new T.OctahedronGeometry(1, 0), toon(pick(['#2e2440', '#3a2f52', '#261d36']))); c.scale.set(0.5*s, 1.5*s, 0.5*s); c.position.set(x, 1.0*s, z); c.rotation.set(rand(-0.2, 0.2), rand(0, TAU), rand(-0.2, 0.2)); outline(c, 1.06); scene.add(c);

const REGION_BUILDERS = [null, buildSertao, buildPico, buildBrejo, buildCratera];

/* ---------- Chefes ----------
   Cada mapa tem uma criatura mitológica no seu covil. Ela só existe até ser derrotada ou capturada (uma vez por save, em game.bosses)
   e deixa a chave do mapa seguinte; a última deixa a Coroa. Os portais dos Campos pros outros mapas ficam trancados sem a chave.
   O nível decide a forma: o Grifo já vem Grifo Real, a Hidra do brejo já tem sete cabeças. */
const BOSSES = [
  {region:0, species:'unicornio', level:12, x:-29, z:-19},
  {region:1, species:'esfinge', level:17, x:30, z:17},
  {region:2, species:'grifo', level:21, x:-29, z:22},
  {region:3, species:'hidra', level:26, x:28, z:-28},
  {region:4, species:'dragao', level:31, x:-27, z:28}
];
BOSSES.forEach(b => { b.name = formName(b.species, stageOf(b)); });
const KEY_NAMES = [null, 'Chave do Sertão', 'Chave do Pico', 'Chave do Brejo', 'Chave da Cratera'];
const unlocked = id => !id || game.keys.includes(id);
const LOCKED_COL = new T.Color('#8a8496');
for (const b of BOSSES){
  const r = REGIONS[b.region];
  b.x += r.cx;
  b.patch = {x:b.x, z:b.z, r:3.5, region:b.region};
  ZONES.push({name:'Covil: ' + b.name, x:b.x, z:b.z, r:4.5});
  // covil: chão escuro, roda de pedras e duas tochas

  const floor = mesh(new T.CircleGeometry(4, 32), lam('#4a3e3a'), false); floor.rotation.x = -Math.PI/2; floor.position.y = 0.021; g.add(floor);
  const rim = mesh(new T.RingGeometry(3.6, 4, 32), new T.MeshBasicMaterial({color:'#d9472b'}), false); rim.rotation.x = -Math.PI/2; rim.position.y = 0.025; g.add(rim);
  for (let i = 0; i < 10; i++){
    const a = i/10*TAU; if (Math.abs(wrapA(a - Math.PI/4)) < 0.4) continue;   // entrada virada pra câmera
    const st = mesh(new T.DodecahedronGeometry(0.35, 0), toon('#8f887b')); st.position.set(Math.cos(a)*4.3, 0.2, Math.sin(a)*4.3); st.rotation.set(rand(0, 1), rand(0, TAU), 0); outline(st, 1.06); g.add(st);
  }
  for (const sx of [-1, 1]){
    const a = Math.PI/4 + sx*0.55, x = Math.cos(a)*4.4, z = Math.sin(a)*4.4;
    const pole = mesh(GY, toon('#5a4632')); pole.scale.set(0.07, 1.6, 0.07); pole.position.set(x, 0.8, z); g.add(pole);
    const flame = new T.Group(); flame.position.set(x, 1.65, z); g.add(flame);
    const f1 = mesh(new T.ConeGeometry(0.16, 0.45, 8), new T.MeshBasicMaterial({color:'#ff8a1f'}), false); f1.position.y = 0.2; flame.add(f1);
    const f2 = mesh(new T.ConeGeometry(0.08, 0.28, 8), new T.MeshBasicMaterial({color:'#ffe066'}), false); f2.position.y = 0.16; flame.add(f2);
    fires.push(flame);
  }
}
function spawnBoss(b){
  const m = newMember(b.species, b.level);
  m.nick = b.name; m.boss = b.region; m.wildBoss = 1; m.maxHp = stats(m).maxHp; m.hp = m.maxHp;
  const c = makeCreature(m, b.x, b.z, 'wild');
  c.patch = b.patch; c.boss = b; c.cool = 2; b.c = c;
}
// avisa a pessoa por que o portal não abre
const lockMsg = to => `O portal pra ${REGIONS[to].name} está trancado. Vença ou capture ${BOSSES[to - 1].name}, o chefe de ${REGIONS[to - 1].name}, pra ganhar a ${KEY_NAMES[to]}.`;
// chave flutuando por cima do chefe vencido
const keyFx = [];
function dropKey(x, y, z, crown){
  const g = new T.Group(), gold = toon('#f2c230');
  if (crown){ add(g, GY, gold, [0, 0, 0], [0.3, 0.12, 0.3], null, true); for (let i = 0; i < 5; i++){ const a = i/5*TAU; add(g, GC, gold, [Math.sin(a)*0.27, 0.15, Math.cos(a)*0.27], [0.07, 0.18, 0.07], null, true); } }
  else {
    add(g, new T.TorusGeometry(0.16, 0.05, 8, 18), gold, [0, 0.22, 0], [1, 1, 1], null, true);
    add(g, GB, gold, [0, -0.12, 0], [0.07, 0.5, 0.07], null, true);
    add(g, GB, gold, [0.08, -0.3, 0], [0.13, 0.06, 0.06]); add(g, GB, gold, [0.07, -0.18, 0], [0.1, 0.06, 0.06]);
  }
  g.position.set(x, y, z); g.scale.setScalar(1.6); scene.add(g);
  keyFx.push({g, t:0});
  burst({x, y, z}, 30, ['#f2c230', '#fff1a8', '#ffffff'], 5); shockwave(x, z, '#f2c230', 4);
}
function updateKeyFx(dt){
  for (let i = keyFx.length - 1; i >= 0; i--){
    const k = keyFx[i]; k.t += dt;
    k.g.position.y += dt*(k.t < 1.2 ? 1.2 : 0.2); k.g.rotation.y += dt*5;
    if (k.t > 1.8) k.g.scale.setScalar(Math.max(0.01, 1.6*(1 - (k.t - 1.8)/0.6)));
    if (k.t > 2.4){ scene.remove(k.g); keyFx.splice(i, 1); }
  }
}
function bossReward(b, how){
  game.bosses[b.region] = how;
  const next = b.region + 1, last = !KEY_NAMES[next];
  if (!last && !game.keys.includes(next)) game.keys.push(next);
  if (last) game.crown = true;
  const p = b.c && b.c.torso ? b.c.torso.position : trainer.pos;
  dropKey(p.x, 1.6, p.z, last);
  trainer.cheerT = 3;
  showEvoText(last ? 'Você venceu o último chefe!' : `${b.name} deixou cair a`, last ? 'Coroa da Cratera!' : `${KEY_NAMES[next]}!`);
  setTimeout(() => { if (!evo) showEvoText('', ''); }, 2600);
  return last ? 'Você ganhou a Coroa da Cratera! Todos os chefes foram vencidos.' : `Você ganhou a ${KEY_NAMES[next]}! O portal pra ${REGIONS[next].name} está aberto.`;
}

// troca de mapa: só o mapa atual fica visível e com física; bichos selvagens dos outros somem
let curRegion = null;
function applyRegion(r){
  curRegion = r;
  for (const g of REGIONS){
    const on = g === r;
    g.root.visible = on;
    if (g.active === on) continue;
    g.active = on;
    for (const b of g.bodies){ if (on) world.addBody(b); else world.remove(b); }
  }
  SKY.set(r.sky); hemi.color.set(r.hemi[0]); hemi.groundColor.set(r.hemi[1]);
  ambFx.visible = !!r.fx; if (r.fx) ambFx.material.color.set(AMB_FX[r.fx].c);
  for (const w of wilds()) if (w.patch.region !== r.id) destroyCreature(w);
  cam.target.set(trainer.pos.x, 0.5, trainer.pos.z);
  currentArea = null;
  const el = $('area'); el.textContent = r.name; el.classList.add('show');
  clearTimeout(areaTimer); areaTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function travel(p){
  const to = REGIONS[p.to], a = portalArrival(p.b.region, p.to);
  mode = 'menu'; setPrompt('');
  $('fade').style.opacity = 1;
  setTimeout(() => {
    trainer.pos.set(a.x, 0, a.z); trainer.yaw = a.ry; trainer.moving = false;
    applyRegion(to);
    if (follower && !follower.removed) showTeleport(follower, a.x - Math.sin(a.ry)*1.6, a.z - Math.cos(a.ry)*1.6);
    game.map = to.id; save();
    for (const q of PATCHES) if (q.region === to.id){ let n = creatures.filter(c => c.patch === q).length; for (let i = 0; i < 6 && n < PER_PATCH; i++) if (spawnWild(q, false)) n++; }
    mode = 'world'; setHud();
    $('fade').style.opacity = 0;
    toast(`Você chegou em ${to.name}! (${to.lv})`);
  }, 500);
}
// partículas do clima de cada mapa (neve, brasas, vaga-lumes, poeira), sempre em volta da câmera
const AMB_FX = {snow:{c:'#ffffff', s:0.07}, embers:{c:'#ffb347', s:0.05}, fireflies:{c:'#e8ff7a', s:0.05}, dust:{c:'#e8d3a0', s:0.04}};
const AMB_N = 160, ambSeed = Array.from({length:AMB_N}, () => ({x:rand(0, 36), z:rand(0, 36), y:rand(0, 1), ph:rand(0, TAU), sp:rand(0.6, 1.4)}));
const ambFx = new T.InstancedMesh(new T.IcosahedronGeometry(1, 0), new T.MeshBasicMaterial({color:'#ffffff'}), AMB_N);
ambFx.frustumCulled = false; ambFx.visible = false; scene.add(ambFx);
const _amb = new T.Object3D(), wrap36 = v => ((v % 36) + 36) % 36 - 18;
function renderRegionFx(t){
  for (const f of portalFx){
    const open = unlocked(f.to);
    f.rings[0].rotation.z = t*2.2; f.rings[1].rotation.z = -t*3.1; f.gem.rotation.y = t*1.5; f.gem.position.y = 4.15 + Math.sin(t*2)*0.08;
    f.swirl.material.opacity = open ? 0.6 + Math.sin(t*3)*0.12 : 0.35; f.swirl.material.color.set(open ? f.col : LOCKED_COL);
    f.lock.visible = !open; f.lock.rotation.z = open ? 0 : Math.sin(t*1.5)*0.03;
  }
  lavaMat.color.setHSL(0.05 + Math.sin(t*1.7)*0.02, 1, 0.52 + Math.sin(t*2.3)*0.06);
  if (!ambFx.visible || !curRegion) return;
  const kind = curRegion.fx, base = AMB_FX[kind].s, cx = cam.target.x, cz = cam.target.z;
  ambSeed.forEach((p, i) => {
    let x = p.x, z = p.z, y, s = base;
    if (kind === 'snow'){ y = 9 - ((t*0.9*p.sp + p.y*9) % 9); x += Math.sin(t*0.7 + p.ph)*0.8 + t*0.4; }
    else if (kind === 'embers'){ y = (t*0.8*p.sp + p.y*6) % 6; x += Math.sin(t*1.3 + p.ph)*0.5; s *= 0.6 + Math.sin(t*9 + p.ph)*0.4; }
    else if (kind === 'fireflies'){ y = 0.5 + p.y*1.6 + Math.sin(t*1.1 + p.ph)*0.3; x += Math.sin(t*0.4*p.sp + p.ph)*1.5; z += Math.cos(t*0.3*p.sp + p.ph)*1.5; s *= Math.max(0, Math.sin(t*2*p.sp + p.ph)); }
    else { y = 0.15 + p.y*1.2; x += t*3*p.sp; z += Math.sin(t + p.ph)*0.5; }
    _amb.position.set(cx + wrap36(x - cx), y, cz + wrap36(z - cz)); _amb.scale.setScalar(Math.max(0.001, s)); _amb.updateMatrix(); ambFx.setMatrixAt(i, _amb.matrix);
  });
  ambFx.instanceMatrix.needsUpdate = true;
}
// ponto livre pra um morador (ignora o próprio colisor dele)
function npcFree(n, x, z, rad){
  if (!inRegion(x, z, regionAt(x), 1.5)) return false;
  for (const c of colliders) if (c !== n.col && Math.hypot(x - c.x, z - c.z) < c.r + rad) return false;
  for (const r of rects) if (Math.abs(x - r.x) < r.hw + rad && Math.abs(z - r.z) < r.hd + rad) return false;
  return true;
}
// só escolhe destinos que dá pra alcançar em linha reta, assim ninguém fica empurrando parede
function npcPickTarget(n){
  for (let tries = 0; tries < 12; tries++){
    const a = rand(0, TAU), d = rand(0.6, n.home.r);
    const tx = n.home.x + Math.cos(a)*d, tz = n.home.z + Math.sin(a)*d;
    const l = Math.hypot(tx - n.x, tz - n.z), steps = Math.ceil(l/0.25);

function updateNpcs(dt){
  for (const n of npcs){
    const dT = Math.hypot(trainer.pos.x - n.x, trainer.pos.z - n.z);
    const near = dT < 3.2 && mode === 'world';
    if (near && !n.talking){ n.talking = true; n.line = pick(n.lines); n.target = null; }
    if (!near) n.talking = false;
    n.moving = false;
    if (n.talking) n.yaw = lerpAngle(n.yaw, Math.atan2(trainer.pos.x - n.x, trainer.pos.z - n.z), 0.12);
    else if (!n.still){
      if (!n.target){
        n.wait -= dt;
        if (n.wait <= 0){ n.target = npcPickTarget(n); if (!n.target) n.wait = rand(0.5, 1.5); }
      } else {
        const dx = n.target.x - n.x, dz = n.target.z - n.z, l = Math.hypot(dx, dz);
        if (l < 0.2){ n.target = null; n.wait = rand(1.5, 5); }
        else {

          n.x = x; n.z = z; n.col.x = x; n.col.z = z;
          // travou (alguém no caminho, quina): se não chegou mais perto em ~0,6s, desiste e para
          const nl = Math.hypot(n.target.x - x, n.target.z - z);
          if (nl < n.target.best - 0.05){ n.target.best = nl; n.target.stuck = 0; }
          else if ((n.target.stuck += dt) > 0.6){ n.target = null; n.wait = rand(0.8, 2.5); continue; }
          n.yaw = lerpAngle(n.yaw, Math.atan2(dx, dz), 0.15); n.moving = true;
        }

    }
  }
}

const _tv1 = new T.Vector3(), _tv2 = new T.Vector3(), _tv3 = new T.Vector3(), _tv4 = new T.Vector3(), _tq = new T.Quaternion();
function updatePupils(c, head){
  const dt = 1/60, p = head.getWorldPosition(_tv4);
  if (!c._hp){ c._hp = p.clone(); c._hv = new T.Vector3(); }
  const v = _tv1.copy(p).sub(c._hp).divideScalar(dt);
  const a = _tv2.copy(v).sub(c._hv).divideScalar(dt);
  if (a.lengthSq() > 4e4) a.setLength(200);
  c._hp.copy(p); c._hv.copy(v);
  head.getWorldQuaternion(_tq).invert();
  const g = _tv3.set(0, -1, 0).applyQuaternion(_tq);
  a.applyQuaternion(_tq);
  for (const e of c.pupils){
    e.vx += (g.x*e.gk - a.x*0.9 - e.ux*e.k - e.vx*e.dmp)*dt;
    e.vy += (g.y*e.gk - a.y*0.9 - e.uy*e.k - e.vy*e.dmp)*dt;
    e.ux += e.vx*dt; e.uy += e.vy*dt;
    const l = Math.hypot(e.ux, e.uy);
    if (l > 1){ e.ux /= l; e.uy /= l; const dot = e.vx*e.ux + e.vy*e.uy; if (dot > 0){ e.vx -= dot*e.ux*1.4; e.vy -= dot*e.uy*1.4; } }
    const ox = e.ux*e.lim, oy = e.uy*e.lim;
    const k = Math.max(0, 1 - (ox*ox + oy*oy)/(e.Rx*e.Rx));
    e.m.position.set(e.cx + ox, e.cy + oy, e.cz + e.Rz*Math.sqrt(k)*0.98);
  }
}

      for (let i = 0; i < 7; i++){ const a = (i/6 - 0.5)*2.4; add(torso, GC, white, [Math.sin(a)*d.tw*0.9, d.th*0.35, d.tl*0.9], [0.09*s, 0.28*s, 0.05*s], [2.6, 0, a*0.5]); }
      tail = tailGroup(0, d.th*0.3, -d.tl*1.05);
      add(tail, GY, body, [0, -d.th*0.6, -d.tl*0.4], [0.035*s, d.tl*1.0, 0.035*s], [-0.9, 0, 0], true);
      add(tail, GS, dark, [0, -d.th*1.15, -d.tl*0.8], [0.07*s, 0.1*s, 0.07*s]);
      wings = mythWings(c, torso, dark, st > 1 ? stormMat : st ? gold : white, d.tw*[2.4, 2.9, 3.4][st]);
      if (st) for (let i = 0; i < 3; i++) add(head, GC, gold, [(i - 1)*0.18*r, 0.9*r, -0.3*r], [0.08*r, 0.55*r, 0.05*r], [-0.7, 0, (i - 1)*0.3], true);
      if (st > 1) for (const w of wings){
        const sx = w.userData.side, sp2 = d.tw*3.4;
        for (let k = 0; k < 3; k++) add(w, GB, stormMat, [sx*sp2*(0.35 + k*0.18), 0.05*sp2, -sp2*(0.05 + (k % 2)*0.12)], [0.16*sp2, 0.02*sp2, 0.03*sp2], [0, sx*(k % 2 ? 0.7 : -0.7), 0]);
      }

      break;
    }
    case 'hydra': {
      // Hidra: 3 cabeças -> 5 -> 7 (a da física e mais 2, 4 ou 6 em pescoços que balançam); a Ancestral ganha chifres de ouro
      serpentFace(head, r, sp, st > 1);
      c.sway = [];
      const n = [2, 4, 6][st];
      for (let i = 0; i < n; i++){
        const side = i % 2 ? 1 : -1, k = (i >> 1) + 1, lean = side*(0.22 + 0.2*k), fwd = 0.2;
        const neck = new T.Group(); neck.position.set(side*d.tw*(0.25 + 0.2*k), d.th*0.5, d.tl*0.75); neck.rotation.set(fwd, 0, -lean); torso.add(neck);
        const len = r*(2.6 + 0.45*k), hr = r*0.62;
        add(neck, GY, body, [0, len/2, 0], [hr*0.5, len, hr*0.5], null, true);
        add(neck, GY, light, [0, len/2, hr*0.22], [hr*0.36, len*0.95, hr*0.36]);
        const h = new T.Group(); h.position.y = len; h.rotation.set(-fwd + 0.15, 0, lean); neck.add(h);
        add(h, GS, body, [0, 0, 0], [hr, hr, hr], null, true);
        serpentFace(h, hr, sp, st > 1);
        makeEyes(h, hr, 0.4, 0.3, 0.62, 0.1, '#ffd23f');
        c.sway.push({g:neck, ph:i*1.7, bz:-lean});
      }
      for (let i = 0; i < 6; i++) add(torso, GC, dark, [0, d.th*1.15, d.tl*(0.6 - i*0.28)], [0.06*s, 0.18*s, 0.05*s], [-0.3, 0, 0]);
      tail = tailGroup(0, 0, -d.tl*1.0);
      add(tail, GC, body, [0, -d.th*0.1, -d.tl*1.1], [d.tw*0.5, d.tl*2.4, d.tw*0.35], [-Math.PI/2 - 0.08, 0, 0], true);
      eyeCfg = [0.4, 0.3, 0.62, 0.1, '#ffd23f'];
      break;
    }
    case 'dragon': {
      // Dragão -> Dragão Ancião (mais chifres, asas maiores) -> Dragão Imperador (chifres de ouro, couro rachado de lava, asas em brasa)
      const horn = st > 1 ? toon('#f2c230') : ivory;
      add(head, GS, body, [0, -0.15*r, 0.85*r], [0.55*r, 0.42*r, 0.85*r], null, true);
      add(head, GS, light, [0, -0.38*r, 0.85*r], [0.45*r, 0.12*r, 0.7*r]);
      for (const sx of [-1, 1]){
        add(head, GS, black, [sx*0.18*r, -0.02*r, 1.62*r], [0.06*r, 0.05*r, 0.05*r]);
        for (let i = 0; i <= st; i++) add(head, GC, horn, [sx*(0.45 + i*0.12)*r, (0.7 - i*0.15)*r, (-0.35 - i*0.2)*r], [0.13*r, (0.75 + 0.15*i)*r, 0.13*r], [-1.1, 0, -sx*(0.35 + i*0.25)], true);
        for (let i = 0; i < 3; i++) add(head, GC, ivory, [sx*0.3*r, -0.45*r, (1.0 + i*0.22)*r], [0.05*r, 0.14*r, 0.05*r], [Math.PI, 0, 0]);
      }
      for (let i = 0; i < 7; i++) add(torso, GC, st > 1 ? emberMat : dark, [0, d.th*1.15, d.tl*(0.8 - i*0.27)], [0.07*s, 0.2*s, 0.05*s], [-0.35, 0, 0]);
      tail = tailGroup(0, 0, -d.tl*1.0);
      add(tail, GC, body, [0, -d.th*0.05, -d.tl*1.1], [d.tw*0.5, d.tl*2.3, d.tw*0.35], [-Math.PI/2 - 0.1, 0, 0], true);
      add(tail, new T.OctahedronGeometry(1, 0), st > 1 ? emberMat : dark, [0, -d.th*0.25, -d.tl*2.25], [0.18*s, 0.05*s, 0.24*s]);
      wings = mythWings(c, torso, dark, toon(st > 1 ? '#ff7a2a' : st ? '#a8321e' : '#8a2a1e'), d.tw*[2.5, 3.1, 3.7][st], true);
      if (st > 1) for (let i = 0; i < 9; i++){ const a = rand(-1.3, 1.3); add(torso, GB, emberMat, [Math.sin(a)*d.tw*1.18, Math.cos(a)*d.th*1.2, rand(-0.8, 0.8)*d.tl], [0.03*s, 0.03*s, rand(0.15, 0.3)*s], [0, rand(-0.6, 0.6), a]); }

  }
  const ey = makeEyes(head, r, eyeCfg[0], eyeCfg[1], eyeCfg[2], eyeCfg[3], eyeCfg[4]);
  // boca boba: sorriso torto, língua que escapa e dentes de coelho
  let mouth = null, tongue = null, mouthAt = {y:-0.42*r, z:r};
  if (!sp.bird){
    const MZ = {bear:1.12, gorilla:1.02, kangaroo:1.22, monkey:1.02, rhino:1.5, boar:1.32, wolf:1.5, cheetah:1.0, fox:1.38,
      armadillo:1.25, lizard:1.4, salamander:1.4, yak:1.25, buffalo:1.25, hare:1.1, gator:2.1, frog:1.25, capybara:1.65,
      unicorn:1.55, sphinx:1.12, hydra:1.55, dragon:1.65};
    const mz = (MZ[sp.feat] || 1.0)*r*0.9, my = sp.plan === 'quad' ? -0.36*r : -0.42*r;
    mouthAt = {y:my, z:mz};
    mouth = add(head, GS, toon('#5a1a24'), [0.03*r, my, mz], [0.2*r, 0.07*r, 0.07*r], [0, 0, 0.12]);
    tongue = add(head, GS, toon('#ff7b93'), [0.07*r, my - 0.13*r, mz + 0.02*r], [0.1*r, 0.17*r, 0.05*r], null, true);
    tongue.visible = false;
    if (['bear','monkey','kangaroo','cheetah','gorilla','wolf','fox','hare','capybara','armadillo'].includes(sp.feat))
      for (const sx of [-1, 1]) add(head, GB, toon('#ffffff'), [sx*0.05*r + 0.02*r, my - 0.07*r, mz + 0.01*r], [0.08*r, 0.11*r, 0.03*r]);
  }
  const limb = (rad, half, tip, mat) => {
    const g = new T.Group();
    add(g, GY, mat, [0,0,0], [rad, half*2, rad], null, true);
    add(g, GS, mat, [0, half, 0], [rad, rad, rad], null, true);
    if (tip){ g.add(tip); tip.position.y = -half; }
    return g;
  };
  let list;
  if (c.plan === 'biped'){
    const arms = [0, 1].map(() => {
      if (sp.bird && !sp.stage){ const g = new T.Group(); add(g, GS, dark, [0, -d.al*0.1, -d.ar*0.5], [d.ar*0.7, d.al*1.15, d.ar*3.2], null, true); return g; }
      const fist = mesh(GS, sp.feat === 'gorilla' ? dark : body); fist.scale.setScalar(d.ar*1.45);
      return limb(d.ar, d.al, fist, body);
    });
    const legs = [0, 1].map(() => {
      const foot = mesh(GS, sp.bird ? toon(sp.bird) : dark);
      const big = sp.feat === 'kangaroo' || sp.feat === 'frog' ? 1.7 : 1;
      foot.scale.set(d.lr*1.3, d.lr*0.75, d.lr*1.8*big);
      const g = limb(d.lr, d.ll, foot, sp.bird ? toon(sp.bird) : body); foot.position.z = d.lr*0.5*big; return g;
    });
    if (sp.stage) addGear(c, torso, head, arms, legs, eyeCfg, mouthAt);
    list = [legs[0], legs[1], torso, arms[0], arms[1], head];
  } else {
    const legs = [0, 1, 2, 3].map(() => { const paw = mesh(GS, dark); paw.scale.set(d.lr*1.25, d.lr*0.7, d.lr*1.5); const g = limb(d.lr, d.ll, paw, body); paw.position.z = d.lr*0.3; return g; });
    list = [...legs, torso, head];
  }
  list.forEach(m => scene.add(m));
  c.meshes = list; c.eyes = ey.eyes; c.xeyes = ey.xs; c.pupils = ey.pupils; c.tail = tail; c.wings = wings || c.wingsBack || null; c.mouth = mouth; c.tongue = tongue; c.blepT = 0;
}

/* ---- Roupa das formas evoluídas ----
   Cada espécie tem o figurino de cada forma em EVO_KITS, montado com as peças de K (roupa, chapéu, coisa na mão, efeito).
   P = {c, sp, d, r, s, torso, head, arms, legs, eye, mouth}; arms[1] é a mão direita. Na mão, o "pra frente" é +z do braço. */
const GHEMI = new T.SphereGeometry(1, 16, 8, 0, TAU, 0, Math.PI/2), GOCT = new T.OctahedronGeometry(1, 0);

const K = {

  boots(P, col){ const {d} = P; for (const g of P.legs) add(g, GY, kc(col), [0, -d.ll*0.65, 0], [d.lr*1.4, d.ll*0.6, d.lr*1.4], null, true); },
  belt(P, col='#3a2618', buckle=GOLD){ const {d, s} = P; add(P.torso, GY, kc(col), [0, -d.th*0.55, 0], [d.tw*1.1, d.th*0.18, d.td*1.2]); if (buckle) add(P.torso, GB, kc(buckle), [0, -d.th*0.55, d.td*1.2], [d.tw*0.36, d.th*0.24, 0.035*s]); },
  champBelt(P){ const {d, s} = P; K.belt(P, '#2a2140', null); add(P.torso, GY, kc(GOLD), [0, -d.th*0.55, d.td*1.2], [d.tw*0.5, 0.04*s, d.tw*0.4], [Math.PI/2, 0, 0], true); add(P.torso, GS, kc('#d9472b'), [0, -d.th*0.55, d.td*1.26], [0.06*s, 0.06*s, 0.03*s]); },
  shirt(P, col, sleeves=true){ const {d} = P, m = kc(col); add(P.torso, GS, m, [0, d.th*0.08, 0], [d.tw*1.23, d.th*1.0, d.td*1.34], null, true); if (sleeves) for (const a of P.arms) add(a, GY, m, [0, d.al*0.5, 0], [d.ar*1.35, d.al*0.95, d.ar*1.35], null, true); },

  robe(P, col){ const {d} = P, h = d.ll*2 + d.th*1.1; K.shirt(P, col); add(P.torso, GC, kc(col), [0, d.th*0.55 - h*0.5, 0], [d.tw*1.55, h, d.td*1.75], null, true); },

  jetpack(P){ const {d, s} = P; for (const sx of [-1, 1]){ add(P.torso, GY, kc('#9aa3b5'), [sx*d.tw*0.35, d.th*0.2, -d.td*1.45], [d.tw*0.3, d.th*1.3, d.tw*0.3], null, true); add(P.torso, GC, emberMat, [sx*d.tw*0.35, -d.th*0.75, -d.td*1.45], [d.tw*0.2, d.th*0.5, d.tw*0.2], [Math.PI, 0, 0]); } add(P.torso, GB, kc('#d9472b'), [0, d.th*0.3, -d.td*1.4], [d.tw*0.4, d.th*0.6, 0.05*s]); },

  // ---- cabeça

  kabuto(P, col){ const {r} = P, m = kc(col); K.helmet(P, col, false); for (const sx of [-1, 1]){ add(P.head, GB, m, [sx*0.95*r, 0.3*r, -0.15*r], [0.12*r, 0.5*r, 0.85*r], [0, 0, sx*0.45], true); add(P.head, GC, kc(GOLD), [sx*0.32*r, 1.15*r, 0.6*r], [0.08*r, 0.85*r, 0.05*r], [0.2, 0, -sx*0.55], true); } add(P.head, GY, kc(GOLD), [0, 0.8*r, 0.85*r], [0.14*r, 0.04*r, 0.14*r], [Math.PI/2, 0, 0]); },

  knight(P, col, plume){ const {r} = P, m = kc(col); K.helmet(P, col, false); for (const sx of [-1, 1]) add(P.head, GB, m, [sx*0.82*r, 0.05*r, 0.35*r], [0.12*r, 0.6*r, 0.5*r], [0, sx*0.4, 0], true);

  crown(P, col=GOLD){ const {r} = P, cr = new T.Group(); cr.position.set(0, 0.88*r, -0.05*r); cr.rotation.x = -0.12; P.head.add(cr);

  laurel(P, col){ const {r} = P; for (let i = 0; i < 14; i++){ const a = i/14*TAU; if (Math.abs(wrapA(a)) < 0.35) continue; add(P.head, GS, kc(col), [Math.sin(a)*0.92*r, 0.55*r, Math.cos(a)*0.92*r], [0.11*r, 0.06*r, 0.22*r], [0, a, 0.5]); } },
  wizardHat(P, col, star){ const {r} = P, hat = new T.Group(); hat.position.set(0, 0.72*r, -0.05*r); hat.rotation.set(-0.15, 0, 0.12); P.head.add(hat);

  hood(P, col){ const {r} = P; add(P.head, GHEMI, kc(col), [0, 0.15*r, -0.25*r], [1.15*r, 1.05*r, 1.05*r], [-0.25, 0, 0], true); add(P.head, GC, kc(col), [0, 0.95*r, -0.75*r], [0.3*r, 0.6*r, 0.3*r], [-1.2, 0, 0], true); },

let creatures = [];
function makeCreature(member, x, z, role){

    const armR = mk(new C.Box(new C.Vec3(d.ar, d.al, d.ar)), 0.55, x + shX, y + shY - d.al, z);

      P(torso, [-shX, shY, 0], armL, [0, d.al, 0]), P(torso, [shX, shY, 0], armR, [0, d.al, 0]),
      P(torso, [-hipX, -d.th, 0], legL, [0, d.ll, 0]), P(torso, [hipX, -d.th, 0], legR, [0, d.ll, 0])

    H = 2*d.ll + d.th*0.8;
    const y = H + 0.05;

    const hy = d.th*0.5 + d.hr*0.3, hz = d.tl*0.95 + d.hr*0.8;

    member, sp, st, s, d, H, plan:sp.plan, role, slot, parts, joints, torso, head, arms, legs, grabbers, strikers, reach,
    power:st.power, defense:st.defense,
    yaw: rand(0, TAU), grounded:false, ko:0, stun:0, wobble:0, confused:0, fainted:false, removed:false, dead:false,
    punchT:[0,0], punchSide:0, biteT:0, atkCd:0, attackT:0, hitCd:0, envCd:0, thrownT:0, thrownBy:null,
    special:null, specialT:0, specialCd:1, specialPhase:0, specialClock:0,

// Membros sempre presos: o solver deixa as juntas esticarem em pancadas fortes, então depois de cada
// passo da física a parte que se afastou volta pra junta e perde a velocidade que a puxava pra longe
const JOINT_SLACK = 0.02, _ja = new C.Vec3(), _jb = new C.Vec3();
function fixJoints(){
  for (const c of creatures){
    if (c.removed || c.role === 'puppet') continue;
    for (const j of c.joints){
      const A = j.bodyA, B = j.bodyB;
      A.quaternion.vmult(j.pivotA, _ja); _ja.vadd(A.position, _ja);
      B.quaternion.vmult(j.pivotB, _jb); _jb.vadd(B.position, _jb);
      const ex = _ja.x - _jb.x, ey = _ja.y - _jb.y, ez = _ja.z - _jb.z, e = Math.sqrt(ex*ex + ey*ey + ez*ez);
      if (e <= JOINT_SLACK) continue;
      const k = (e - JOINT_SLACK)/e;
      B.position.x += ex*k; B.position.y += ey*k; B.position.z += ez*k;
      const nx = ex/e, ny = ey/e, nz = ez/e, va = A.velocity, vb = B.velocity;
      const rel = (vb.x - va.x)*nx + (vb.y - va.y)*ny + (vb.z - va.z)*nz;
      if (rel < 0){ vb.x -= nx*rel; vb.y -= ny*rel; vb.z -= nz*rel; }
    }
  }
}
function hideCreature(c){

  releaseGrabs(c, false);
  for (const o of creatures) if (o !== c && o.grabs.some(g => g.owner === c)) releaseGrabs(o, false);
  c.joints.forEach(j => world.removeConstraint(j));
  c.parts.forEach(p => world.removeBody(p));
  c.meshes.forEach(m => m.visible = false);
  c.removed = true;
}
function showCreature(c, x, y, z){
  const t = c.torso.position, ox = x - t.x, oy = y - t.y, oz = z - t.z;
  for (const p of c.parts){ p.position.x += ox; p.position.y += oy; p.position.z += oz; p.velocity.set(0, 3, 0); p.angularVelocity.set(0, 0, 0); world.addBody(p); }
  c.joints.forEach(j => world.addConstraint(j));
  c.meshes.forEach(m => m.visible = true);

}
function destroyCreature(c){

function syncCreature(c){
  if (c.role !== 'puppet') c.parts.forEach((p, i) => { const m = c.meshes[i]; m.position.copy(p.position); m.quaternion.copy(p.quaternion); });
  const ko = c.ko > 0 || c.fainted;
  c.eyes.visible = !ko; c.xeyes.visible = ko;
  if (ko) c.xeyes.children.forEach((s, i) => { s.rotation.z = clock*(i ? -9 : 9); });
  const head = c.meshes[c.meshes.length - 1];
  if (!c.removed || c.role === 'puppet') updatePupils(c, head);
  const hs = c.role === 'puppet' && c._hv ? Math.hypot(c._hv.x, c._hv.z) : Math.hypot(c.torso.velocity.x, c.torso.velocity.z);
  if (c.tail) c.tail.rotation.y = Math.sin(clock*(hs > 0.5 ? 14 : 5) + c.slot)*(ko ? 0 : hs > 0.5 ? 0.5 : 0.25);
  // asas batem forte correndo ou no ar; pescoços extras da hidra balançam
  if (c.wings){ const fast = hs > 0.5 || !c.grounded; for (const w of c.wings){ const sd = w.userData.side; w.rotation.z = ko ? -sd*0.3 : sd*(0.25 + Math.sin(clock*(fast ? 11 : 2.2) + c.slot)*(fast ? 0.55 : 0.12)); } }

    c.blepT -= 1/60;
    if (c.blepT < -4 && Math.random() < 0.004) c.blepT = rand(0.8, 1.6);
    c.tongue.visible = ko || hs > 2.6 || c.blepT > 0 || c.biteT > 0;
    c.tongue.rotation.z = Math.sin(clock*(hs > 2.6 ? 22 : 6))*0.35;
    const open = c.attackT > 0 || c.specialT > 0 || c.grabs.length || ko;
    c.mouth.scale.y = c.d.hr*(open ? 0.17 : 0.07);
  }
  if (c.fade < 1) c.meshes.forEach(m => m.scale.setScalar(Math.max(0.01, c.fade)));

    const torsoMesh = c.meshes[c.parts.indexOf(c.torso)];
    const b = ko ? 0 : Math.sin(clock*3.2 + c.slot*1.7)*0.035;
    torsoMesh.scale.set(1 + b, 1 - b*0.7, 1 + b);
  }
}

    else if (c.sp.bird){ yawLocal2(c.yaw, AX, 0.1, AZ, side*(stepping || !c.grounded ? 0.5 + Math.sin(clock*18)*0.4 : 0.15), _ql); str = 8; bl = 0.3; }
    else yawLocal2(c.yaw, AX, -0.15 + (stepping ? (i ? -sw : sw)*0.6 : 0), AZ, side*0.2, _ql);

const dist2 = (a, b) => Math.hypot(a.torso.position.x - b.torso.position.x, a.torso.position.z - b.torso.position.z);
function launch(c, from, hor, up){
  const dx = c.torso.position.x - from.x, dz = c.torso.position.z - from.z, l = Math.hypot(dx, dz) || 1;
  c.parts.forEach(p => { p.velocity.x += dx/l*hor; p.velocity.z += dz/l*hor; p.velocity.y += up; });
  c.wobble = 0.8;
}

/* agarrar */
function tryGrab(c, part, other, at){
  if (c.grabCd > 0 || c.grabs.length >= c.grabbers.length || c.grabs.some(g => g.arm === part)) return;
  const ow = other.owner;
  if (!ow || ow === c || ow.removed) return;
  const pivB = new C.Vec3(); other.pointToLocalFrame(at, pivB);
  const con = new C.PointToPointConstraint(part, part.tip, other, pivB, 300 + c.st.str*12);
  world.addConstraint(con);
  if (!c.grabs.length) c.grabT = 0;
  c.grabs.push({arm:part, con, part:other, owner:ow});
  if (c.grabs.length === 1) toast(c.plan === 'quad' ? `${c.member.nick} mordeu e segurou ${ow.member.nick}!` : `${c.member.nick} agarrou ${ow.member.nick}!`);
}
function releaseGrabs(c, fling){
  const f = fwdOf(c);
  for (const g of c.grabs){
    world.removeConstraint(g.con);
    if (fling && g.owner && !g.owner.removed){
      const k = Math.min(1.4, c.power);
      g.owner.parts.forEach(p => { p.velocity.x += f.x*9*k; p.velocity.z += f.z*9*k; p.velocity.y += 6*k; });
      g.owner.wobble = 1; g.owner.thrownT = 1.4; g.owner.thrownBy = c;
    }
  }
  if (fling && c.grabs.some(g => g.owner)) toast('Arremessou!');
  c.grabs = [];
}

/* especiais */
function doSpecial(c){
  const o = opponentOf(c);
  c.special = c.sp.special; c.specialCd = c.st.specCd; c.specialClock = 0; c.specialPhase = 0;
  toast(`${c.member.nick} usou ${c.sp.specialName}!`);
  const t = c.torso, f = fwdOf(c), sp = c.st.specPow;
  const toOpp = () => { if (!o) return {x:f.x, z:f.z, d:3}; const dx = o.torso.position.x - t.position.x, dz = o.torso.position.z - t.position.z, d = Math.hypot(dx, dz) || 1; return {x:dx/d, z:dz/d, d}; };
  switch (c.special){
    case 'dash': c.specialT = 0.5; c.parts.forEach(p => p.velocity.set(f.x*15, 2.5, f.z*15)); break;
    case 'slam': c.specialT = 1.4; c.parts.forEach(p => p.velocity.y = 12); break;
    case 'quake':
      c.specialT = 0.4; shake(0.45); shockwave(t.position.x, t.position.z, '#c9a67d', 5);
      c.punchT[0] = c.punchT[1] = 0.25;
      if (o && dist2(o, c) < 5 && o.grounded){ damage(o, 11*c.power*adv(c, o)/o.defense, o.torso.position, c, true); o.stun += 22; launch(o, t.position, 2, 10); }
      break;
    case 'pounce': {
      const v = toOpp(); c.specialT = 0.8; c.yaw = Math.atan2(v.x, v.z);
      const h = Math.min(11, v.d*3.2);
      c.parts.forEach(p => p.velocity.set(v.x*h, 7, v.z*h));
      break;
    }
    case 'blitz': c.specialT = 1.1; c.specialPhase = 0; break;
    case 'kick': c.specialT = 0.6; c.parts.forEach(p => p.velocity.set(f.x*7, 6.5, f.z*7)); break;
    case 'throw': {
      c.specialT = 0.3; c.punchT[c.punchSide] = 0.25;
      const target = o ? o.torso.position : {x:t.position.x + f.x*5, y:0.5, z:t.position.z + f.z*5};
      throwRock(c, target);
      break;
    }
    case 'hypno':
      c.specialT = 0.5;
      for (let i = 0; i < 3; i++) setTimeout(() => shockwave(t.position.x, t.position.z, '#b07cff', 4), i*120);
      if (o && dist2(o, c) < 5){
        o.confused = 1.5 + sp*1.2; o.stun += 15; o.wobble = 0.8;
        damage(o, 5*sp*adv(c, o), o.head.position, c, true);
        toast(`${o.member.nick} ficou confuso!`);
      }
      break;
    case 'blink': {
      c.specialT = 0.4;
      if (o){
        const of = fwdOf(o);
        burst(t.position, 14, ['#ffffff','#ffb36b'], 3);
        hideCreature(c);
        showCreature(c, o.torso.position.x - of.x*1.3, c.H + 0.1, o.torso.position.z - of.z*1.3);
        c.wobble = 0; c.yaw = Math.atan2(of.x, of.z);
        c.parts.forEach(p => p.velocity.set(0, 0, 0));
        burst(c.torso.position, 14, ['#ffffff','#ffb36b'], 3);
        if (Math.random() >= o.st.dodge){
          damage(o, 9*sp*adv(c, o)/o.defense, o.torso.position, c, true);
          o.stun += 12; launch(o, c.torso.position, 3, 2);
        } else floatText(o.head.position, 'esquivou!', '#b9f5c8', 20);
      }
      break;
    }
  }
}
function updateSpecial(c, dt){
  if (c.specialT <= 0) return;
  c.specialClock += dt;
  const t = c.torso, o = opponentOf(c);
  if (c.special === 'slam'){
    if (c.specialPhase === 0 && c.specialClock > 0.42){
      c.specialPhase = 1;
      const f = fwdOf(c);
      const dx = o ? o.torso.position.x - t.position.x : f.x*2, dz = o ? o.torso.position.z - t.position.z : f.z*2;
      c.parts.forEach(p => p.velocity.set(clamp(dx*2.2, -9, 9), -22, clamp(dz*2.2, -9, 9)));
    }
    if (c.specialPhase === 1 && c.grounded && t.velocity.y > -2){
      c.specialPhase = 2; shockwave(t.position.x, t.position.z, '#c9a67d'); shake(0.25);
      if (o && dist2(o, c) < 2.8){ damage(o, 10*c.power*adv(c, o)/o.defense, o.torso.position, c, true); launch(o, t.position, 6, 7); }
    }
  }
  if (c.special === 'blitz'){
    const n = Math.floor(c.specialClock/0.35);
    if (n >= c.specialPhase && c.specialPhase < 3){
      c.specialPhase++;
      let vx = Math.sin(c.yaw), vz = Math.cos(c.yaw);
      if (o){ const dx = o.torso.position.x - t.position.x, dz = o.torso.position.z - t.position.z, l = Math.hypot(dx, dz) || 1; vx = dx/l; vz = dz/l; c.yaw = Math.atan2(vx, vz); }
      c.parts.forEach(p => p.velocity.set(vx*14, 1.5, vz*14));
      c.hitCd = 0;
    }
    burst(t.position, 1, ['#f6e7c4','#e3b04b'], 1.5);
  }
  if (c.special === 'dash') burst(t.position, 1, ['#e8e2d6','#bdb7ad'], 2);
}

/* pedras do macaco */
const rocks = [];
const rockGeo = new T.DodecahedronGeometry(0.16, 0);
function throwRock(c, target){
  const f = fwdOf(c);
  const sx = c.head.position.x + f.x*0.4, sy = c.head.position.y + 0.2, sz = c.head.position.z + f.z*0.4;
  const tx = target.x, ty = (target.y || 0.5) + 0.2, tz = target.z;
  const tf = clamp(Math.hypot(tx - sx, tz - sz)/12, 0.3, 0.9);
  const b = new C.Body({mass:0.4, shape:new C.Sphere(0.15), material:bodyMat, position:new C.Vec3(sx, sy, sz), collisionFilterGroup:G_BALL, collisionFilterMask:ALL & ~G_TRAINER & ~G_BALL});
  b.ignore = c;
  b.velocity.set((tx - sx)/tf, (ty - sy + 0.5*GRAV*tf*tf)/tf, (tz - sz)/tf);
  b.isRock = true; b.thrower = c; b.spent = false; b.born = clock;
  b.addEventListener('collide', e => onCollide(b, e.body));
  world.addBody(b);
  const m = mesh(rockGeo, c.sp.feat === 'dragon' ? emberMat : toon(c.sp.rock || '#8f887b')); scene.add(m);
  rocks.push({body:b, mesh:m});

/* ================= Dano ================= */
const hitQueue = [];
function onCollide(part, other){
  const rel = Math.min(40, part.velocity.vsub(other.velocity).norm());
  hitQueue.push([part, other, rel]);
}
function processContacts(){
  for (const eq of world.contacts){
    for (const [x, y, r] of [[eq.bi, eq.bj, eq.ri], [eq.bj, eq.bi, eq.rj]]){
      if (x.tip && x.owner && x.owner.grabHeld && !x.owner.removed && x.owner.grabbers.includes(x) && y.owner && y.owner !== x.owner){
        tryGrab(x.owner, x, y, new C.Vec3(x.position.x + r.x, x.position.y + r.y, x.position.z + r.z));
      }
    }
  }
}
function processHits(){
  for (const [a, b, rel] of hitQueue){
    if (a.isBall){ if (!a.used && b.owner && battle && b.owner === battle.wild) startCapture(a); continue; }
    if (a.isRock){
      if (a.spent) continue;
      a.spent = true;
      const o = b.owner, th = a.thrower;
      if (o && o !== th && battle && !battle.over && ((th === battle.mon && o === battle.wild) || (th === battle.wild && o === battle.mon))){
        if (Math.random() < o.st.dodge) floatText(o.head.position, 'esquivou!', '#b9f5c8', 20);
        else { damage(o, 8*th.st.specPow*adv(th, o)/o.defense, a.position, th, true, b.kind === 'head'); o.stun += 14; launch(o, a.position, 3, 2); }
      }
      burst(a.position, 6, ['#8f887b','#c9c2b4'], 2);
      continue;
    }
    const oa = a.owner; if (!oa || oa.removed) continue;
    if (b.owner && b.owner !== oa) tryHit(oa, a, b.owner, b, rel);
    else if (b.isGround || b.isStatic) envHit(oa, a, rel);
  }
  hitQueue.length = 0;
}
const BODY_SPECIALS = ['dash','slam','pounce','blitz'];
function dangerous(c, part){
  if (c.ko > 0 || c.fainted) return false;
  if (BODY_SPECIALS.includes(c.special) && c.specialT > 0) return true;
  if (c.special === 'kick' && c.specialT > 0 && part.kind === 'leg') return true;
  return c.strikers.includes(part) && c.attackT > 0;
}
let lastAdvMsg = 0;
function tryHit(att, ap, def, dp, rel){
  if (!battle || battle.over || !dangerous(att, ap) || att.hitCd > 0) return;
  if (!((att === battle.mon && def === battle.wild) || (att === battle.wild && def === battle.mon))) return;
  const base = rel - 3.5; if (base <= 0) return;
  att.hitCd = 0.2;
  if (Math.random() < def.st.dodge){ floatText(dp.position, 'esquivou!', '#b9f5c8', 20); return; }
  const special = att.specialT > 0 && (BODY_SPECIALS.includes(att.special) || att.special === 'kick');
  let dmg = clamp(base*1.3, 2, 11)*att.power*adv(att, def)*(dp.kind === 'head' ? 1.4 : 1)/def.defense;
  if (special) dmg *= 0.8 + 0.25*att.st.specPow;
  launch(def, att.torso.position, (special ? 4 : 2.5)*Math.min(1.4, att.power), special ? 3 : 1.5);
  damage(def, dmg, dp.position, att, special, dp.kind === 'head');
}
function envHit(c, part, rel){
  if (!battle || battle.over || c.envCd > 0 || rel < 9) return;
  if (c !== battle.mon && c !== battle.wild) return;
  if ((BODY_SPECIALS.includes(c.special) || c.special === 'kick') && c.specialT > 0) return;
  if (part.kind !== 'head' && part.kind !== 'torso') return;
  c.envCd = 0.35;
  damage(c, Math.min(30, rel - 9)*2.2*(part.kind === 'head' ? 1.4 : 1)*(c.thrownT > 0 ? 1.3 : 1), part.position, c.thrownT > 0 ? c.thrownBy : null, false);
}
function damage(def, dmg, pos, att, special, head){
  if (def.fainted || !battle || battle.over) return;
  dmg = Math.max(1, Math.round(dmg));
  def.member.hp = Math.max(0, def.member.hp - dmg);
  def.stun += dmg*1.3; def.wobble = 0.45;
  floatText(pos, '-' + dmg, head ? '#ff4b4b' : '#ffffff', dmg >= 15 ? 34 : 26);
  if (head) floatText({x:pos.x, y:pos.y + 0.5, z:pos.z}, 'na cabeça!', '#ffe066', 17);
  burst(pos, 6 + Math.min(14, dmg), ['#ffffff', '#ffe066', def.sp.color], 4);
  shake(Math.min(0.35, 0.06 + dmg*0.012));
  if (att && clock - lastAdvMsg > 2.5){
    const e = adv(att, def);
    if (e > 1){ toast(`${ATTR[att.sp.attr].name} vence ${ATTR[def.sp.attr].name}! Dano extra.`); lastAdvMsg = clock; }
    else if (e < 1 && special){ toast(`${ATTR[def.sp.attr].name} resiste a ${ATTR[att.sp.attr].name}...`); lastAdvMsg = clock; }
  }
  if (def.member.hp <= 0){ def.fainted = true; releaseGrabs(def, false); toast(`${def.member.nick} desmaiou!`); }
  else if (def.stun > 45 && def.ko <= 0){ def.ko = 2; def.stun = 0; toast(`${def.member.nick} ficou nocauteado!`); }
}

// nuvenzinhas de poeira (passos e aterrissagens)
const puffs = [];
const puffMat = new T.MeshLambertMaterial({color:'#fffaf0', transparent:true, opacity:0.85});
function puff(x, z, size, n){
  for (let i = 0; i < n && puffs.length < 70; i++){
    const m = new T.Mesh(GS, puffMat.clone());
    const a = rand(0, TAU), d = rand(0, size*0.6);
    m.position.set(x + Math.cos(a)*d, size*0.3, z + Math.sin(a)*d);
    m.scale.setScalar(size*rand(0.25, 0.45));
    scene.add(m);
    puffs.push({m, vx:Math.cos(a)*size*1.2, vz:Math.sin(a)*size*1.2, life:0, max:rand(0.35, 0.6), s0:m.scale.x});
  }
}
function updatePuffs(dt){
  for (let i = puffs.length - 1; i >= 0; i--){
    const p = puffs[i]; p.life += dt;
    const k = p.life/p.max;
    p.m.position.x += p.vx*dt; p.m.position.z += p.vz*dt; p.m.position.y += dt*0.4;
    p.m.scale.setScalar(p.s0*(1 + k*1.2)); p.m.material.opacity = 0.85*(1 - k);
    if (k >= 1){ scene.remove(p.m); p.m.material.dispose(); puffs.splice(i, 1); }
  }
}
const rings = [];

  m.rotation.x = -Math.PI/2; m.position.set(x, 0.05, z); scene.add(m);

}
const shake = a => { cam.shake = Math.max(cam.shake, a); };
const floats = [];

const portraits = {};
const prt = new T.WebGLRenderTarget(256, 256);
const prCam = new T.PerspectiveCamera(28, 1, 0.1, 50);
// recebe o membro (a forma depende do nível) ou só a espécie
function portrait(m){
  const species = m.species || m, st = m.species ? stageOf(m) : 0, key = species + st;
  if (portraits[key]) return portraits[key];
  const c = makeCreature(newMember(species, st ? EVO_LV[st - 1] : 5), 1000, 1000, 'preview');
  syncCreature(c);
  const sz = c.plan === 'quad' ? Math.max(c.H + c.d.hr*2, c.d.tl*2.6) : c.H + c.d.th + c.d.hr*2.2;
  const cx = 1000, cy = c.plan === 'quad' ? c.H*0.8 : sz*0.48, cz = c.plan === 'quad' ? 1000 + c.d.tl*0.45 : 1000;
  const dist = sz*2.1 + 0.45;
  prCam.position.set(cx + dist*0.45, cy + dist*0.3, cz + dist*0.85); prCam.lookAt(cx, cy, cz);
  scene.background = null; renderer.setClearColor(0x000000, 0);
  renderer.setRenderTarget(prt); renderer.clear(); renderer.render(scene, prCam); renderer.setRenderTarget(null);
  scene.background = SKY;
  const buf = new Uint8Array(256*256*4);
  renderer.readRenderTargetPixels(prt, 0, 0, 256, 256, buf);
  const cv = document.createElement('canvas'); cv.width = cv.height = 256;
  const g = cv.getContext('2d'), img = g.createImageData(256, 256);
  for (let y = 0; y < 256; y++) img.data.set(buf.subarray((255 - y)*1024, (256 - y)*1024), y*1024);
  g.putImageData(img, 0, 0);
  destroyCreature(c);
  return portraits[key] = cv.toDataURL();
}

const itemIcons = {};

let follower = null;
function spawnFollower(){
  if (follower){ destroyCreature(follower); follower = null; }
  const m = game.team.find(x => x.hp > 0);
  if (!m) return;
  if (game.team[0] !== m){ game.team.splice(game.team.indexOf(m), 1); game.team.unshift(m); }
  const f = trainerFwd();
  follower = makeCreature(m, trainer.pos.x - f.x*1.6, trainer.pos.z - f.z*1.6, 'follower');

}
// Cada área de mato mantém PER_PATCH animais; quando falta um, outro sai do mato depois de alguns segundos
const PER_PATCH = 2;
function spawnWild(p, popOut){
  if (creatures.length > MAX_CREATURES - 3) return false;
  for (let tries = 0; tries < 12; tries++){
    const a = rand(0, TAU), d = Math.sqrt(Math.random())*(p.r - 1);
    const x = p.x + Math.cos(a)*d, z = p.z + Math.sin(a)*d;
    if (Math.hypot(x - trainer.pos.x, z - trainer.pos.z) < 3.5) continue;
    if (battle && Math.hypot(x - battle.center.x, z - battle.center.z) < battle.R + 1.5) continue;
    const m = newMember(pick(p.pool), Math.round(rand(p.lv[0], p.lv[1])));
    const c = makeCreature(m, x, z, 'wild'); c.patch = p; c.cool = 2;
    if (popOut){ c.parts.forEach(b => b.velocity.y = 6); burst({x, y:0.4, z}, 12, ['#4aaa4f','#5fae4f','#8fd27a'], 3); }
    return true;
  }
  return false;
}
const wilds = () => creatures.filter(c => c.role === 'wild');
function updateSpawns(dt){
  for (const p of PATCHES){
    if (p.region !== curRegion.id) continue;
    p.timer = (p.timer || 0) - dt;
    const n = creatures.filter(c => c.patch === p && (c.role === 'wild' || c.role === 'enemy')).length;
    if (n < PER_PATCH && p.timer <= 0){ if (spawnWild(p, true)) p.timer = rand(5, 9); else p.timer = 1; }
  }
  // chefe do mapa: volta pro covil enquanto não for vencido (se você perdeu, ele reaparece inteiro)
  for (const b of BOSSES){
    if (b.region !== curRegion.id || game.bosses[b.region] || (b.c && !b.c.dead)) continue;
    if (Math.hypot(b.x - trainer.pos.x, b.z - trainer.pos.z) < 7 || creatures.length > MAX_CREATURES - 3) continue;
    spawnBoss(b);
  }
  // animais que se perderam (caíram ou saíram muito da área) voltam pro mato
  for (const w of wilds()){
    if (w.removed) continue;
    const t = w.torso.position;
    if (t.y < -3 || Math.hypot(t.x - w.patch.x, t.z - w.patch.z) > w.patch.r + 8) destroyCreature(w);
  }
}

function aiWander(c, dt){
  const ai = c.ai, inp = c.input = {};
  const t = c.torso.position, p = c.patch;
  ai.t -= dt;
  if (ai.t <= 0){
    ai.t = rand(1.5, 4);
    if (Math.random() < 0.35) ai.target = null;
    else { const a = rand(0, TAU), d = Math.sqrt(Math.random())*(p.r - 1); ai.target = {x:p.x + Math.cos(a)*d, z:p.z + Math.sin(a)*d}; }
    if (Math.random() < 0.15) inp.jump = true;
  }
  if (ai.target){
    const dx = ai.target.x - t.x, dz = ai.target.z - t.z, l = Math.hypot(dx, dz);
    if (l > 0.4){ inp.mx = dx/l*0.35; inp.mz = dz/l*0.35; } else ai.target = null;
  }
  if (Math.hypot(trainer.pos.x - t.x, trainer.pos.z - t.z) < 6) inp.face = {x:trainer.pos.x, z:trainer.pos.z};
}
function aiFollow(c){ aiFollowTo(c, trainer.pos.x, trainer.pos.z, trainer.yaw); }
function aiFollowTo(c, px, pz, yaw){
  const inp = c.input = {};
  const tx = px - Math.sin(yaw)*1.6, tz = pz - Math.cos(yaw)*1.6;
  const t = c.torso.position, dx = tx - t.x, dz = tz - t.z, l = Math.hypot(dx, dz);
  if (l > 14 || t.y < -3){ showTeleport(c, tx, tz); return; }
  if (l > 0.8){ const k = clamp(l/2.5, 0, 1); inp.mx = dx/l*k; inp.mz = dz/l*k; }
  if (l > 3 && Math.random() < 0.01) inp.jump = true;
}
function showTeleport(c, x, z){ hideCreature(c); showCreature(c, x, c.H + 0.3, z); }
function aiFight(c, dt){
  const inp = c.input = {};
  const o = opponentOf(c);
  if (!o || o.fainted || c.ko > 0) return;
  const ai = c.ai; ai.t -= dt;
  const agg = 0.55 + 0.05*c.member.level;
  const t = c.torso.position, dx = o.torso.position.x - t.x, dz = o.torso.position.z - t.z, dist = Math.hypot(dx, dz) || 0.01;
  const ranged = c.sp.special === 'throw' || c.sp.special === 'hypno';
  const want = ranged && c.specialCd > 0.2 ? c.reach : ranged ? 3.5 : c.reach;
  if (ai.t <= 0){
    ai.t = rand(0.2, 0.5)/agg;
    ai.mode = dist > want*1.1 ? 'approach' : pick(['fight','fight','circle','retreat']);
    ai.side = Math.random() < 0.5 ? 1 : -1;
    if (Math.random() < 0.07*agg && dist < c.reach + 0.5 && !ai.grabFor) ai.grabFor = rand(1.2, 2.2);
  }
  let mx = 0, mz = 0;
  const ux = dx/dist, uz = dz/dist;
  if (ai.mode === 'approach'){ mx = ux; mz = uz; }
  else if (ai.mode === 'retreat'){ mx = -ux*0.7; mz = -uz*0.7; }
  else if (ai.mode === 'circle'){ mx = -uz*ai.side*0.7 + ux*0.2; mz = ux*ai.side*0.7 + uz*0.2; }
  if (ai.grabFor > 0){
    ai.grabFor -= dt; inp.grab = true;
    if (c.grabs.some(g => g.owner)){ inp.lift = true; mx = -ux*0.3; mz = -uz*0.3; if (ai.grabFor < 0.2) ai.grabFor = 0; }
    else { mx = ux; mz = uz; }
    if (ai.grabFor <= 0){ ai.grabFor = 0; inp.grab = false; }
  }
  inp.mx = mx; inp.mz = mz; inp.face = o.torso.position;
  if (!inp.grab && dist < c.reach && Math.random() < 0.09*agg) inp.punch = true;
  const specRange = {throw:7, hypno:4.5, blink:8, pounce:6, blitz:7, dash:5, kick:2.5, slam:4, quake:4.5}[c.sp.special] || 3;
  if (c.specialCd <= 0 && dist < specRange && Math.random() < 0.02*agg) inp.special = true;
  if (Math.random() < 0.004) inp.jump = true;
}

let battle = null;

const ringMesh = new T.Mesh(new T.RingGeometry(6.4, 6.7, 64), new T.MeshBasicMaterial({color:'#ffffff', transparent:true, opacity:0.75, side:T.DoubleSide}));
ringMesh.rotation.x = -Math.PI/2; ringMesh.visible = false; scene.add(ringMesh);

function opponentOf(c){
  if (!battle) return null;
  const o = c === battle.mon ? battle.wild : c === battle.wild ? battle.mon : null;
  return o && !o.removed ? o : null;
}
function startBattle(w){

  mode = 'battle';
  const tx = trainer.pos.x, tz = trainer.pos.z, wp = w.torso.position;
  const dx = wp.x - tx, dz = wp.z - tz, l = Math.hypot(dx, dz) || 1;

  } else toast(`Um ${w.member.nick} selvagem (Nv. ${w.member.level}, ${ATTR[w.sp.attr].name}) apareceu! Vai, ${battle.mon.member.nick}!`);
